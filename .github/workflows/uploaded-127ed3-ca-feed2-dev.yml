name: uploaded 127ed3 CARROT2 feed2 burned dev

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/workflows/uploaded-127ed3-ca-feed2-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact safety-v3 parent, feed2 child, and v147
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          python -m pip install --no-deps 'kaggle-environments==1.32.7'; if ($LASTEXITCODE -ne 0) { throw 'kaggle-environments install failed' }
          python -m pip install jsonschema requests; if ($LASTEXITCODE -ne 0) { throw 'dependency install failed' }
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          @'
          import base64,gzip,hashlib
          from pathlib import Path
          root=Path('ci/uploaded_127ed3')
          raw=gzip.decompress(base64.b64decode(''.join((root/f'part{i:02d}.b64').read_text(encoding='ascii') for i in range(12))))
          assert hashlib.sha256(raw).hexdigest()=='127ed3e62988c0474d386db6527ae8ca9de9bb1fe7004128557ddef67126c652'
          src=raw.decode('utf-8'); assert src.count('_CA_FEED_DAYS = 1')==1
          suffix='''\n\n# Safety-only wrapper v3: delete/reinsert agent so Kaggle namespace-order loader selects it.\n_SAFE_V3_PARENT = ig_agent\ntry:\n    del agent\nexcept Exception:\n    pass\ndef agent(observation, configuration=None):\n    try:\n        return _SAFE_V3_PARENT(observation, configuration)\n    except Exception:\n        return {"farmer": ["PASS"], "hands": [], "market": []}\nagent.telemetry = _SAFE_V3_PARENT.telemetry\n'''
          parent=(src+suffix).encode('utf-8')
          cand=(src.replace('_CA_FEED_DAYS = 1','_CA_FEED_DAYS = 2',1)+suffix).encode('utf-8')
          Path('tmp/parent.py').write_bytes(parent); Path('tmp/feed2.py').write_bytes(cand)
          assert hashlib.sha256(parent).hexdigest()=='87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df'
          assert hashlib.sha256(cand).hexdigest()=='a2e69e32513280051709bfc921104a3574bc87f484e6a0d1c07466a377e8cc26'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'candidate reconstruction/hash verification failed' }
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'newline normalization failed' }
          Push-Location tmp; patch --binary --batch -p3 -i ..\ci\v76.patch; if ($LASTEXITCODE -ne 0) { throw 'patch failed' }; Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v77 entrypoint patch failed' }
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py; if ($LASTEXITCODE -ne 0) { throw 'v115 reconstruction failed' }
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py; if ($LASTEXITCODE -ne 0) { throw 'v147 reconstruction failed' }
          @'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('tmp/v147.py').read_bytes()).hexdigest()=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v147 hash verification failed' }
          python -m py_compile tmp\parent.py tmp\feed2.py tmp\v147.py; if ($LASTEXITCODE -ne 0) { throw 'py_compile failed' }
      - name: Burned ten-seed ablation and champion comparison
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,statistics,math
          from pathlib import Path
          from scripts.eval import evaluate
          seeds=[641,350003,101,211,347,509,733,911,1201,1601]
          def block(a,b,label):
              rows=[]; exa=exb=0
              for seed in seeds:
                  # Serial is deliberate: Windows ProcessPool cannot reliably spawn
                  # from an inline `python -` __main__ module.
                  s=evaluate(a,b,pairs=1,jobs=1,seed_start=seed); exa+=s['exceptions']['a']; exb+=s['exceptions']['b']
                  vals=[float(g['money'][0])-float(g['money'][1]) for g in s['matches_detail']]
                  v=statistics.mean(vals); rows.append({'seed':seed,'seat_deltas':vals,'pair_mean_delta':v,'outcome':'W' if v>0 else 'L' if v<0 else 'D'})
              vals=[r['pair_mean_delta'] for r in rows]; se=statistics.stdev(vals)/math.sqrt(len(vals))
              return {'label':label,'wld':{k:sum(r['outcome']==k for r in rows) for k in 'WLD'},'mean':statistics.mean(vals),'median':statistics.median(vals),'se':se,'mean_minus_2se':statistics.mean(vals)-2*se,'worst':min(vals),'best':max(vals),'exceptions_a':exa,'exceptions_b':exb,'rows':rows}
          out={'candidate_sha256':'a2e69e32513280051709bfc921104a3574bc87f484e6a0d1c07466a377e8cc26','parent_sha256':'87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df','champion_sha256':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923','candidate_minus_parent':block('tmp/feed2.py','tmp/parent.py','feed2_minus_safety_v3'),'candidate_minus_champion':block('tmp/feed2.py','tmp/v147.py','feed2_minus_v147')}
          print(json.dumps(out,indent=2)); Path('results/feed2_dev.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          assert out['candidate_minus_parent']['exceptions_a']==0 and out['candidate_minus_parent']['exceptions_b']==0
          assert out['candidate_minus_champion']['exceptions_a']==0 and out['candidate_minus_champion']['exceptions_b']==0
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'burned dev evaluation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-ca-feed2-dev-exact-parent
          path: results/
          if-no-files-found: error
          retention-days: 30
