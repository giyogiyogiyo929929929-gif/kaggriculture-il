name: v147 market helper snippet

on:
  push:
    branches: [eval-v150-v147-singleton-hardcell-20260926]
    paths: [".github/workflows/v147-market-helper-snippet.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct exact v147 and extract helpers
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize=@'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@
          $normalize | python -
          Push-Location tmp; patch --binary --batch -p3 -i ..\ci\v76.patch; if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }; Pop-Location
          $append=@'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          $extract=@'
          import ast, hashlib
          from pathlib import Path
          p=Path('tmp/v147.py'); src=p.read_text(encoding='utf-8')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'
          tree=ast.parse(src)
          wanted={'_v111_reorder','_r37_quote_priority','_r37_market_price','_v44y_clone_gate','_v105_standard'}
          chunks=[]
          for node in tree.body:
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in wanted:
                  chunks.append(f'### {node.name}\n'+ast.get_source_segment(src,node)+'\n')
          # Include nearby constants/report initialization used by v111.
          for needle in ('_V111_REPORT', '_V111_'):
              idx=src.find(needle)
              if idx>=0:
                  a=max(0,src.rfind('\n',0,max(0,idx-1200)))
                  b=min(len(src),idx+2200)
                  chunks.append(f'### CONTEXT {needle}\n'+src[a:b]+'\n')
          Path('results/v147_market_helpers.txt').write_text('\n'.join(chunks),encoding='utf-8')
          print('\n'.join(chunks))
          '@
          $extract | python -
      - uses: actions/upload-artifact@v4
        with:
          name: v147-market-helper-snippet
          path: results/v147_market_helpers.txt
          if-no-files-found: error
          retention-days: 30
