name: v154 v151 preflight telemetry

on:
  pull_request:
    branches: [eval-v154-v151-dense-self-exposure-port-20260927]
    paths: [".ci/triggers/v154-preflight-telemetry", ".github/workflows/v154-v151-preflight-telemetry.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct exact v151 and build v154
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path="$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v150_skip_noop_second_pass.py tmp\v147.py tmp\v150.py
          python ci\build_v151_none_observation_guard.py tmp\v150.py tmp\v151.py
          python ci\build_v154_v151_dense_self_exposure.py tmp\v151.py tmp\v154.py
          python -m py_compile tmp\v151.py tmp\v154.py
          @'
          import hashlib
          from pathlib import Path
          expected='54edf1f1663b161457c6d31daccb68b496e5a61dffb6f140f69af2e0b380bf31'
          got=hashlib.sha256(Path('tmp/v151.py').read_bytes()).hexdigest()
          assert got==expected,(got,expected)
          cand=hashlib.sha256(Path('tmp/v154.py').read_bytes()).hexdigest()
          assert cand=='9643521253a9c3bb41e27d103353f76ac7e805d91cb838559b8227bc93bff593',cand
          print('v151_sha256='+got)
          print('v154_sha256='+cand)
          '@ | python -

      - name: Kaggle loader and malformed observation preflight
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('.').resolve()))
          from scripts import preflight
          p=Path('tmp/v154.py')
          checks=[
              preflight.check_last_callable(p),
              preflight.check_imports([p]),
              preflight.check_kaggle_loader(p),
          ]
          agent=preflight.load_like_kaggle(p)
          checks += [preflight.check_action_shape(agent), preflight.check_fallback(agent)]
          out=[{'name':c.name,'ok':c.ok,'detail':c.detail} for c in checks]
          Path('results/v154_preflight.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          assert all(c.ok for c in checks),out
          '@ | python -

      - name: Internal telemetry error gate on consumed panels
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts/analysis').resolve()))
          import _common as C

          hard={
            'peak_2950':'opponents/peak_2950/main.py',
            'salem_2900':'opponents/salem_2900/main.py',
            'score_2820':'opponents/score_2820/main.py',
            'jaxa_2802':'opponents/jaxa_2802/main.py',
            'thomas_router_95':'opponents/thomas_router_95/main.py',
            'tetsutani_ms':'opponents/tetsutani_ms/main.py',
            'melon_squeeze':'opponents/melon_squeeze/main.py',
            'shop_router_v7':'opponents/shop_router_v7/main.py',
          }
          rows=[]
          totals={'games':0,'eligible':0,'changed':0,'errors':0}
          def one(opponent,seed,swap,label):
              mine=C.load('tmp/v154.py')
              C.play(C.wrap(mine),opponent,seed,swap=swap)
              t=dict(getattr(mine,'telemetry',{}) or {})
              row={'panel':label,'opponent':opponent,'seed':seed,'swap':swap,'telemetry':t}
              rows.append(row)
              totals['games']+=1
              for k in ('eligible','changed','errors'): totals[k]+=int(t.get(k,0) or 0)
              if int(t.get('errors',0) or 0): raise RuntimeError(row)
          for seed in range(681,693):
              for swap in (False,True): one('tmp/v151.py',seed,swap,'burned_direct')
          for name,opp in hard.items():
              for seed in range(520101,520105):
                  for swap in (False,True): one(opp,seed,swap,'hard_'+name)
          out={'candidate':'v154','champion':'v151','sign':'normal-game internal telemetry only','totals':totals,'rows':rows}
          Path('results/v154_internal_telemetry.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({'totals':totals},indent=2))
          assert totals['errors']==0,out
          assert totals['changed']>0,out
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v154-v151-preflight-telemetry
          path: results/
          if-no-files-found: error
          retention-days: 30
