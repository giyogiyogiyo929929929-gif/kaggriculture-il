name: uploaded 127ed3 safety-v3 exact-v134 regression

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/workflows/uploaded-127ed3-safe-v3-v134-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v134:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact engine and reconstruct safety-v3 / v147
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          python -m pip install --no-deps 'kaggle-environments==1.32.7'; if ($LASTEXITCODE -ne 0) { throw 'kaggle-environments install failed' }
          python -m pip install jsonschema requests; if ($LASTEXITCODE -ne 0) { throw 'dependency install failed' }
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          @'
          import base64,gzip,hashlib,importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          assert importlib.metadata.version('kaggle-environments')=='1.32.7'
          assert hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          root=Path('ci/uploaded_127ed3')
          raw=gzip.decompress(base64.b64decode(''.join((root/f'part{i:02d}.b64').read_text(encoding='ascii') for i in range(12))))
          assert hashlib.sha256(raw).hexdigest()=='127ed3e62988c0474d386db6527ae8ca9de9bb1fe7004128557ddef67126c652'
          suffix=b'''\n\n# Safety-only wrapper v3: delete/reinsert agent so Kaggle namespace-order loader selects it.\n_SAFE_V3_PARENT = ig_agent\ntry:\n    del agent\nexcept Exception:\n    pass\ndef agent(observation, configuration=None):\n    try:\n        return _SAFE_V3_PARENT(observation, configuration)\n    except Exception:\n        return {"farmer": ["PASS"], "hands": [], "market": []}\nagent.telemetry = _SAFE_V3_PARENT.telemetry\n'''
          safe=raw+suffix
          Path('tmp/safe_v3.py').write_bytes(safe)
          assert hashlib.sha256(safe).hexdigest()=='87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'safety-v3 reconstruction/hash verification failed' }
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'newline normalization failed' }
          Push-Location tmp; patch --binary --batch -p3 -i ..\ci\v76.patch; if ($LASTEXITCODE -ne 0) { throw 'patch failed' }; Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v77 entrypoint patch failed' }
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py; if ($LASTEXITCODE -ne 0) { throw 'v115 reconstruction failed' }
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py; if ($LASTEXITCODE -ne 0) { throw 'v147 reconstruction failed' }
          @'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('tmp/v147.py').read_bytes()).hexdigest()=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v147 hash verification failed' }

      - name: Recover historical exact-v134 builder and reconstruct opponent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          git fetch origin eval-v130-v121-exact-20260925
          if ($LASTEXITCODE -ne 0) { throw 'historical v130 branch fetch failed' }
          git show origin/eval-v130-v121-exact-20260925:eval_assets/v130/rebuild_eval_agents.py | Out-File -FilePath tmp\rebuild_v130.py -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'recover rebuild_eval_agents.py failed' }
          git show origin/eval-v130-v121-exact-20260925:eval_assets/v130/build_v134.py | Out-File -FilePath tmp\build_v134.py -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'recover build_v134.py failed' }
          python tmp\rebuild_v130.py --out-dir tmp\v130_hist
          if ($LASTEXITCODE -ne 0) { throw 'v130 historical reconstruction failed' }
          python tmp\build_v134.py --v130 tmp\v130_hist\v130_candidate_late_town_draw_gate24.py --out tmp\v134.py
          if ($LASTEXITCODE -ne 0) { throw 'v134 reconstruction failed' }
          @'
          import hashlib
          from pathlib import Path
          p=Path('tmp/v134.py')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          print('v134_sha256',got)
          assert got=='693ca693378f8adae5d57642610ca682e43a03ad636be71141e1615a5e2d1edd'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'exact v134 hash verification failed' }
          python -m py_compile tmp\safe_v3.py tmp\v147.py tmp\v134.py
          if ($LASTEXITCODE -ne 0) { throw 'py_compile failed' }

      - name: Burned exact-v134 known-opponent regression 350001-350006
        run: |
          $ErrorActionPreference='Stop'
          python ci\eval_candidate_vs_champion_panel.py --candidate tmp\safe_v3.py --champion tmp\v147.py --opponent tmp\v134.py --seed-start 350001 --seed-count 6 --jobs 1 --out results\v134_regression.json
          if ($LASTEXITCODE -ne 0) { throw 'v134 regression evaluation failed' }
          @'
          import json
          from pathlib import Path
          p=Path('results/v134_regression.json'); d=json.loads(p.read_text(encoding='utf-8'))
          assert d['candidate_exceptions']==0 and d['champion_exceptions']==0
          out={k:d[k] for k in ('opponent','wins','losses','ties','candidate_minus_champion_mean','candidate_minus_champion_se','worst','best','seat0_mean','seat1_mean','candidate_exceptions','champion_exceptions')}
          print('EXACT_V134_GATE',json.dumps(out,indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v134 result gate failed' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-safe-v3-exact-v134-regression
          path: results/
          if-no-files-found: error
          retention-days: 30
