name: v112-v125 day10 melon probe
on:
  push:
    branches: [eval/v112-v125-day10-melon-probe-20260927]
    paths:
      - '.github/workflows/v112-v125-day10-melon-probe-selfhosted.yml'
      - 'experiments/v112_v116_milk_micro/run_v125_day10_melon_probe.py'
concurrency:
  group: v112-v125-day10-melon-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engine and reconstruct v112
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          Set-Location experiments\v112_v116_milk_micro
          python build_sources.py
          python -m py_compile run_v125_day10_melon_probe.py
      - name: Run day10 melon probe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location experiments\v112_v116_milk_micro
          python run_v125_day10_melon_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v112-v125-day10-melon-probe
          path: experiments/v112_v116_milk_micro/v125_day10_melon_probe.json
