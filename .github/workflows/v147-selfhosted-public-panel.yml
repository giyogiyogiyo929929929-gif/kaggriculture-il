name: v147 self-hosted public panel

on:
  push:
    branches: [eval-v115-v142-exposure-20260925]
    paths:
      - ".github/workflows/v147-selfhosted-public-panel.yml"
      - "ci/build_v147_confirmed_v111_clone.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact engine and expose GNU patch
        run: |
          $ErrorActionPreference = 'Stop'
          $gitUsr = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path = "$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'; print('engine='+kaggle_environments.__version__)"

      - name: Build exact v115 v140 v147
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path tmp,results,results\calibration,results\v147 | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize = @'
          from pathlib import Path
          for name in ("tmp/main.py", "ci/v76.patch"):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b"\r\n",b"\n"))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append = @'
          from pathlib import Path
          p=Path("tmp/main.py")
          p.write_bytes(p.read_bytes()+b"\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n")
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          if ($LASTEXITCODE -ne 0) { throw 'exact v115 reconstruction failed' }
          python ci\build_v140_v92_k2_isolated.py tmp\v115.py tmp\v140.py
          if ($LASTEXITCODE -ne 0) { throw 'v140 build failed' }
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          if ($LASTEXITCODE -ne 0) { throw 'v147 build failed' }
          python -m py_compile tmp\v115.py tmp\v140.py tmp\v147.py
          $code = @'
          import hashlib
          from pathlib import Path
          exp={'tmp/v115.py':'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2','tmp/v147.py':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'}
          for p,want in exp.items():
              got=hashlib.sha256(Path(p).read_bytes()).hexdigest(); print(p,got); assert got==want,(p,got,want)
          '@
          $code | python -

      - name: Reproduce historical v140 public panel exactly
        run: |
          $ErrorActionPreference = 'Stop'
          function Run-Panel([string]$name,[string]$opp) {
            python ci\eval_candidate_vs_champion_panel.py --candidate tmp\v140.py --champion tmp\v115.py --opponent $opp --seed-start 641 --seed-count 4 --jobs 2 --out "results\calibration\$name.json"
            if ($LASTEXITCODE -ne 0) { throw "v140 calibration failed: $name" }
          }
          Run-Panel 'starter' 'starter'
          Run-Panel 'beat_v48' 'opponents\beat_v48\main.py'
          Run-Panel 'bl_v20' 'opponents\bl_v20\main.py'
          Run-Panel 'bl_v21' 'opponents\bl_v21\main.py'
          Run-Panel 'farming_v2' 'opponents\farming_v2\main.py'
          Run-Panel 'frontier_prvsiyan' 'opponents\frontier_prvsiyan\main.py'
          $code = @'
          import json
          from pathlib import Path
          expected={'starter':[190.0,5.0,0.0,26.0],'beat_v48':[1.0,-16.0,-1.0,0.0],'bl_v20':[0.0,22.0,0.0,8.0],'bl_v21':[0.0,22.0,0.0,8.0],'farming_v2':[1.0,-16.0,-1.0,0.0],'frontier_prvsiyan':[93.0,2.0,-1.0,0.0]}
          for name,want in expected.items():
              d=json.loads(Path(f'results/calibration/{name}.json').read_text(encoding='utf-8'))
              got=[float(r['candidate_minus_champion_money']) for r in d['rows']]
              print('CAL',name,got)
              assert got==want,(name,got,want)
              assert d['candidate_exceptions']==0 and d['champion_exceptions']==0
          print('historical_v140_panel_reproduced=true')
          '@
          $code | python -

      - name: Evaluate v147 public panel seeds 641-644
        run: |
          $ErrorActionPreference = 'Stop'
          function Run-Panel([string]$name,[string]$opp) {
            python ci\eval_candidate_vs_champion_panel.py --candidate tmp\v147.py --champion tmp\v115.py --opponent $opp --seed-start 641 --seed-count 4 --jobs 2 --out "results\v147\$name.json"
            if ($LASTEXITCODE -ne 0) { throw "v147 panel failed: $name" }
          }
          Run-Panel 'starter' 'starter'
          Run-Panel 'beat_v48' 'opponents\beat_v48\main.py'
          Run-Panel 'bl_v20' 'opponents\bl_v20\main.py'
          Run-Panel 'bl_v21' 'opponents\bl_v21\main.py'
          Run-Panel 'farming_v2' 'opponents\farming_v2\main.py'
          Run-Panel 'frontier_prvsiyan' 'opponents\frontier_prvsiyan\main.py'

      - name: Aggregate v147 candidate_minus_champion
        if: always()
        run: |
          $code = @'
          import glob,json,math,statistics
          from pathlib import Path
          panels=[]
          for p in sorted(glob.glob('results/v147/*.json')):
              d=json.load(open(p,encoding='utf-8')); d['panel_name']=Path(p).stem; panels.append(d)
          vals=[float(r['candidate_minus_champion_money']) for p in panels for r in p.get('rows',[])]
          n=len(vals); mean=statistics.fmean(vals) if vals else 0.0; se=statistics.stdev(vals)/(n**0.5) if n>1 else 0.0
          out={'candidate':'v147_confirmed_v111_clone','candidate_sha256':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923','champion':'v115_champion_same_turn_open_squeeze','champion_sha256':'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2','engine':'kaggle_environments==1.32.7','seeds':'641-644 burned public panel','panel_count':len(panels),'paired_rows':n,'wins':sum(x>0 for x in vals),'losses':sum(x<0 for x in vals),'draws':sum(x==0 for x in vals),'mean_candidate_minus_champion':mean,'se':se,'mean_minus_2se':mean-2*se,'worst_regression':min(vals) if vals else None,'best_improvement':max(vals) if vals else None,'candidate_exceptions':sum(int(p.get('candidate_exceptions',0)) for p in panels),'champion_exceptions':sum(int(p.get('champion_exceptions',0)) for p in panels),'panels':[{'name':p['panel_name'],'wins':p['wins'],'losses':p['losses'],'ties':p['ties'],'mean':p['candidate_minus_champion_mean'],'worst':p['worst'],'best':p['best'],'rows':[{'seed':r['seed'],'diff':r['candidate_minus_champion_money']} for r in p['rows']]} for p in panels]}
          Path('results/v147_summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps(out,indent=2))
          if n==24:
              assert out['candidate_exceptions']==0 and out['champion_exceptions']==0
              assert out['worst_regression'] >= 0, out
          '@
          $code | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v147-selfhosted-public-panel
          path: results/
          if-no-files-found: error
          retention-days: 30
