name: v145 room guard planned-SELL reserve focused

on:
  push:
    branches: [eval-v115-v144-public-room-guard-20260925]
    paths:
      - ".github/workflows/v145-room-guard-reserve-focused.yml"
      - "ci/build_v145_room_guard_planned_reserve.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact engine
        run: |
          $ErrorActionPreference = 'Stop'
          $gitUsr = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path = "$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
      - name: Reconstruct exact v115 and build candidates
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize = @'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name)
              p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append = @'
          from pathlib import Path
          p=Path('tmp/main.py')
          p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v144_public_room_guard.py tmp\v115.py tmp\v144.py
          python ci\build_v145_room_guard_planned_reserve.py tmp\v115.py tmp\v145.py
          python -m py_compile tmp\v115.py tmp\v144.py tmp\v145.py ci\build_v145_room_guard_planned_reserve.py
          $check = @'
          import hashlib
          from pathlib import Path
          p=Path('tmp/v115.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2'
          a=Path('tmp/v144.py').read_text(encoding='utf-8')
          b=Path('tmp/v145.py').read_text(encoding='utf-8')
          assert a.count("'room_guard': True") == 1
          assert b.count("'room_guard': True") == 1
          assert 'for protect_future in (True, False):' not in a
          assert b.count('for protect_future in (True, False):') == 1
          print('static_delta_ok')
          '@
          $check | python -
      - name: Direct burned-seed screen v144 and v145 vs exact v115
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import json
          from scripts.eval import play_match
          seeds=(683,689,693)
          specs={'v144':'tmp/v144.py','v145':'tmp/v145.py'}
          out={'purpose':'burned focused development only; not promotion evidence','champion':'exact_v115','seeds':list(seeds),'candidates':{}}
          for name,spec in specs.items():
              rows=[]
              for seed in seeds:
                  games=[]
                  for swap in (False,True):
                      r=play_match(spec,'tmp/v115.py',seed,swap,jobs if False else None)
                      games.append({'swap':swap,'candidate_money':r['money'][0],'champion_money':r['money'][1],
                                    'candidate_minus_champion':r['money'][0]-r['money'][1],
                                    'exceptions':r['exceptions'],'timings':r['timings'],'steps':r['steps']})
                  pair=sum(g['candidate_minus_champion'] for g in games)/2.0
                  rows.append({'seed':seed,'pair_delta':pair,'games':games})
              out['candidates'][name]={'rows':rows,'mean_pair_delta':sum(r['pair_delta'] for r in rows)/len(rows),
                                       'worst_pair_delta':min(r['pair_delta'] for r in rows),
                                       'best_pair_delta':max(r['pair_delta'] for r in rows)}
          v144={r['seed']:r['pair_delta'] for r in out['candidates']['v144']['rows']}
          expected={683:492.0,689:-84.0,693:479.0}
          assert v144==expected,(v144,expected)
          v145={r['seed']:r['pair_delta'] for r in out['candidates']['v145']['rows']}
          out['v145_minus_v144_pair_delta']={str(s):v145[s]-v144[s] for s in seeds}
          open('results/v145_focused.json','w',encoding='utf-8').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          '@
          $script | python -
          if ($LASTEXITCODE -ne 0) { throw 'focused evaluation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v145-room-guard-reserve-focused
          path: results/
          if-no-files-found: error
          retention-days: 30
