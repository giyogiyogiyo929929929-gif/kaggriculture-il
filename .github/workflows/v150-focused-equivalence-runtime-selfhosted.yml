name: v150 focused equivalence and runtime

on:
  push:
    branches: [eval-v147-resume-selfhosted-20260926]
    paths: [".github/workflows/v150-focused-equivalence-runtime-selfhosted.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct v115 v147 v150
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          Push-Location tmp; patch --binary --batch -p3 -i ..\ci\v76.patch; if ($LASTEXITCODE -ne 0) { throw 'patch failed' }; Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v150_skip_noop_second_pass.py tmp\v147.py tmp\v150.py
          python -m py_compile tmp\v115.py tmp\v147.py tmp\v150.py
          @'
          import hashlib
          from pathlib import Path
          for p in ('tmp/v115.py','tmp/v147.py','tmp/v150.py'):
              print(p, hashlib.sha256(Path(p).read_bytes()).hexdigest(), Path(p).stat().st_size)
          assert hashlib.sha256(Path('tmp/v115.py').read_bytes()).hexdigest()=='c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2'
          assert hashlib.sha256(Path('tmp/v147.py').read_bytes()).hexdigest()=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'
          '@ | python -
      - name: Compare exact action traces and runtime
        run: |
          $ErrorActionPreference='Stop'
          @'
          import gc, importlib.util, json, math, statistics, sys, time, traceback
          from pathlib import Path
          from kaggle_environments import make

          SEEDS=[681,682,689,691,692]
          REPS=2
          uid=0
          def load(path):
              global uid; uid+=1
              p=Path(path).resolve(); name=f'_v150eval_{uid}'
              spec=importlib.util.spec_from_file_location(name,p); m=importlib.util.module_from_spec(spec); sys.modules[name]=m
              sys.path.insert(0,str(p.parent))
              try: spec.loader.exec_module(m)
              finally: sys.path.remove(str(p.parent))
              return m
          def q(vals,p):
              s=sorted(vals); return s[max(0,min(len(s)-1,math.ceil(p*len(s))-1))]
          class CaptureTimed:
              def __init__(self,fn): self.fn=fn; self.actions=[]; self.ms=[]
              def __call__(self,obs,cfg=None):
                  t=time.perf_counter_ns(); out=self.fn(obs,cfg); self.ms.append((time.perf_counter_ns()-t)/1e6)
                  self.actions.append(out); return out
          def run_one(path,seed,seat):
              m=load(path); champ=load('tmp/v115.py').agent; cap=CaptureTimed(m.agent)
              agents=[cap,champ] if seat==0 else [champ,cap]
              env=make('kaggriculture',configuration={'seed':seed},debug=True); env.run(agents)
              statuses=[x.get('status') for x in env.state]; rewards=[x.get('reward') for x in env.state]
              if statuses != ['DONE','DONE']: raise RuntimeError((path,seed,seat,statuses))
              return {'actions':cap.actions,'ms':cap.ms,'statuses':statuses,'rewards':rewards,
                      'v111':dict(getattr(m,'_V111_REPORT',{})),'v147':dict(getattr(m,'_V147_REPORT',{}))}

          rows=[]; all147=[]; all150=[]; mismatches=[]; errors=[]
          assert gc.isenabled()
          for rep in range(REPS):
            for seed in SEEDS:
              for seat in (0,1):
                try:
                  a=run_one('tmp/v147.py',seed,seat); b=run_one('tmp/v150.py',seed,seat)
                  same_actions=(a['actions']==b['actions']); same_rewards=(a['rewards']==b['rewards'])
                  if not same_actions:
                      first=next((i for i,(x,y) in enumerate(zip(a['actions'],b['actions'])) if x!=y),None)
                      mismatches.append({'rep':rep,'seed':seed,'seat':seat,'first_action_mismatch':first})
                  if not same_rewards: mismatches.append({'rep':rep,'seed':seed,'seat':seat,'reward147':a['rewards'],'reward150':b['rewards']})
                  all147 += a['ms']; all150 += b['ms']
                  rows.append({'rep':rep,'seed':seed,'seat':seat,'same_actions':same_actions,'same_rewards':same_rewards,
                               'v147_v111':a['v111'],'v150_v111':b['v111'],'v147_report':a['v147'],'v150_report':b['v147'],
                               'v147_max_ms':max(a['ms']),'v150_max_ms':max(b['ms'])})
                except Exception as e:
                  errors.append({'rep':rep,'seed':seed,'seat':seat,'error':repr(e),'traceback':traceback.format_exc()})
          def stats(v): return {'calls':len(v),'median_ms':statistics.median(v),'p95_ms':q(v,.95),'p99_ms':q(v,.99),'max_ms':max(v),'over_50':sum(x>50 for x in v),'over_200':sum(x>200 for x in v)}
          out={'seeds':SEEDS,'reps':REPS,'gc_enabled':gc.isenabled(),'action_equivalent':not mismatches and not errors,'mismatches':mismatches,'errors':errors,'v147':stats(all147),'v150':stats(all150),'rows':rows}
          Path('results/v150_focused_equivalence_runtime.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2))
          assert not errors, errors
          assert not mismatches, mismatches
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v150-focused-equivalence-runtime-selfhosted
          path: results/
          if-no-files-found: error
          retention-days: 30
