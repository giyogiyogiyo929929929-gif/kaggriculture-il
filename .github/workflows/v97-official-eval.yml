name: v97 Official Evaluation

on:
  push:
    branches:
      - eval-v97-official
    paths:
      - .github/workflows/v97-official-eval.yml
      - eval_assets/v97/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Smoke
        run: |
          python --version
          echo v97-smoke-ok
