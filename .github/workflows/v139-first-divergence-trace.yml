name: V139 first divergence trace
on:
  push:
    branches: [gpt-v115-sell1-official]
    paths: ['.github/workflows/v139-first-divergence-trace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Reconstruct exact v115 and v139
        run: |
          set -euo pipefail
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v139_v92_k2.py tmp/v115.py tmp/v139.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('tmp/v115.py').read_bytes()).hexdigest()=='c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2'
          assert hashlib.sha256(Path('tmp/v139.py').read_bytes()).hexdigest()=='87209371be092a7587d08cd9bdf452d206d8a52d49fb9f7be0f069aa23602d2e'
          PY
      - name: Trace first state-aligned divergence
        run: |
          python ci/trace_v139_first_divergence.py --v115 tmp/v115.py --v139 tmp/v139.py --seeds 621 628 631 --out results/v139_first_divergence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v139-first-divergence
          path: results/v139_first_divergence.json
          if-no-files-found: warn
          retention-days: 30
