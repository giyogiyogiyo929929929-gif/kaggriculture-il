name: v149 vs v115 late-game guard screen

on:
  push:
    branches: [eval-v147-resume-selfhosted-20260926]
    paths: [".github/workflows/v149-v115-late-guard-screen.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and static check
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          python - <<'PY'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          PY
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v147_confirmed_v111_clone.py tmp/v115.py tmp/v147.py
          python ci/build_v149_v147_late_guard.py tmp/v115.py tmp/v149.py
          python -m py_compile tmp/v115.py tmp/v147.py tmp/v149.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for p in ('tmp/v115.py','tmp/v147.py','tmp/v149.py'):
              print(p,hashlib.sha256(Path(p).read_bytes()).hexdigest(),Path(p).stat().st_size)
          assert hashlib.sha256(Path('tmp/v115.py').read_bytes()).hexdigest()=='c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2'
          assert hashlib.sha256(Path('tmp/v147.py').read_bytes()).hexdigest()=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'
          PY
      - name: Runtime preflight
        run: python scripts/eval.py tmp/v149.py tmp/v115.py -n 1 -j 1 --seed-start 681 --json results/runtime_681.json
      - name: Burned matched direct
        run: python scripts/eval.py tmp/v149.py tmp/v115.py -n 12 -j 4 --seed-start 681 --json results/burned_v149_vs_v115.json
      - name: Focus seed691 against v147
        run: python scripts/eval.py tmp/v149.py tmp/v147.py -n 1 -j 1 --seed-start 691 --json results/seed691_v149_vs_v147.json
      - name: Public known-opponent regression panel
        run: |
          python ci/eval_candidate_vs_champion_panel.py --candidate tmp/v149.py --champion tmp/v115.py --opponent starter --seed-start 661 --seed-count 4 --jobs 2 --out results/public_starter.json
          python ci/eval_candidate_vs_champion_panel.py --candidate tmp/v149.py --champion tmp/v115.py --opponent opponents/beat_v48/main.py --seed-start 661 --seed-count 4 --jobs 2 --out results/public_beat_v48.json
          python ci/eval_candidate_vs_champion_panel.py --candidate tmp/v149.py --champion tmp/v115.py --opponent opponents/bl_v20/main.py --seed-start 661 --seed-count 4 --jobs 2 --out results/public_bl_v20.json
          python ci/eval_candidate_vs_champion_panel.py --candidate tmp/v149.py --champion tmp/v115.py --opponent opponents/bl_v21/main.py --seed-start 661 --seed-count 4 --jobs 2 --out results/public_bl_v21.json
          python ci/eval_candidate_vs_champion_panel.py --candidate tmp/v149.py --champion tmp/v115.py --opponent opponents/farming_v2/main.py --seed-start 661 --seed-count 4 --jobs 2 --out results/public_farming_v2.json
          python ci/eval_candidate_vs_champion_panel.py --candidate tmp/v149.py --champion tmp/v115.py --opponent opponents/frontier_prvsiyan/main.py --seed-start 661 --seed-count 4 --jobs 2 --out results/public_frontier_prvsiyan.json
      - name: Aggregate
        if: always()
        run: |
          python - <<'PY'
          import glob,hashlib,json,statistics
          from pathlib import Path
          def direct(p):
              d=json.load(open(p,encoding='utf-8')); by={}
              for g in d.get('matches_detail',[]): by.setdefault(int(g['seed']),[]).append(float(g['money'][0])-float(g['money'][1]))
              rows=[{'seed':s,'delta':statistics.fmean(v),'seat_diffs':v} for s,v in sorted(by.items())]; vals=[r['delta'] for r in rows]
              return {'pairs':len(vals),'wins':sum(x>0 for x in vals),'losses':sum(x<0 for x in vals),'ties':sum(x==0 for x in vals),'mean':statistics.fmean(vals) if vals else None,'se':statistics.stdev(vals)/(len(vals)**0.5) if len(vals)>1 else 0.0,'worst':min(vals) if vals else None,'best':max(vals) if vals else None,'rows':rows,'exceptions':d.get('exceptions'),'timings':d.get('timings')}
          pubs=[]; vals=[]
          for p in sorted(glob.glob('results/public_*.json')):
              d=json.load(open(p,encoding='utf-8')); x=[float(r['candidate_minus_champion_money']) for r in d.get('rows',[])]; vals+=x
              pubs.append({'panel':Path(p).stem,'wins':sum(v>0 for v in x),'losses':sum(v<0 for v in x),'ties':sum(v==0 for v in x),'mean':statistics.fmean(x) if x else None,'worst':min(x) if x else None})
          out={'candidate':'v149_v147_late_guard','parent_behavior':'v147_confirmed_v111_clone','champion':'v115_champion_same_turn_open_squeeze','metric':'candidate_minus_champion = candidate - champion',
               'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in ('tmp/v115.py','tmp/v147.py','tmp/v149.py')},
               'runtime':direct('results/runtime_681.json'),'burned':direct('results/burned_v149_vs_v115.json'),'seed691_vs_v147':direct('results/seed691_v149_vs_v147.json'),
               'public':{'pairs':len(vals),'wins':sum(v>0 for v in vals),'losses':sum(v<0 for v in vals),'ties':sum(v==0 for v in vals),'mean':statistics.fmean(vals) if vals else None,'worst':min(vals) if vals else None,'panels':pubs}}
          Path('results/v149_screen_summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v149-v115-late-guard-screen
          path: results/
          if-no-files-found: error
          retention-days: 30
