name: uploaded 127ed3 CARROT2 feed0 hosted runtime screen

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/workflows/uploaded-127ed3-ca-feed0-runtime-hosted-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact engine and build exact candidate
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          python ci\build_uploaded_127ed3_safety_v3.py tmp\safe_v3.py
          python ci\build_uploaded_127ed3_ca_feed0.py tmp\safe_v3.py tmp\ca_feed0.py
          @'
          import hashlib,importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          assert importlib.metadata.version('kaggle-environments')=='1.32.7'
          assert hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          assert hashlib.sha256(Path('tmp/safe_v3.py').read_bytes()).hexdigest()=='87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df'
          assert hashlib.sha256(Path('tmp/ca_feed0.py').read_bytes()).hexdigest()=='cc300eda64d0fe1f884bd164f973de2177eb68c1808cafed06bfeadc5b446e44'
          '@ | python -
          python -m py_compile tmp\ca_feed0.py
      - name: Hosted timing screen
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONIOENCODING='utf-8'
          @'
          import gc,json,statistics,time
          from pathlib import Path
          from kaggle_environments import make
          from scripts.preflight import load_like_kaggle,call_like_kaggle
          LIMIT_P99_MS=50.0
          LIMIT_WORST_MS=200.0
          seeds=[71,75]
          candidate=load_like_kaggle(Path('tmp/ca_feed0.py'))
          ts=[]; games=[]
          def timed(obs,cfg=None):
              t=time.perf_counter()
              action=call_like_kaggle(candidate,obs,cfg)
              ts.append(time.perf_counter()-t)
              return action
          for seed in seeds:
              for seat in (0,1):
                  gc.collect()
                  agents=[timed,'starter'] if seat==0 else ['starter',timed]
                  env=make('kaggriculture',configuration={'seed':seed}); env.run(agents)
                  statuses=[s.get('status') for s in env.state]
                  games.append({'seed':seed,'candidate_seat':seat,'steps':len(env.steps),'statuses':statuses})
                  assert statuses==['DONE','DONE'] and len(env.steps)==720
          ts.sort()
          p99=ts[min(len(ts)-1,int(len(ts)*0.99))]*1000.0
          worst=ts[-1]*1000.0
          median=statistics.median(ts)*1000.0
          out={'candidate':'uploaded_127ed3_ca_feed0','candidate_sha256':'cc300eda64d0fe1f884bd164f973de2177eb68c1808cafed06bfeadc5b446e44','engine':'1.32.7','runner':'windows-latest','n':len(ts),'median_ms':median,'p99_ms':p99,'worst_ms':worst,'limits':{'p99_ms_lt':LIMIT_P99_MS,'worst_ms_lt':LIMIT_WORST_MS},'games':games,'pass':p99<LIMIT_P99_MS and worst<LIMIT_WORST_MS}
          print(json.dumps(out,indent=2)); Path('results/runtime_hosted_screen.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          assert out['pass'],out
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-ca-feed0-runtime-hosted-screen
          path: results/
          if-no-files-found: error
          retention-days: 30
