name: v147 vs v115 sealed 1701-1712

on:
  push:
    branches: [eval-v147-resume-selfhosted-20260926]
    paths: [".github/workflows/v147-v115-sealed-1701-1712.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sealed:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned engine and reconstruct exact agents
        run: |
          $ErrorActionPreference = 'Stop'
          $gitUsr = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path = "$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize = @'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append = @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          if ($LASTEXITCODE -ne 0) { throw 'v115 reconstruction failed' }
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          if ($LASTEXITCODE -ne 0) { throw 'v147 build failed' }
          python -m py_compile tmp\v115.py tmp\v147.py
          $check = @'
          import hashlib
          from pathlib import Path
          exp={'tmp/v115.py':'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2','tmp/v147.py':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'}
          for p,w in exp.items():
              got=hashlib.sha256(Path(p).read_bytes()).hexdigest(); print(p,got); assert got==w,(p,got,w)
          '@
          $check | python -
      - name: Sealed matched pairs 1701-1712 with seat swap
        run: |
          python scripts\eval.py tmp\v147.py tmp\v115.py -n 12 -j 4 --seed-start 1701 --json results\sealed_1701_1712.json
          if ($LASTEXITCODE -ne 0) { throw 'sealed evaluation failed' }
      - name: Aggregate sealed result
        if: always()
        run: |
          $code = @'
          import json,statistics,math
          from pathlib import Path
          p=Path('results/sealed_1701_1712.json')
          if not p.exists():
              raise SystemExit('sealed result missing')
          d=json.loads(p.read_text(encoding='utf-8'))
          by={}
          for g in d.get('matches_detail',[]):
              by.setdefault(int(g['seed']),[]).append(float(g['money'][0])-float(g['money'][1]))
          rows=[]
          for s,v in sorted(by.items()):
              rows.append({'seed':s,'candidate_minus_champion':statistics.fmean(v),'seat_diffs':v})
          vals=[r['candidate_minus_champion'] for r in rows]
          se=statistics.stdev(vals)/(len(vals)**0.5) if len(vals)>1 else 0.0
          out={
            'candidate':'v147_confirmed_v111_clone',
            'candidate_sha256':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923',
            'champion':'v115_champion_same_turn_open_squeeze',
            'champion_sha256':'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2',
            'engine':'kaggle_environments==1.32.7',
            'metric':'candidate_minus_champion = candidate - champion',
            'seed_set':'sealed_1701_1712','pairs':len(vals),
            'wins':sum(x>0 for x in vals),'losses':sum(x<0 for x in vals),'ties':sum(x==0 for x in vals),
            'mean':statistics.fmean(vals) if vals else None,'se':se,
            'mean_minus_2se':(statistics.fmean(vals)-2*se) if vals else None,
            'worst':min(vals) if vals else None,'best':max(vals) if vals else None,
            'candidate_exceptions':d.get('exceptions',{}).get('a'),
            'champion_exceptions':d.get('exceptions',{}).get('b'),
            'rows':rows,
            'decision':'evidence only; no automatic promotion'
          }
          Path('results/sealed_summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          assert len(vals)==12
          assert out['candidate_exceptions']==0 and out['champion_exceptions']==0
          '@
          $code | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v147-v115-sealed-1701-1712
          path: results/
          if-no-files-found: error
          retention-days: 30
