name: v154 v147 not-ahead focused direct

on:
  push:
    branches: [eval-v150-v147-singleton-hardcell-20260926]
    paths: [".github/workflows/v154-v147-not-ahead-focused-direct.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact engine and reconstruct agents
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize=@'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append=@'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v154_v147_dense_self_exposure_not_ahead.py tmp\v147.py tmp\v154.py
          python -m py_compile tmp\v147.py tmp\v154.py
          $check=@'
          import hashlib
          from pathlib import Path
          p=Path('tmp/v147.py'); got=hashlib.sha256(p.read_bytes()).hexdigest()
          assert got=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923',got
          print('v147_sha256='+got)
          print('v154_sha256='+hashlib.sha256(Path('tmp/v154.py').read_bytes()).hexdigest())
          '@
          $check | python -

      - name: Focused source and regression cells
        run: |
          $ErrorActionPreference='Stop'
          python ci\eval_candidate_vs_champion_panel.py --candidate tmp\v154.py --champion tmp\v147.py --opponent opponents\score_2820\main.py --seed-start 520104 --seed-count 1 --jobs 2 --out results\score_2820_520104.json
          python ci\eval_candidate_vs_champion_panel.py --candidate tmp\v154.py --champion tmp\v147.py --opponent opponents\peak_2950\main.py --seed-start 520101 --seed-count 4 --jobs 2 --out results\peak_2950_520101_520104.json
          python ci\eval_candidate_vs_champion_panel.py --candidate tmp\v154.py --champion tmp\v147.py --opponent opponents\tetsutani_ms\main.py --seed-start 520104 --seed-count 1 --jobs 2 --out results\tetsutani_520104.json

      - name: Burned direct 681-692 both seats
        run: |
          $ErrorActionPreference='Stop'
          python scripts\eval.py tmp\v154.py tmp\v147.py -n 12 -j 2 --seed-start 681 --json results\direct_681_692_raw.json
          $code=@'
          import json, math, statistics
          from pathlib import Path
          d=json.loads(Path('results/direct_681_692_raw.json').read_text(encoding='utf-8'))
          by={}
          seat={False:[],True:[]}
          for g in d['matches_detail']:
              seed=int(g['seed']); swap=bool(g['swap']); diff=float(g['money'][0])-float(g['money'][1])
              by.setdefault(seed,[]).append(diff); seat[swap].append(diff)
          rows=[]; vals=[]
          for seed in sorted(by):
              pair=statistics.mean(by[seed]); vals.append(pair)
              rows.append({'seed':seed,'seat_diffs':by[seed],'pair':pair})
          se=statistics.stdev(vals)/(len(vals)**0.5) if len(vals)>1 else 0.0
          out={'rows':rows,'wins':sum(x>0 for x in vals),'losses':sum(x<0 for x in vals),'ties':sum(x==0 for x in vals),
               'mean':statistics.mean(vals),'se':se,'mean_minus_2se':statistics.mean(vals)-2*se,'worst':min(vals),'best':max(vals),
               'seat0_mean':statistics.mean(seat[False]),'seat1_mean':statistics.mean(seat[True]),
               'candidate_exceptions':d['exceptions']['a'],'champion_exceptions':d['exceptions']['b']}
          Path('results/direct_681_692_summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          '@
          $code | python -

      - name: Acceptance summary
        run: |
          $code=@'
          import json
          from pathlib import Path
          score=json.loads(Path('results/score_2820_520104.json').read_text(encoding='utf-8'))
          peak=json.loads(Path('results/peak_2950_520101_520104.json').read_text(encoding='utf-8'))
          tet=json.loads(Path('results/tetsutani_520104.json').read_text(encoding='utf-8'))
          direct=json.loads(Path('results/direct_681_692_summary.json').read_text(encoding='utf-8'))
          summary={'score':{k:score[k] for k in ('wins','losses','ties','candidate_minus_champion_mean','worst','candidate_exceptions')},
                   'peak':{k:peak[k] for k in ('wins','losses','ties','candidate_minus_champion_mean','worst','candidate_exceptions')},
                   'tetsutani':{k:tet[k] for k in ('wins','losses','ties','candidate_minus_champion_mean','worst','candidate_exceptions')},
                   'direct':direct}
          Path('results/acceptance_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          assert score['candidate_exceptions']==0 and direct['candidate_exceptions']==0
          assert score['candidate_minus_champion_mean']>0
          '@
          $code | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v154-v147-not-ahead-focused-direct
          path: results/
          if-no-files-found: error
          retention-days: 30
