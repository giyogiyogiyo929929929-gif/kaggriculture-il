name: uploaded 127ed3 feed0 earlythin v1 stress

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.ci/trigger-uploaded-127ed3-ca-feed0-earlythin-v1-stress'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact champion and candidate
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          python ci\build_uploaded_127ed3_safety_v3.py tmp\safe_v3.py
          python ci\build_uploaded_127ed3_ca_feed0.py tmp\safe_v3.py tmp\feed0.py
          python ci\build_uploaded_127ed3_ca_feed0_earlythin_v1.py tmp\feed0.py tmp\candidate.py
          @'
          import hashlib,importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          assert importlib.metadata.version('kaggle-environments')=='1.32.7'
          assert hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          assert hashlib.sha256(Path('tmp/feed0.py').read_bytes()).hexdigest()=='cc300eda64d0fe1f884bd164f973de2177eb68c1808cafed06bfeadc5b446e44'
          assert hashlib.sha256(Path('tmp/candidate.py').read_bytes()).hexdigest()=='e172cc82ff049766b9013a0a973817359d04349946544b1ba2091b552dc07c82'
          '@ | python -
          python -m py_compile tmp\feed0.py tmp\candidate.py
      - name: Burned stress 621-632 both seats
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,statistics
          from pathlib import Path
          from kaggle_environments import make
          from scripts.preflight import load_like_kaggle,call_like_kaggle

          candidate=Path('tmp/candidate.py'); champion=Path('tmp/feed0.py')
          seeds=list(range(621,633))

          def game(seed,seat):
              a=load_like_kaggle(candidate); b=load_like_kaggle(champion); ae=[0]; be=[0]
              def aw(obs,cfg=None):
                  try:return call_like_kaggle(a,obs,cfg)
                  except Exception:
                      ae[0]+=1; return {'farmer':['PASS'],'hands':[],'market':[]}
              def bw(obs,cfg=None):
                  try:return call_like_kaggle(b,obs,cfg)
                  except Exception:
                      be[0]+=1; return {'farmer':['PASS'],'hands':[],'market':[]}
              env=make('kaggriculture',configuration={'seed':seed}); env.run([aw,bw] if seat==0 else [bw,aw])
              assert [s.get('status') for s in env.state]==['DONE','DONE'] and len(env.steps)==720
              r=[float(s.get('reward',0)) for s in env.state]
              return {'delta':r[seat]-r[1-seat],'candidate_money':r[seat],'champion_money':r[1-seat],'candidate_exceptions':ae[0],'champion_exceptions':be[0]}

          rows=[]; pair=[]
          for seed in seeds:
              games=[game(seed,s) for s in (0,1)]
              assert sum(g['candidate_exceptions']+g['champion_exceptions'] for g in games)==0
              d=statistics.mean(g['delta'] for g in games); pair.append(d)
              rows.append({'seed':seed,'seat_deltas':[g['delta'] for g in games],'candidate_minus_champion':d,'games':games})
          se=statistics.stdev(pair)/(len(pair)**0.5) if len(pair)>1 else 0.0
          summary={'candidate':'uploaded_127ed3_ca_feed0_earlythin_v1','candidate_sha256':'e172cc82ff049766b9013a0a973817359d04349946544b1ba2091b552dc07c82','champion':'uploaded_127ed3_ca_feed0','champion_sha256':'cc300eda64d0fe1f884bd164f973de2177eb68c1808cafed06bfeadc5b446e44','seeds':seeds,'wins':sum(d>0 for d in pair),'losses':sum(d<0 for d in pair),'draws':sum(d==0 for d in pair),'mean':statistics.mean(pair),'median':statistics.median(pair),'se':se,'mean_minus_2se':statistics.mean(pair)-2*se,'worst':min(pair),'best':max(pair),'seat0_mean':statistics.mean(r['seat_deltas'][0] for r in rows),'seat1_mean':statistics.mean(r['seat_deltas'][1] for r in rows),'rows':rows}
          Path('results/earlythin_v1_stress.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-ca-feed0-earlythin-v1-stress
          path: results/
          if-no-files-found: error
          retention-days: 30
