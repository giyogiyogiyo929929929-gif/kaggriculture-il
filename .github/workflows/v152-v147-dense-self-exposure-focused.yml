name: v152 v147 dense self exposure focused

on:
  push:
    branches: [eval-v150-v147-singleton-hardcell-20260926]
    paths: [".github/workflows/v152-v147-dense-self-exposure-focused.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned engine and reconstruct exact agents
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize=@'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append=@'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v152_v147_dense_self_exposure.py tmp\v147.py tmp\v152.py
          python -m py_compile tmp\v147.py tmp\v152.py
          $check=@'
          import hashlib
          from pathlib import Path
          got=hashlib.sha256(Path('tmp/v147.py').read_bytes()).hexdigest()
          assert got=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923',got
          print('v147_sha256='+got)
          print('v152_sha256='+hashlib.sha256(Path('tmp/v152.py').read_bytes()).hexdigest())
          '@
          $check | python -
      - name: Focused hard loss cell score2820 seed520104 both seats
        run: |
          python ci\eval_candidate_vs_champion_panel.py --candidate tmp\v152.py --champion tmp\v147.py --opponent opponents\score_2820\main.py --seed-start 520104 --seed-count 1 --jobs 1 --out results\v152_vs_v147_score2820_520104.json
          if ($LASTEXITCODE -ne 0) { throw 'focused eval failed' }
      - name: Candidate ledger and v152 telemetry
        run: |
          python ci\diagnose_score2820_520104.py tmp\v152.py opponents\score_2820\main.py results\v152_score2820_520104_ledger.json
          if ($LASTEXITCODE -ne 0) { throw 'ledger failed' }
          $code=@'
          import json
          from pathlib import Path
          p=Path('results/v152_score2820_520104_ledger.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          out=[]
          for g in d['games']:
              out.append({'swap':g['swap'],'rewards':g['rewards'],'v152':g['telemetry'].get('_V152_REPORT',{})})
          Path('results/v152_focused_telemetry.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          assert all(int(x['v152'].get('errors',0))==0 for x in out),out
          '@
          $code | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v152-v147-dense-self-exposure-focused
          path: results/
          if-no-files-found: error
          retention-days: 30
