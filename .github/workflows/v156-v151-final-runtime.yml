name: v156 v151 strict final runtime

on:
  pull_request:
    branches: [eval-v156-v151-not-ahead-three-exposure-20260927]
    paths: ["ci/trigger-v156-final-runtime.txt"]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct exact v151 and v156
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"; Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'patch failed' }
          Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v150_skip_noop_second_pass.py tmp\v147.py tmp\v150.py
          python ci\build_v151_none_observation_guard.py tmp\v150.py tmp\v151.py
          python ci\build_v156_v151_not_ahead_three_exposure.py tmp\v151.py tmp\v156.py
          python -m py_compile tmp\v151.py tmp\v156.py
          @'
          import hashlib,json
          from pathlib import Path
          out={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in ('tmp/v151.py','tmp/v156.py')}
          assert out['tmp/v151.py']=='54edf1f1663b161457c6d31daccb68b496e5a61dffb6f140f69af2e0b380bf31',out
          assert out['tmp/v156.py']=='14f142f9ca933a208150895e60fa3ee5838d6230782e7fa7807707280b26bcdb',out
          Path('results/v156_final_runtime_build_sha.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          '@ | python -
      - name: Sequential GC-on strict paired runtime qualification
        run: |
          $ErrorActionPreference='Stop'
          @'
          import gc,importlib.util,json,math,statistics,sys,time,traceback
          from pathlib import Path
          from kaggle_environments import make
          SEEDS=[681,682,689,691,692]
          PATHS={'v151':'tmp/v151.py','v156':'tmp/v156.py'}
          uid=0
          def load(path):
              global uid; uid+=1
              p=Path(path).resolve(); name=f'_v156finalrt_{uid}'
              spec=importlib.util.spec_from_file_location(name,p); m=importlib.util.module_from_spec(spec); sys.modules[name]=m
              sys.path.insert(0,str(p.parent))
              try: spec.loader.exec_module(m)
              finally: sys.path.remove(str(p.parent))
              return m
          def q(vals,p):
              s=sorted(vals); return s[max(0,min(len(s)-1,math.ceil(p*len(s))-1))]
          class Timed:
              def __init__(self,fn,label,seed,seat): self.fn=fn; self.label=label; self.seed=seed; self.seat=seat; self.rows=[]
              def __call__(self,obs,cfg=None):
                  step=int(obs.get('step',0)); w0=time.perf_counter_ns(); c0=time.process_time_ns(); out=self.fn(obs,cfg)
                  self.rows.append({'label':self.label,'seed':self.seed,'seat':self.seat,'step':step,
                                    'wall_ms':(time.perf_counter_ns()-w0)/1e6,'cpu_ms':(time.process_time_ns()-c0)/1e6})
                  return out
          def run(label,path,seed,seat):
              m=load(path); t=Timed(m.agent,label,seed,seat); opp=load('tmp/v115.py').agent
              agents=[t,opp] if seat==0 else [opp,t]
              env=make('kaggriculture',configuration={'seed':seed},debug=True); env.run(agents)
              statuses=[x.get('status') for x in env.state]
              if statuses!=['DONE','DONE']: raise RuntimeError((label,seed,seat,statuses))
              return t.rows
          allrows=[]; errors=[]
          assert gc.isenabled()
          for seed in SEEDS:
              for seat in (0,1):
                  for label,path in PATHS.items():
                      try: allrows.extend(run(label,path,seed,seat))
                      except Exception as e: errors.append({'label':label,'seed':seed,'seat':seat,'error':repr(e),'traceback':traceback.format_exc()})
          def stats(rows):
              w=[r['wall_ms'] for r in rows]; c=[r['cpu_ms'] for r in rows]
              return {'calls':len(w),'median_ms':statistics.median(w),'p95_ms':q(w,.95),'p99_ms':q(w,.99),'max_ms':max(w),
                      'cpu_p99_ms':q(c,.99),'cpu_max_ms':max(c),'over_50':sum(x>50 for x in w),'over_200':sum(x>200 for x in w),
                      'top10':sorted(rows,key=lambda r:r['wall_ms'],reverse=True)[:10]}
          summary={k:stats([r for r in allrows if r['label']==k]) for k in PATHS}
          summary['v156']['formal_pass']=summary['v156']['p99_ms']<50 and summary['v156']['max_ms']<200 and not errors
          out={'engine':'kaggle_environments==1.32.7','mode':'sequential single-process; GC enabled; perf_counter_ns + process_time_ns',
               'seeds':SEEDS,'seat_swap':True,'gc_enabled':gc.isenabled(),'thresholds':{'p99_ms_lt':50.0,'max_ms_lt':200.0},
               'errors':errors,'summary':summary}
          Path('results/v156_final_runtime.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          assert not errors,errors
          assert summary['v156']['formal_pass'],summary['v156']
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v156-v151-final-runtime
          path: results/
          if-no-files-found: error
          retention-days: 30
