name: v112-v122 step456 diagnostic
on:
  push:
    branches: [eval/v112-v122-wool-lowrisk-front-20260927]
    paths:
      - '.github/workflows/v112-v122-step456-diag-selfhosted.yml'
      - 'experiments/v112_v116_milk_micro/run_v122_step456_diag.py'
concurrency:
  group: v112-v122-step456-diag
  cancel-in-progress: true
jobs:
  diag:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engine and reconstruct v112
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          Set-Location experiments\v112_v116_milk_micro
          python build_sources.py
          python -m py_compile run_v122_step456_diag.py
      - name: Inspect target step 456 states
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location experiments\v112_v116_milk_micro
          python run_v122_step456_diag.py
      - uses: actions/upload-artifact@v4
        with:
          name: v112-v122-step456-diag
          path: experiments/v112_v116_milk_micro/v122_step456_diag.json
