name: v125c conserved ADV1 vs exact v115 design

on:
  push:
    branches:
      - eval-v125c-adv-split1-20260925
    paths:
      - ".github/workflows/v125c-v115-design.yml"
      - "ci/build_v125c_from_v115.py"
      - "ci/reconstruct_exact_v115.py"
      - "ci/v77_to_v115.patch.gz.b64"

permissions:
  contents: read

jobs:
  synthetic-and-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Reconstruct exact v115 and deterministic v125c
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v125c_from_v115.py tmp/v115.py tmp/v125c.py
          python -m py_compile tmp/v115.py tmp/v125c.py
      - name: Synthetic source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('tmp/v125c.py').read_text()
          p=Path('tmp/v115.py').read_text()
          assert "[['BUY_PRODUCT','WHEAT',_OPEN_ATTACK],['SELL','WHEAT',_OPEN_ATTACK]]" in p
          assert p.count('_ADV_BOOK=False') == 1
          assert c.count('_ADV_BOOK=True') >= 1 and '_ADV_BOOK=False' not in c
          assert 'take=min(q,avail,max(0,1-added-n))' in c
          assert "if debts.get(t,{}).get(o[1],0)>0:" in c
          print('synthetic_invariants=PASS')
          PY
      - name: Fresh design H2H seeds 41001-41012 both seats
        run: |
          python - <<'PY'
          import json, math
          from scripts.eval import evaluate
          s=evaluate('tmp/v125c.py','tmp/v115.py',pairs=12,jobs=4,seed_start=41001)
          diffs=s.get('pair_diffs') or []
          out={
            'metric':'candidate_minus_champion = candidate - champion direct pair margin',
            'phase':'design',
            'seeds':[41001,41012],
            'pairs':12,
            'wins':s['wins'],'losses':s['losses'],'ties':s['draws'],
            'candidate_minus_champion_mean':s['pair_diff_mean'],
            'candidate_minus_champion_se':s['pair_diff_stderr'],
            'mean_ge_2se': bool(s['pair_diff_mean']>0 and s['pair_diff_mean'] >= 2*s['pair_diff_stderr']),
            'worst': min(diffs) if diffs else None,
            'best': max(diffs) if diffs else None,
            'pair_diffs':diffs,
            'candidate_exceptions':s['exceptions']['a'],
            'champion_exceptions':s['exceptions']['b'],
            'matches_detail':s['matches_detail'],
          }
          open('results/design_direct.json','w').write(json.dumps(out,indent=2))
          print('DESIGN_JSON='+json.dumps({k:v for k,v in out.items() if k!='matches_detail'},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v125c-v115-design
          path: results/
          if-no-files-found: warn
          retention-days: 30
