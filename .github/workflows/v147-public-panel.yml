name: v147 public panel

on:
  push:
    branches: [eval-v115-v147-confirmed-v111-20260925]
    paths:
      - ".github/workflows/v147-public-panel.yml"
      - "ci/build_v147_confirmed_v111_clone.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned engine
        run: |
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
      - name: Reconstruct exact v115 and build v147
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          python - <<'PY'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          PY
          (cd tmp && patch --binary --batch -p3 -i ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v147_confirmed_v111_clone.py tmp/v115.py tmp/v147.py
          python -m py_compile tmp/v115.py tmp/v147.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={'tmp/v115.py':'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2','tmp/v147.py':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'}
          for p,want in expected.items():
              got=hashlib.sha256(Path(p).read_bytes()).hexdigest(); print(p,got); assert got==want,(p,got,want)
          PY
      - name: Evaluate public panel seeds 661-664
        run: |
          set -e
          for spec in \
            'starter starter' \
            'beat_v48 opponents/beat_v48/main.py' \
            'bl_v20 opponents/bl_v20/main.py' \
            'bl_v21 opponents/bl_v21/main.py' \
            'farming_v2 opponents/farming_v2/main.py' \
            'frontier_prvsiyan opponents/frontier_prvsiyan/main.py'; do
            set -- $spec
            python ci/eval_candidate_vs_champion_panel.py --candidate tmp/v147.py --champion tmp/v115.py --opponent "$2" --seed-start 661 --seed-count 4 --jobs 2 --out "results/$1.json"
          done
      - name: Aggregate
        if: always()
        run: |
          python - <<'PY'
          import glob,json,math,statistics
          from pathlib import Path
          panels=[]
          for p in sorted(glob.glob('results/*.json')):
              d=json.load(open(p,encoding='utf-8')); d['name']=Path(p).stem; panels.append(d)
          vals=[float(r['candidate_minus_champion_money']) for p in panels for r in p.get('rows',[])]
          n=len(vals); mean=statistics.fmean(vals) if vals else 0.0; se=statistics.stdev(vals)/math.sqrt(n) if n>1 else 0.0
          out={'candidate':'v147_confirmed_v111_clone','champion':'v115_champion_same_turn_open_squeeze','engine':'kaggle_environments==1.32.7','paired_rows':n,'wins':sum(x>0 for x in vals),'losses':sum(x<0 for x in vals),'ties':sum(x==0 for x in vals),'mean':mean,'se':se,'mean_minus_2se':mean-2*se,'worst':min(vals) if vals else None,'best':max(vals) if vals else None,'panels':[{'name':p['name'],'wins':p['wins'],'losses':p['losses'],'ties':p['ties'],'mean':p['candidate_minus_champion_mean'],'worst':p['worst'],'best':p['best']} for p in panels]}
          Path('results/summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v147-public-panel
          path: results/
          retention-days: 30
