name: v140 isolated V92 K2 screen

on:
  push:
    branches: [eval-public-opponents-20260923]
    paths: [".github/workflows/v140-v115-v92-k2-isolated-screen.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct:
    name: direct-v115
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact Kaggriculture 1.32.7
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
          python - <<'PY'
          import kaggle_environments
          from kaggle_environments import make
          assert kaggle_environments.__version__ == '1.32.7'
          env=make('kaggriculture',configuration={'seed':641},debug=True)
          env.run(['starter','starter'])
          assert len(env.steps)==720
          PY
      - name: Build exact v115 and isolated v140
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v140_v92_k2_isolated.py tmp/v115.py tmp/v140.py
          python -m py_compile tmp/v115.py tmp/v140.py
          python - <<'PY'
          a=open('tmp/v115.py',encoding='utf-8').read(); b=open('tmp/v140.py',encoding='utf-8').read()
          assert a.count('_V92_P_K = 1') == 1 and b.count('_V92_P_K = 1') == 1
          assert a.count('>= _V92_P_K') == 2
          assert b.count('>= _V92_P_K') == 1
          assert b.count('ev.get((step + 1, i), 0) + ev.get((step + 2, i), 0) >= 2') == 1
          PY
          sha256sum tmp/v115.py tmp/v140.py
      - name: Direct matched both-seat H2H seeds 641-652
        run: |
          python - <<'PY'
          import json, math, statistics
          from scripts.eval import evaluate
          s=evaluate('tmp/v140.py','tmp/v115.py',pairs=12,jobs=4,seed_start=641)
          by={}
          for g in s['matches_detail']: by.setdefault(int(g['seed']),[]).append(g)
          rows=[]; seat0=[]; seat1=[]
          for seed in sorted(by):
              vals=[]; seats=[]
              for g in sorted(by[seed],key=lambda x:bool(x['swap'])):
                  d=float(g['money'][0])-float(g['money'][1]); vals.append(d)
                  (seat1 if g['swap'] else seat0).append(d)
                  seats.append({'swap':bool(g['swap']),'candidate_minus_champion':d,'candidate_money':g['money'][0],'champion_money':g['money'][1]})
              rows.append({'seed':seed,'candidate_minus_champion':statistics.mean(vals),'seats':seats})
          vals=[r['candidate_minus_champion'] for r in rows]
          mean=statistics.mean(vals); se=statistics.stdev(vals)/math.sqrt(len(vals)) if len(vals)>1 else 0.0
          out={'metric':'candidate_minus_champion = candidate - champion direct pair margin','candidate':'v140_candidate_v92_k2_isolated','champion':'v115_champion_same_turn_open_squeeze','seeds':[641,652],'pairs':len(vals),'wins':sum(v>0 for v in vals),'losses':sum(v<0 for v in vals),'ties':sum(v==0 for v in vals),'candidate_minus_champion_mean':mean,'median':statistics.median(vals),'se':se,'mean_minus_2se':mean-2*se,'mean_ge_2se':bool(mean>0 and mean>=2*se),'worst':min(vals),'worst_seed':rows[vals.index(min(vals))]['seed'],'best':max(vals),'best_seed':rows[vals.index(max(vals))]['seed'],'seat0_mean':statistics.mean(seat0),'seat1_mean':statistics.mean(seat1),'candidate_exceptions':s['exceptions']['a'],'champion_exceptions':s['exceptions']['b'],'rows':rows}
          open('results/direct.json','w').write(json.dumps(out,indent=2)); print(json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2)); print('DIFFERING',[(r['seed'],r['candidate_minus_champion']) for r in rows if r['candidate_minus_champion']!=0])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v140-direct-screen, path: results/, if-no-files-found: error, retention-days: 14}

  panel:
    name: panel-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {name: starter, opponent: starter}
          - {name: beat_v48, opponent: opponents/beat_v48/main.py}
          - {name: bl_v20, opponent: opponents/bl_v20/main.py}
          - {name: bl_v21, opponent: opponents/bl_v21/main.py}
          - {name: farming_v2, opponent: opponents/farming_v2/main.py}
          - {name: frontier_prvsiyan, opponent: opponents/frontier_prvsiyan/main.py}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Build exact v115/v140
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v140_v92_k2_isolated.py tmp/v115.py tmp/v140.py
          python -m py_compile tmp/v115.py tmp/v140.py
      - name: Matched candidate-minus-champion panel seeds 641-644
        run: |
          python ci/eval_candidate_vs_champion_panel.py --candidate tmp/v140.py --champion tmp/v115.py --opponent '${{ matrix.opponent }}' --seed-start 641 --seed-count 4 --jobs 4 --out results/panel.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'v140-panel-${{ matrix.name }}', path: results/, if-no-files-found: error, retention-days: 14}
