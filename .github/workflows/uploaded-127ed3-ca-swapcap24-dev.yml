name: uploaded 127ed3 CARROT2 swap-cap24 burned dev

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/workflows/uploaded-127ed3-ca-swapcap24-dev.yml'
      - 'ci/build_uploaded_127ed3_safety_v3.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact safety-v3 parent and swap-cap24 child
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --no-deps 'kaggle-environments==1.32.7'; if ($LASTEXITCODE -ne 0) { throw 'engine install failed' }
          python -m pip install jsonschema requests; if ($LASTEXITCODE -ne 0) { throw 'deps install failed' }
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          python ci\build_uploaded_127ed3_safety_v3.py tmp\safe_v3.py; if ($LASTEXITCODE -ne 0) { throw 'parent reconstruction failed' }
          @'
          import hashlib, importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg

          assert importlib.metadata.version('kaggle-environments') == '1.32.7'
          assert hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest() == 'bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          parent = Path('tmp/safe_v3.py').read_bytes()
          assert hashlib.sha256(parent).hexdigest() == '87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df'
          old = b'if _CA_FROM <= day <= _CA_TO and pays_now:'
          new = b'if _CA_FROM <= day <= _CA_TO and pays_now and _CA_REPORT["ca_swaps"] < 24:'
          assert parent.count(old) == 1
          child = parent.replace(old, new, 1)
          Path('tmp/ca_swapcap24.py').write_bytes(child)
          got = hashlib.sha256(child).hexdigest()
          assert got == 'bdec654d4d94bec52f56ec28d7ea16787ecefb0e2a1efb38a66dc1e710ade939', got
          print('parent_sha256=87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df')
          print('candidate_sha256=' + got)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'candidate reconstruction/hash failed' }
          python -m py_compile tmp\safe_v3.py tmp\ca_swapcap24.py; if ($LASTEXITCODE -ne 0) { throw 'py_compile failed' }
      - name: Burned ten-seed direct-parent matched evaluation
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json, math, statistics
          from pathlib import Path
          from scripts.eval import evaluate

          seeds = [641,350003,101,211,347,509,733,911,1201,1601]
          rows = []
          exc_c = exc_p = 0
          non_done = 0
          for seed in seeds:
              s = evaluate('tmp/ca_swapcap24.py','tmp/safe_v3.py',pairs=1,jobs=1,seed_start=seed)
              exc_c += s['exceptions']['a']; exc_p += s['exceptions']['b']
              games = sorted(s['matches_detail'], key=lambda x: bool(x['swap']))
              vals = [float(g['money'][0]) - float(g['money'][1]) for g in games]
              statuses = [g.get('statuses') for g in games]
              for st in statuses:
                  if st and any(x != 'DONE' for x in st): non_done += 1
              pair = statistics.mean(vals)
              rows.append({'seed':seed,'seat_deltas':vals,'pair_mean_delta':pair,
                           'outcome':'W' if pair>0 else 'L' if pair<0 else 'D', 'statuses':statuses})
          vals = [r['pair_mean_delta'] for r in rows]
          mean = statistics.mean(vals)
          se = statistics.stdev(vals)/math.sqrt(len(vals)) if len(vals)>1 else 0.0
          out = {
            'candidate':'ca_swapcap24',
            'candidate_sha256':'bdec654d4d94bec52f56ec28d7ea16787ecefb0e2a1efb38a66dc1e710ade939',
            'parent':'uploaded_127ed3_safety_v3',
            'parent_sha256':'87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df',
            'hypothesis':'Cap CARROT2 substitutions at 24 per game; loss diagnostics had 46/29 swaps while contrast wins had 22/0.',
            'change':'Add _CA_REPORT["ca_swaps"] < 24 to the existing CARROT2 swap gate only.',
            'seeds':seeds,
            'wld':{k:sum(r['outcome']==k for r in rows) for k in 'WLD'},
            'mean':mean,'median':statistics.median(vals),'se':se,'mean_minus_2se':mean-2*se,
            'worst':min(vals),'best':max(vals),
            'seat0_mean':statistics.mean(r['seat_deltas'][0] for r in rows),
            'seat1_mean':statistics.mean(r['seat_deltas'][1] for r in rows),
            'candidate_exceptions':exc_c,'parent_exceptions':exc_p,'non_done':non_done,
            'rows':rows,
          }
          Path('results/ca_swapcap24_dev.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2))
          assert exc_c == 0 and exc_p == 0 and non_done == 0
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'swap-cap24 dev evaluation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-ca-swapcap24-dev
          path: results/
          if-no-files-found: error
          retention-days: 30
