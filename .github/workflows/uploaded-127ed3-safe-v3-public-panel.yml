name: uploaded 127ed3 safety-v3 public regression panel

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/workflows/uploaded-127ed3-safe-v3-public-panel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: starter
            opponent: starter
            blob_sha: builtin
          - name: beat_v48
            opponent: opponents/beat_v48/main.py
            blob_sha: bfde138606ff486372a7d5dccbe03634dac5b88b
          - name: bl_v20
            opponent: opponents/bl_v20/main.py
            blob_sha: 43d4f52b8c931e67a535b0ba5794f989bde1c116
          - name: bl_v21
            opponent: opponents/bl_v21/main.py
            blob_sha: 474585fc7ae1c922e553830d4ba87952dbda0881
          - name: farming_v2
            opponent: opponents/farming_v2/main.py
            blob_sha: 000f64b6b9a4273fc52b8c59a8409d1f5e9c1943
          - name: frontier_prvsiyan
            opponent: opponents/frontier_prvsiyan/main.py
            blob_sha: 55e9af781ac03da062a3601a6d3bafee7cf03b14
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact engine and reconstruct exact agents
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          mkdir -p tmp results
          python - <<'PY'
          import base64,gzip,hashlib,importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          assert importlib.metadata.version('kaggle-environments')=='1.32.7'
          assert hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          root=Path('ci/uploaded_127ed3')
          raw=gzip.decompress(base64.b64decode(''.join((root/f'part{i:02d}.b64').read_text(encoding='ascii') for i in range(12))))
          assert hashlib.sha256(raw).hexdigest()=='127ed3e62988c0474d386db6527ae8ca9de9bb1fe7004128557ddef67126c652'
          suffix = (
              "\n\n# Safety-only wrapper v3: delete/reinsert agent so Kaggle namespace-order loader selects it.\n"
              "_SAFE_V3_PARENT = ig_agent\n"
              "try:\n"
              "    del agent\n"
              "except Exception:\n"
              "    pass\n"
              "def agent(observation, configuration=None):\n"
              "    try:\n"
              "        return _SAFE_V3_PARENT(observation, configuration)\n"
              "    except Exception:\n"
              "        return {\"farmer\": [\"PASS\"], \"hands\": [], \"market\": []}\n"
              "agent.telemetry = _SAFE_V3_PARENT.telemetry\n"
          ).encode('utf-8')
          safe=raw+suffix
          Path('tmp/safe_v3.py').write_bytes(safe)
          assert hashlib.sha256(safe).hexdigest()=='87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df'
          PY
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          python - <<'PY'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n)
              p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          PY
          (cd tmp && patch --binary --batch -p3 -i ../ci/v76.patch)
          python - <<'PY'
          from pathlib import Path
          p=Path('tmp/main.py')
          p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          PY
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v147_confirmed_v111_clone.py tmp/v115.py tmp/v147.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('tmp/v147.py').read_bytes()).hexdigest()=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'
          PY
          python -m py_compile tmp/safe_v3.py tmp/v147.py

      - name: Verify frozen opponent
        if: matrix.opponent != 'starter'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object '${{ matrix.opponent }}')"
          test "$actual" = '${{ matrix.blob_sha }}'

      - name: Burned public regression seeds 621-624
        shell: bash
        run: |
          set -euo pipefail
          python ci/eval_candidate_vs_champion_panel.py \
            --candidate tmp/safe_v3.py \
            --champion tmp/v147.py \
            --opponent '${{ matrix.opponent }}' \
            --seed-start 621 \
            --seed-count 4 \
            --jobs 4 \
            --out 'results/panel-${{ matrix.name }}.json'
          python - <<'PY'
          import glob,json
          p=glob.glob('results/panel-*.json')
          assert len(p)==1
          d=json.load(open(p[0],encoding='utf-8'))
          assert d['candidate_exceptions']==0
          assert d['champion_exceptions']==0
          print('PANEL_GATE', {k:d[k] for k in ('opponent','wins','losses','ties','candidate_minus_champion_mean','candidate_minus_champion_se','worst','best','seat0_mean','seat1_mean','candidate_exceptions','champion_exceptions')})
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-safe-v3-public-${{ matrix.name }}
          path: results/
          if-no-files-found: error
          retention-days: 30
