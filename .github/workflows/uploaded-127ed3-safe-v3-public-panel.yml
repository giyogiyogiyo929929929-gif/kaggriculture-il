name: uploaded 127ed3 safety-v3 public panel

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/workflows/uploaded-127ed3-safe-v3-public-panel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 150
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact safety-v3 and v147
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results,results\panel | Out-Null
          @'
          import base64,gzip,hashlib,importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          assert importlib.metadata.version('kaggle-environments')=='1.32.7'
          assert hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          root=Path('ci/uploaded_127ed3')
          raw=gzip.decompress(base64.b64decode(''.join((root/f'part{i:02d}.b64').read_text(encoding='ascii') for i in range(12))))
          assert hashlib.sha256(raw).hexdigest()=='127ed3e62988c0474d386db6527ae8ca9de9bb1fe7004128557ddef67126c652'
          suffix=b'''\n\n# Safety-only wrapper v3: delete/reinsert agent so Kaggle namespace-order loader selects it.\n_SAFE_V3_PARENT = ig_agent\ntry:\n    del agent\nexcept Exception:\n    pass\ndef agent(observation, configuration=None):\n    try:\n        return _SAFE_V3_PARENT(observation, configuration)\n    except Exception:\n        return {"farmer": ["PASS"], "hands": [], "market": []}\nagent.telemetry = _SAFE_V3_PARENT.telemetry\n'''
          safe=raw+suffix; Path('tmp/safe_v3.py').write_bytes(safe)
          assert hashlib.sha256(safe).hexdigest()=='87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df'
          '@ | python -
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          Push-Location tmp; patch --binary --batch -p3 -i ..\ci\v76.patch; if ($LASTEXITCODE -ne 0) { throw 'patch failed' }; Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          @'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('tmp/v147.py').read_bytes()).hexdigest()=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'
          '@ | python -
          python -m py_compile tmp\safe_v3.py tmp\v147.py
      - name: Burned public panel seeds 641-644
        run: |
          $ErrorActionPreference='Stop'
          function Run-Panel([string]$name,[string]$opp) {
            python ci\eval_candidate_vs_champion_panel.py --candidate tmp\safe_v3.py --champion tmp\v147.py --opponent $opp --seed-start 641 --seed-count 4 --jobs 2 --out "results\panel\$name.json"
            if ($LASTEXITCODE -ne 0) { throw "panel failed: $name" }
          }
          Run-Panel 'starter' 'starter'
          Run-Panel 'beat_v48' 'opponents\beat_v48\main.py'
          Run-Panel 'bl_v20' 'opponents\bl_v20\main.py'
          Run-Panel 'bl_v21' 'opponents\bl_v21\main.py'
          Run-Panel 'farming_v2' 'opponents\farming_v2\main.py'
          Run-Panel 'frontier_prvsiyan' 'opponents\frontier_prvsiyan\main.py'
      - name: Aggregate candidate minus champion
        if: always()
        run: |
          @'
          import glob,json,statistics,math
          from pathlib import Path
          panels=[]
          for p in sorted(glob.glob('results/panel/*.json')):
              d=json.load(open(p,encoding='utf-8')); d['panel_name']=Path(p).stem; panels.append(d)
          vals=[float(r['candidate_minus_champion_money']) for p in panels for r in p.get('rows',[])]
          n=len(vals); mean=statistics.fmean(vals) if vals else 0.0; se=statistics.stdev(vals)/(n**0.5) if n>1 else 0.0
          out={'label':'BURNED_PUBLIC_PANEL_NOT_SEALED','candidate_sha256':'87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df','champion_sha256':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923','engine':'1.32.7','seeds':'641-644','panel_count':len(panels),'paired_rows':n,'wins':sum(x>0 for x in vals),'losses':sum(x<0 for x in vals),'draws':sum(x==0 for x in vals),'mean':mean,'se':se,'mean_minus_2se':mean-2*se,'worst':min(vals) if vals else None,'best':max(vals) if vals else None,'candidate_exceptions':sum(int(p.get('candidate_exceptions',0)) for p in panels),'champion_exceptions':sum(int(p.get('champion_exceptions',0)) for p in panels),'panels':[{'name':p['panel_name'],'wins':p['wins'],'losses':p['losses'],'ties':p['ties'],'mean':p['candidate_minus_champion_mean'],'worst':p['worst'],'best':p['best'],'rows':[{'seed':r['seed'],'diff':r['candidate_minus_champion_money']} for r in p['rows']]} for p in panels]}
          Path('results/summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print('PUBLIC_PANEL_SUMMARY',json.dumps(out,indent=2))
          assert out['candidate_exceptions']==0 and out['champion_exceptions']==0
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-safe-v3-public-panel
          path: results/
          if-no-files-found: error
          retention-days: 30
