name: uploaded 127ed3 feed0 earlythin v1 focused

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/workflows/uploaded-127ed3-ca-feed0-earlythin-v1-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact agents
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          python ci\build_uploaded_127ed3_safety_v3.py tmp\safe_v3.py
          python ci\build_uploaded_127ed3_ca_feed0.py tmp\safe_v3.py tmp\feed0.py
          python ci\build_uploaded_127ed3_ca_feed0_earlythin_v1.py tmp\feed0.py tmp\candidate.py
          @'
          import hashlib,importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          assert importlib.metadata.version('kaggle-environments')=='1.32.7'
          assert hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          assert hashlib.sha256(Path('tmp/feed0.py').read_bytes()).hexdigest()=='cc300eda64d0fe1f884bd164f973de2177eb68c1808cafed06bfeadc5b446e44'
          assert hashlib.sha256(Path('tmp/candidate.py').read_bytes()).hexdigest()=='e172cc82ff049766b9013a0a973817359d04349946544b1ba2091b552dc07c82'
          '@ | python -
          python -m py_compile tmp\feed0.py tmp\candidate.py
      - name: Focused starter and burned direct checks
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,statistics
          from pathlib import Path
          from kaggle_environments import make
          from scripts.preflight import load_like_kaggle,call_like_kaggle

          candidate=Path('tmp/candidate.py'); champion=Path('tmp/feed0.py'); previous=Path('tmp/safe_v3.py')
          starter_seeds=[641,642,643,644]
          burned=[641,350003,101,211,347,509,733,911,1201,1601]

          def run_file_vs(agent_path, opponent, seed, seat):
              a=load_like_kaggle(agent_path); exc=[0]
              def wrap(obs,cfg=None):
                  try:return call_like_kaggle(a,obs,cfg)
                  except Exception:
                      exc[0]+=1
                      return {'farmer':['PASS'],'hands':[],'market':[]}
              if isinstance(opponent,Path):
                  b=load_like_kaggle(opponent); bexc=[0]
                  def bwrap(obs,cfg=None):
                      try:return call_like_kaggle(b,obs,cfg)
                      except Exception:
                          bexc[0]+=1
                          return {'farmer':['PASS'],'hands':[],'market':[]}
              else:
                  bwrap=opponent; bexc=[0]
              agents=[wrap,bwrap] if seat==0 else [bwrap,wrap]
              env=make('kaggriculture',configuration={'seed':seed}); env.run(agents)
              statuses=[s.get('status') for s in env.state]
              assert statuses==['DONE','DONE'] and len(env.steps)==720
              rewards=[float(s.get('reward',0)) for s in env.state]
              return {'mine':rewards[seat],'opp':rewards[1-seat],'margin':rewards[seat]-rewards[1-seat],'exc':exc[0],'opp_exc':bexc[0]}

          out={'candidate_sha256':'e172cc82ff049766b9013a0a973817359d04349946544b1ba2091b552dc07c82','champion_sha256':'cc300eda64d0fe1f884bd164f973de2177eb68c1808cafed06bfeadc5b446e44','starter':[],'burned':[]}

          for seed in starter_seeds:
              row={'seed':seed}; vals={}
              for label,path in [('candidate',candidate),('champion',champion),('previous',previous)]:
                  games=[run_file_vs(path,'starter',seed,seat) for seat in (0,1)]
                  assert sum(g['exc'] for g in games)==0
                  vals[label]={'seat_margins':[g['margin'] for g in games],'pair_margin':statistics.mean(g['margin'] for g in games),'money':[g['mine'] for g in games]}
              row.update(vals)
              row['candidate_minus_champion_margin']=vals['candidate']['pair_margin']-vals['champion']['pair_margin']
              row['candidate_minus_previous_margin']=vals['candidate']['pair_margin']-vals['previous']['pair_margin']
              out['starter'].append(row)

          deltas=[]
          for seed in burned:
              games=[]
              for seat in (0,1):
                  r=run_file_vs(candidate,champion,seed,seat)
                  assert r['exc']==0 and r['opp_exc']==0
                  games.append(r['margin'])
              d=statistics.mean(games); deltas.append(d)
              out['burned'].append({'seed':seed,'seat_deltas':games,'candidate_minus_champion':d})
          se=statistics.stdev(deltas)/(len(deltas)**0.5) if len(deltas)>1 else 0.0
          out['burned_summary']={'wins':sum(d>0 for d in deltas),'losses':sum(d<0 for d in deltas),'draws':sum(d==0 for d in deltas),'mean':statistics.mean(deltas),'median':statistics.median(deltas),'se':se,'mean_minus_2se':statistics.mean(deltas)-2*se,'worst':min(deltas),'best':max(deltas)}
          Path('results/earlythin_v1_focused.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-ca-feed0-earlythin-v1-focused
          path: results/
          if-no-files-found: error
          retention-days: 30
