name: uploaded 127ed3 safety-v3 outcome regression

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/workflows/uploaded-127ed3-safe-v3-outcome-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcome-regression:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact engine and reconstruct exact agents
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          python -m pip install --no-deps 'kaggle-environments==1.32.7'; if ($LASTEXITCODE -ne 0) { throw 'engine install failed' }
          python -m pip install jsonschema requests; if ($LASTEXITCODE -ne 0) { throw 'deps install failed' }
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          @'
          import base64,gzip,hashlib,importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          assert importlib.metadata.version('kaggle-environments')=='1.32.7'
          assert hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          root=Path('ci/uploaded_127ed3')
          raw=gzip.decompress(base64.b64decode(''.join((root/f'part{i:02d}.b64').read_text(encoding='ascii') for i in range(12))))
          assert hashlib.sha256(raw).hexdigest()=='127ed3e62988c0474d386db6527ae8ca9de9bb1fe7004128557ddef67126c652'
          suffix=b'''\n\n# Safety-only wrapper v3: delete/reinsert agent so Kaggle namespace-order loader selects it.\n_SAFE_V3_PARENT = ig_agent\ntry:\n    del agent\nexcept Exception:\n    pass\ndef agent(observation, configuration=None):\n    try:\n        return _SAFE_V3_PARENT(observation, configuration)\n    except Exception:\n        return {"farmer": ["PASS"], "hands": [], "market": []}\nagent.telemetry = _SAFE_V3_PARENT.telemetry\n'''
          safe=raw+suffix
          Path('tmp/safe_v3.py').write_bytes(safe)
          assert hashlib.sha256(safe).hexdigest()=='87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'candidate reconstruct failed' }
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'newline normalization failed' }
          Push-Location tmp; patch --binary --batch -p3 -i ..\ci\v76.patch; if ($LASTEXITCODE -ne 0) { throw 'patch failed' }; Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v77 patch failed' }
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py; if ($LASTEXITCODE -ne 0) { throw 'v115 reconstruct failed' }
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py; if ($LASTEXITCODE -ne 0) { throw 'v147 reconstruct failed' }
          @'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('tmp/v147.py').read_bytes()).hexdigest()=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v147 hash failed' }
          python -m py_compile tmp\safe_v3.py tmp\v147.py; if ($LASTEXITCODE -ne 0) { throw 'py_compile failed' }
      - name: Outcome-centric public and formal known-opponent regression
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib,json,statistics
          from collections import Counter
          from pathlib import Path
          from scripts.eval import evaluate

          opponents=[
            ('starter','starter'),
            ('beat_v48','opponents/beat_v48/main.py'),
            ('bl_v20','opponents/bl_v20/main.py'),
            ('bl_v21','opponents/bl_v21/main.py'),
            ('farming_v2','opponents/farming_v2/main.py'),
            ('frontier_prvsiyan','opponents/frontier_prvsiyan/main.py'),
          ]
          blocks={
            'public_burned_621_624':[621,622,623,624],
            'formal_known_641_644':[641,642,643,644],
          }
          rank={'L':0,'D':1,'W':2}
          def outcome(m):
              a,b=float(m[0]),float(m[1])
              return 'W' if a>b else ('L' if a<b else 'D')
          def wld(rows,key):
              c=Counter(r[key] for r in rows)
              return {k:c.get(k,0) for k in ('W','L','D')}

          aggregate={
            'candidate_sha256':'87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df',
            'champion_sha256':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923',
            'blocks':{},
          }
          for block,seeds in blocks.items():
              bout=[]
              for name,opp in opponents:
                  prov={'name':name,'opponent':opp,'opponent_sha256':'builtin:starter' if opp=='starter' else hashlib.sha256(Path(opp).read_bytes()).hexdigest()}
                  rows=[]; exa=exb=0
                  for seed in seeds:
                      cs=evaluate('tmp/safe_v3.py',opp,pairs=1,jobs=1,seed_start=seed)
                      hs=evaluate('tmp/v147.py',opp,pairs=1,jobs=1,seed_start=seed)
                      exa+=cs['exceptions']['a']; exb+=hs['exceptions']['a']
                      cand={(int(g['seed']),bool(g['swap'])):g for g in cs['matches_detail']}
                      champ={(int(g['seed']),bool(g['swap'])):g for g in hs['matches_detail']}
                      for swap in (False,True):
                          c=cand[(seed,swap)]; h=champ[(seed,swap)]
                          co=outcome(c['money']); ho=outcome(h['money'])
                          cm=[float(x) for x in c['money']]; hm=[float(x) for x in h['money']]
                          transition=f'{ho}->{co}'
                          rows.append({
                            'seed':seed,'swap':swap,
                            'candidate_money':cm,'champion_money':hm,
                            'candidate_outcome':co,'champion_outcome':ho,
                            'transition':transition,
                            'outcome_delta':rank[co]-rank[ho],
                            'candidate_minus_champion_money':cm[0]-hm[0],
                            'candidate_minus_champion_margin':(cm[0]-cm[1])-(hm[0]-hm[1]),
                          })
                  assert exa==0 and exb==0
                  transitions=Counter(r['transition'] for r in rows)
                  regressions=[r for r in rows if r['outcome_delta']<0]
                  improvements=[r for r in rows if r['outcome_delta']>0]
                  same=[r for r in rows if r['outcome_delta']==0]
                  out={
                    **prov,
                    'candidate_wld_vs_opponent':wld(rows,'candidate_outcome'),
                    'champion_wld_vs_opponent':wld(rows,'champion_outcome'),
                    'outcome_regressions':len(regressions),
                    'outcome_improvements':len(improvements),
                    'outcome_same':len(same),
                    'transitions':dict(sorted(transitions.items())),
                    'candidate_exceptions':exa,'champion_exceptions':exb,
                    'mean_candidate_minus_champion_money':statistics.mean(r['candidate_minus_champion_money'] for r in rows),
                    'worst_candidate_minus_champion_money':min(r['candidate_minus_champion_money'] for r in rows),
                    'mean_candidate_minus_champion_margin':statistics.mean(r['candidate_minus_champion_margin'] for r in rows),
                    'rows':rows,
                  }
                  Path(f'results/{block}__{name}.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
                  bout.append(out)
                  print(block,name,json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2))
              summary={
                'seeds':seeds,
                'opponents':bout,
                'total_candidate_wld':{k:sum(x['candidate_wld_vs_opponent'][k] for x in bout) for k in ('W','L','D')},
                'total_champion_wld':{k:sum(x['champion_wld_vs_opponent'][k] for x in bout) for k in ('W','L','D')},
                'total_outcome_regressions':sum(x['outcome_regressions'] for x in bout),
                'total_outcome_improvements':sum(x['outcome_improvements'] for x in bout),
                'opponents_with_regression':[x['name'] for x in bout if x['outcome_regressions']>0],
                'opponents_with_improvement':[x['name'] for x in bout if x['outcome_improvements']>0],
              }
              aggregate['blocks'][block]=summary
          Path('results/outcome_aggregate.json').write_text(json.dumps(aggregate,indent=2),encoding='utf-8')
          print('OUTCOME_AGGREGATE',json.dumps({b:{k:v for k,v in x.items() if k!='opponents'} for b,x in aggregate['blocks'].items()},indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'outcome regression evaluation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-safe-v3-outcome-regression
          path: results/
          if-no-files-found: error
          retention-days: 30
