name: v139 selected-seed K1-only contrast

on:
  push:
    branches: [eval-public-opponents-20260923]
    paths: [".github/workflows/v139-selected-seed-contrast.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact Kaggriculture 1.32.7
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
          python - <<'PY'
          import kaggle_environments
          assert kaggle_environments.__version__ == '1.32.7'
          PY
      - name: Build exact v115 and v139
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v139_v92_k2.py tmp/v115.py tmp/v139.py
          python -m py_compile tmp/v115.py tmp/v139.py ci/diagnose_v139_seed628.py ci/diagnose_v139_selected_seeds.py
      - name: Contrast K1-only first divergences
        env:
          PYTHONPATH: .
        run: |
          python ci/diagnose_v139_selected_seeds.py --v115 tmp/v115.py --v139 tmp/v139.py --out results/selected_seed_contrast.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v139-selected-seed-contrast
          path: results/
          if-no-files-found: error
          retention-days: 14
