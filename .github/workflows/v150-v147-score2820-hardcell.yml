name: v150 v147 score2820 hard cell

on:
  push:
    branches: [eval-v150-v147-singleton-hardcell-20260926]
    paths: [".github/workflows/v150-v147-score2820-hardcell.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned engine and reconstruct exact v147/v150
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'
          $env:Path="$gitUsr;$env:Path"
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize=@'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append=@'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v150_v147_single_weak_vote.py tmp\v147.py tmp\v150.py
          python -m py_compile tmp\v147.py tmp\v150.py
          python -c "import hashlib; from pathlib import Path; p=Path('tmp/v147.py'); g=hashlib.sha256(p.read_bytes()).hexdigest(); print(g); assert g=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'"
      - name: Direct focused controls
        run: |
          python scripts\eval.py tmp\v150.py tmp\v147.py -n 1 -j 1 --seed-start 651 --json results\direct651.json
      - name: score_2820 seed520104 both seats
        run: |
          python ci\eval_candidate_vs_champion_panel.py --candidate tmp\v150.py --champion tmp\v147.py --opponent opponents\score_2820\main.py --seed-start 520104 --seed-count 1 --jobs 1 --out results\score2820_520104.json
      - name: Summarize
        if: always()
        run: |
          $code=@'
          import json
          from pathlib import Path
          d=json.loads(Path('results/direct651.json').read_text())
          h=json.loads(Path('results/score2820_520104.json').read_text())
          out={'direct651':d,'hardcell':h}
          Path('results/summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          '@
          $code | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v150-v147-score2820-hardcell
          path: results/
          if-no-files-found: error
          retention-days: 30
