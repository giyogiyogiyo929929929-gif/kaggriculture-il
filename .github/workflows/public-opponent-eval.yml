name: Public opponent eval

on:
  push:
    branches:
      - eval-public-opponents-20260923

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal Kaggriculture runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
          python - <<'PY'
          from kaggle_environments import make
          env = make('kaggriculture', configuration={'randomSeed': 1}, debug=True)
          env.run(['starter', 'starter'])
          assert len(env.steps) == 720
          print('kaggriculture runtime OK')
          PY

      - name: Build loader-safe v77 and exact-v124 transfer candidate
        run: |
          mkdir -p tmp
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          cp tmp/v77.py tmp/v77_liveherd.py
          cat >> tmp/v77_liveherd.py <<'PY'

          # Exact structural gate used by v124 on the v115 line:
          # SHEEP -> COW requires >=2 PIZZA_SHOP instances; COW -> SHEEP remains score-gated.
          # Public concept source: GzmCR/Kaggriculture reactive livestock scoring.
          _LH_PARENT = agent
          _LH_TARGET_BASE = _y_target
          _LH_OBS = None
          _LH_RATIO = 1.15
          _LH_BASE_PRICE = {'MILK':160.0,'WOOL':200.0}
          _LH_SHOP_PRODUCTS = {
              'BAKERY':('EGG','WHEAT'), 'PIZZA_SHOP':('MILK','TOMATO','WHEAT'),
              'BRUNCH_SPOT':('EGG','WHEAT','STRAWBERRY'), 'YARN_STORE':('WOOL',),
              'ICE_CREAM_SHOP':('STRAWBERRY','MILK','WHEAT'), 'PET_CAFE':('CARROT',),
              'SMOOTHIE_SHOP':('STRAWBERRY','MILK'),
              'FARMERS_MARKET':('WHEAT','CARROT','TOMATO','STRAWBERRY'),
          }
          _LH_REPORT={'calls':0,'considered':0,'swaps':0,'errors':0}

          def _lh_counts(obs, seat):
              out={'COW':0,'SHEEP':0}
              for row in obs['farms'][seat].get('tiles',[]) or []:
                  for tile in row:
                      if isinstance(tile,dict) and tile.get('animal') in out:
                          out[tile['animal']]+=1
              return out

          def _lh_demand(obs, product):
              day=int(obs.get('day',0) or 0)
              total=2*(4 if day>=20 else 2 if day>=10 else 1)
              for name in ((obs.get('town') or {}).get('unlocked_shops',[]) or []):
                  products=_LH_SHOP_PRODUCTS.get(name,())
                  if product in products:
                      total += 12 if len(products)==1 else 6
              return total

          def _lh_score(obs, animal, own, rival):
              product='MILK' if animal=='COW' else 'WOOL'
              price=float((obs.get('market') or {}).get('prices',{}).get(product,_LH_BASE_PRICE[product]) or _LH_BASE_PRICE[product])
              return (price/_LH_BASE_PRICE[product])*(1.0+0.012*_lh_demand(obs,product))/(1.0+0.18*rival+0.08*own)

          def _y_target(kind, shops, cfg):
              base=_LH_TARGET_BASE(kind,shops,cfg)
              if base is not None:
                  return base
              obs=_LH_OBS
              if obs is None or kind not in ('COW','SHEEP'):
                  return None
              try:
                  day=int(obs.get('day',0) or 0)
                  if not (cfg['days'][0] <= day <= cfg['days'][1]):
                      return None
                  seat=int(obs.get('player',0) or 0)
                  own=_lh_counts(obs,seat); rival=_lh_counts(obs,1-seat)
                  other='SHEEP' if kind=='COW' else 'COW'
                  a=_lh_score(obs,kind,own[kind],rival[kind]); b=_lh_score(obs,other,own[other],rival[other])
                  _LH_REPORT['considered']+=1
                  pizza_shops=sum(1 for name in shops if name=='PIZZA_SHOP')
                  structural=(kind!='SHEEP' or other!='COW' or pizza_shops>=2)
                  if structural and b>a*_LH_RATIO:
                      _LH_REPORT['swaps']+=1
                      return other
              except Exception:
                  _LH_REPORT['errors']+=1
              return None

          def agent(observation, configuration=None):
              global _LH_OBS
              _LH_REPORT['calls']+=1
              _LH_OBS=observation
              try:
                  return _LH_PARENT(observation,configuration)
              finally:
                  _LH_OBS=None

          agent.telemetry=_LH_REPORT
          kaggle_submission_agent_v77_liveherd=agent
          PY
          python -m py_compile tmp/v77.py tmp/v77_liveherd.py
          python - <<'PY'
          import importlib.util
          for path,want in [('tmp/v77.py','kaggle_submission_agent_v77'),('tmp/v77_liveherd.py','kaggle_submission_agent_v77_liveherd')]:
              s=importlib.util.spec_from_file_location('_diag',path);m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
              last_name=None
              for k,v in vars(m).items():
                  if callable(v): last_name=k
              print(path,'last callable:',last_name)
              assert last_name==want
          PY

      - name: Serial runtime gate
        run: |
          mkdir -p results
          python - <<'PY' | tee results/runtime_preflight.log
          from pathlib import Path
          from scripts.preflight import load_like_kaggle, check_turn_time
          agent = load_like_kaggle(Path('tmp/v77_liveherd.py'))
          result = check_turn_time(agent)
          print(result.line())
          if not result.ok:
              raise SystemExit(1)
          PY

      - name: Run 20-pair acceptance comparisons
        shell: bash
        run: |
          run_eval() {
            name="$1"; a="$2"; b="$3"; jobs="$4"
            echo "===== ${name}: ${a} vs ${b} ====="
            python scripts/eval.py "$a" "$b" -n 20 -j "$jobs" --json "results/${name}.json" | tee "results/${name}.log"
          }
          # Score significance does not depend on worker count because seeds are fixed.
          # Runtime itself was measured separately above in a single process.
          run_eval direct20 tmp/v77_liveherd.py tmp/v77.py 2
          run_eval starter20 tmp/v77_liveherd.py starter 2
          python - <<'PY' | tee results/acceptance_check.log
          import json
          direct=json.load(open('results/direct20.json',encoding='utf-8'))
          starter=json.load(open('results/starter20.json',encoding='utf-8'))
          checks={
              'direct_positive_2se': direct['pair_diff_mean'] > 0 and direct['pair_diff_mean'] >= 2*direct['pair_diff_stderr'],
              'starter_19_of_20': starter['wins'] >= 19,
              'exceptions_zero': direct['exceptions']['a']==0 and starter['exceptions']['a']==0,
              'animals_lost_zero': direct['health']['a']['animals_lost']==0 and starter['health']['a']['animals_lost']==0,
              'shed_under_100': direct['health']['a']['shed_final'] < 100 and starter['health']['a']['shed_final'] < 100,
              'crop_loss_under_5pct': all(
                  s['health']['a']['crop_losses'] <= 0.05*max(1,s['health']['a']['planted'])
                  for s in (direct,starter)
              ),
          }
          print(json.dumps({'checks':checks,'direct':{'mean':direct['pair_diff_mean'],'stderr':direct['pair_diff_stderr'],'wins':direct['wins'],'losses':direct['losses'],'draws':direct['draws']},'starter':{'wins':starter['wins'],'losses':starter['losses'],'draws':starter['draws']}},ensure_ascii=False,indent=2))
          if not all(checks.values()):
              raise SystemExit(2)
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liveherd-acceptance-results
          path: results/
          retention-days: 7
