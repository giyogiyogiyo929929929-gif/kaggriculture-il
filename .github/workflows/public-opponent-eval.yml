name: Public opponent eval

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - eval-public-opponents-20260923

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal Kaggriculture runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
          python - <<'PY'
          from kaggle_environments import make
          env = make('kaggriculture', configuration={'randomSeed': 1}, debug=True)
          env.run(['starter', 'starter'])
          assert len(env.steps) == 720
          print('kaggriculture runtime OK')
          PY

      - name: Build v76 from frozen v27
        run: |
          mkdir -p tmp
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          mv tmp/main.py tmp/v76.py
          python -m py_compile tmp/v76.py

      - name: Fetch public opponents
        run: |
          mkdir -p tmp/public
          git clone --depth 1 https://github.com/GzmCR/Kaggriculture tmp/public/gzmcr || true
          git clone --depth 1 https://github.com/Seyamalam/Kaggriculture tmp/public/seyamalam || true
          git clone --depth 1 https://github.com/COK-ZhangZiliang/Kaggriculture tmp/public/cok || true
          git clone --depth 1 https://github.com/ian-turner/kaggriculture tmp/public/ian_turner || true

      - name: Run evaluation panel
        shell: bash
        run: |
          mkdir -p results
          run_eval() {
            name="$1"
            path="$2"
            echo "===== ${name}: ${path} ====="
            if [ ! -f "$path" ]; then
              echo "missing: $path" | tee "results/${name}.log"
              return 0
            fi
            set +e
            python scripts/eval.py tmp/v76.py "$path" -n 5 -j 1 --json "results/${name}.json" > "results/${name}.log" 2>&1
            code=$?
            set -e
            echo "exit_code=${code}" >> "results/${name}.log"
            tail -80 "results/${name}.log" || true
          }

          run_eval gzmcr tmp/public/gzmcr/main.py
          run_eval seyamalam tmp/public/seyamalam/main.py
          run_eval cok tmp/public/cok/main.py
          run_eval ian_turner tmp/public/ian_turner/main.py

          run_eval repo_beat_v48 opponents/beat_v48/main.py
          run_eval repo_bl_v20 opponents/bl_v20/main.py
          run_eval repo_bl_v21 opponents/bl_v21/main.py
          run_eval repo_farming_v2 opponents/farming_v2/main.py
          run_eval repo_frontier_prvsiyan opponents/frontier_prvsiyan/main.py

      - name: Build summary
        if: always()
        run: |
          mkdir -p results
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('results').glob('*.json')):
              try:
                  d=json.loads(p.read_text())
              except Exception as e:
                  rows.append({'name':p.stem,'error':str(e)})
                  continue
              rows.append({
                  'name':p.stem,
                  'wins':d.get('wins'),
                  'losses':d.get('losses'),
                  'draws':d.get('draws'),
                  'pair_diff_mean':d.get('pair_diff_mean'),
                  'pair_diff_stderr':d.get('pair_diff_stderr'),
                  'agent_a_median':d.get('agent_a_median'),
                  'agent_b_median':d.get('agent_b_median'),
                  'exceptions_a':d.get('exceptions_a'),
                  'exceptions_b':d.get('exceptions_b'),
              })
          Path('results/summary.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          print(json.dumps(rows,indent=2))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-opponent-eval-results
          path: results/
          retention-days: 7
