name: Public opponent eval

on:
  push:
    branches:
      - eval-public-opponents-20260923

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal Kaggriculture runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
          python - <<'PY'
          from kaggle_environments import make
          env=make('kaggriculture',configuration={'randomSeed':1},debug=True)
          env.run(['starter','starter'])
          assert len(env.steps)==720
          print('kaggriculture runtime OK')
          PY

      - name: Build baseline and traced ratio candidates
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python - <<'PY'
          from pathlib import Path

          base=Path('tmp/v77.py').read_text(encoding='utf-8')
          wrapper=r'''

          import os as _lh_os
          import json as _lh_json
          _LH_PARENT=agent
          _LH_TARGET_BASE=_y_target
          _LH_OBS=None
          _LH_RATIO=__RATIO__
          _LH_BASE_PRICE={'MILK':160.0,'WOOL':200.0}
          _LH_SHOP_PRODUCTS={
              'BAKERY':('EGG','WHEAT'),'PIZZA_SHOP':('MILK','TOMATO','WHEAT'),
              'BRUNCH_SPOT':('EGG','WHEAT','STRAWBERRY'),'YARN_STORE':('WOOL',),
              'ICE_CREAM_SHOP':('STRAWBERRY','MILK','WHEAT'),'PET_CAFE':('CARROT',),
              'SMOOTHIE_SHOP':('STRAWBERRY','MILK'),
              'FARMERS_MARKET':('WHEAT','CARROT','TOMATO','STRAWBERRY'),
          }
          def _lh_counts(obs,seat):
              out={'COW':0,'SHEEP':0}
              for row in obs['farms'][seat].get('tiles',[]) or []:
                  for tile in row:
                      if isinstance(tile,dict) and tile.get('animal') in out: out[tile['animal']]+=1
              return out
          def _lh_demand(obs,product):
              day=int(obs.get('day',0) or 0); total=2*(4 if day>=20 else 2 if day>=10 else 1)
              for name in ((obs.get('town') or {}).get('unlocked_shops',[]) or []):
                  products=_LH_SHOP_PRODUCTS.get(name,())
                  if product in products: total += 12 if len(products)==1 else 6
              return total
          def _lh_score(obs,animal,own,rival):
              product='MILK' if animal=='COW' else 'WOOL'
              price=float((obs.get('market') or {}).get('prices',{}).get(product,_LH_BASE_PRICE[product]) or _LH_BASE_PRICE[product])
              return (price/_LH_BASE_PRICE[product])*(1.0+0.012*_lh_demand(obs,product))/(1.0+0.18*rival+0.08*own)
          def _lh_trace(row):
              path=_lh_os.environ.get('LH_TRACE_FILE')
              if not path: return
              row['label']=_lh_os.environ.get('LH_TRACE_LABEL','')
              with open(path,'a',encoding='utf-8') as f:
                  f.write(_lh_json.dumps(row,ensure_ascii=False)+'\n')
          def _y_target(kind,shops,cfg):
              base=_LH_TARGET_BASE(kind,shops,cfg)
              if base is not None: return base
              obs=_LH_OBS
              if obs is None or kind not in ('COW','SHEEP'): return None
              day=int(obs.get('day',0) or 0)
              if not (cfg['days'][0] <= day <= cfg['days'][1]): return None
              seat=int(obs.get('player',0) or 0); own=_lh_counts(obs,seat); rival=_lh_counts(obs,1-seat)
              other='SHEEP' if kind=='COW' else 'COW'
              a=_lh_score(obs,kind,own[kind],rival[kind]); b=_lh_score(obs,other,own[other],rival[other])
              pizza_shops=sum(1 for name in shops if name=='PIZZA_SHOP')
              structural=(kind!='SHEEP' or other!='COW' or pizza_shops>=2)
              swap=bool(structural and b>a*_LH_RATIO)
              if kind=='SHEEP' and other=='COW':
                  prices=(obs.get('market') or {}).get('prices',{}) or {}
                  _lh_trace({'day':day,'seat':seat,'kind':kind,'other':other,'shops':list(shops),
                             'pizza_shops':pizza_shops,'own':own,'rival':rival,
                             'milk_price':prices.get('MILK'),'wool_price':prices.get('WOOL'),
                             'milk_demand':_lh_demand(obs,'MILK'),'wool_demand':_lh_demand(obs,'WOOL'),
                             'sheep_score':a,'cow_score':b,'ratio':(b/a if a else 999.0),
                             'threshold':_LH_RATIO,'swap':swap})
              if swap: return other
              return None
          def agent(observation,configuration=None):
              global _LH_OBS
              _LH_OBS=observation
              try: return _LH_PARENT(observation,configuration)
              finally: _LH_OBS=None
          kaggle_submission_agent___NAME__=agent
          '''
          candidates={'v124':1.15,'v126':1.20,'v127':1.25,'v128':1.30}
          for name,ratio in candidates.items():
              text=base+wrapper.replace('__RATIO__',str(ratio)).replace('__NAME__',name)
              Path(f'tmp/{name}.py').write_text(text,encoding='utf-8')
          PY
          python -m py_compile tmp/v77.py tmp/v124.py tmp/v126.py tmp/v127.py tmp/v128.py

      - name: Focused SHEEP-to-COW telemetry and ratio sweep
        run: |
          python - <<'PY' | tee results/focused.log
          import json, os
          from scripts.eval import evaluate
          seeds=[1,105,130,133,144,151]
          agents={'v124':'tmp/v124.py','v126':'tmp/v126.py','v127':'tmp/v127.py','v128':'tmp/v128.py'}
          out={}
          trace='results/sheep_to_cow_trace.jsonl'
          if os.path.exists(trace): os.remove(trace)
          os.environ['LH_TRACE_FILE']=trace
          for name,path in agents.items():
              out[name]={}
              for seed in seeds:
                  os.environ['LH_TRACE_LABEL']=f'{name}:seed{seed}'
                  s=evaluate(path,'tmp/v77.py',pairs=1,jobs=1,seed_start=seed)
                  games=s['matches_detail']
                  diffs=[g['money'][0]-g['money'][1] for g in games]
                  row={'game_diffs':diffs,'pair_diff':s['pair_diff_mean'],'exceptions':s['exceptions']['a']}
                  out[name][str(seed)]=row
                  print(name,seed,row)
          with open('results/focused.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)

          # Compact trace summary: unique triggering contexts per candidate/seed.
          rows=[]
          if os.path.exists(trace):
              with open(trace,encoding='utf-8') as f:
                  rows=[json.loads(x) for x in f if x.strip()]
          summary={}
          for r in rows:
              if not r['swap']: continue
              key=r['label']
              bucket=summary.setdefault(key,{'swap_calls':0,'ratios':[],'days':[],'pizza_shops':[],'contexts':[]})
              bucket['swap_calls']+=1
              bucket['ratios'].append(r['ratio']); bucket['days'].append(r['day']); bucket['pizza_shops'].append(r['pizza_shops'])
              ctx={k:r[k] for k in ('day','seat','pizza_shops','own','rival','milk_price','wool_price','milk_demand','wool_demand','ratio')}
              if ctx not in bucket['contexts']: bucket['contexts'].append(ctx)
          for key,b in summary.items():
              b['ratio_min']=min(b['ratios']); b['ratio_max']=max(b['ratios'])
              del b['ratios']
          with open('results/trace_summary.json','w',encoding='utf-8') as f: json.dump(summary,f,ensure_ascii=False,indent=2)
          print('TRACE_SUMMARY')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liveherd-sheep-cow-telemetry-results
          path: results/
          retention-days: 7
