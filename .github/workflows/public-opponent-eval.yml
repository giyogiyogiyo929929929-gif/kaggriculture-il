name: Public opponent eval

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - eval-public-opponents-20260923

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal Kaggriculture runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
          python - <<'PY'
          from kaggle_environments import make
          env = make('kaggriculture', configuration={'randomSeed': 1}, debug=True)
          env.run(['starter', 'starter'])
          assert len(env.steps) == 720
          print('kaggriculture runtime OK')
          PY

      - name: Build loader-safe v77 from frozen v27
        run: |
          mkdir -p tmp
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python -m py_compile tmp/v77.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('tmp/v77.py')
          s=importlib.util.spec_from_file_location('_diag_v77',p)
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          last_name=None; last=None
          for k,v in vars(m).items():
              if callable(v): last_name,last=k,v
          print('last callable:', last_name, getattr(last,'__name__',None))
          assert last_name == 'kaggle_submission_agent_v77'
          PY

      - name: Fetch public opponents
        run: |
          mkdir -p tmp/public
          git clone --depth 1 https://github.com/GzmCR/Kaggriculture tmp/public/gzmcr
          git clone --depth 1 https://github.com/Seyamalam/Kaggriculture tmp/public/seyamalam
          git clone --depth 1 https://github.com/COK-ZhangZiliang/Kaggriculture tmp/public/cok

      - name: Run public 3-seed panel
        shell: bash
        run: |
          mkdir -p results
          run_eval() {
            name="$1"
            path="$2"
            echo "===== ${name}: ${path} ====="
            set +e
            python scripts/eval.py tmp/v77.py "$path" -n 3 -j 1 --json "results/${name}.json" > "results/${name}.log" 2>&1
            code=$?
            set -e
            echo "exit_code=${code}" >> "results/${name}.log"
            cat "results/${name}.log"
          }
          run_eval gzmcr tmp/public/gzmcr/main.py
          run_eval seyamalam tmp/public/seyamalam/main.py
          run_eval cok tmp/public/cok/main.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-opponent-eval-results
          path: results/
          retention-days: 7
