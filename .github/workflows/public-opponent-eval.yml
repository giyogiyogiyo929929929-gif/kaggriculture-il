name: Public opponent eval

on:
  push:
    branches:
      - eval-public-opponents-20260923

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal Kaggriculture runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
          python - <<'PY'
          from kaggle_environments import make
          env=make('kaggriculture',configuration={'randomSeed':1},debug=True)
          env.run(['starter','starter'])
          assert len(env.steps)==720
          print('kaggriculture runtime OK')
          PY

      - name: Build baseline and instrumented live-herd agents
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python - <<'PY'
          from pathlib import Path
          base=Path('tmp/v77.py').read_text(encoding='utf-8')
          wrapper=r'''

          _LH_PARENT=agent
          _LH_TARGET_BASE=_y_target
          _LH_OBS=None
          _LH_RATIO=1.15
          _LH_HIGH_PRICE_GATE=__HIGH_PRICE_GATE__
          _LH_BASE_PRICE={'MILK':160.0,'WOOL':200.0}
          _LH_SHOP_PRODUCTS={
              'BAKERY':('EGG','WHEAT'),'PIZZA_SHOP':('MILK','TOMATO','WHEAT'),
              'BRUNCH_SPOT':('EGG','WHEAT','STRAWBERRY'),'YARN_STORE':('WOOL',),
              'ICE_CREAM_SHOP':('STRAWBERRY','MILK','WHEAT'),'PET_CAFE':('CARROT',),
              'SMOOTHIE_SHOP':('STRAWBERRY','MILK'),
              'FARMERS_MARKET':('WHEAT','CARROT','TOMATO','STRAWBERRY'),
          }
          _LH_TELEM=[]
          def _lh_counts(obs,seat):
              out={'COW':0,'SHEEP':0}
              for row in obs['farms'][seat].get('tiles',[]) or []:
                  for tile in row:
                      if isinstance(tile,dict) and tile.get('animal') in out: out[tile['animal']]+=1
              return out
          def _lh_demand(obs,product):
              day=int(obs.get('day',0) or 0); total=2*(4 if day>=20 else 2 if day>=10 else 1)
              for name in ((obs.get('town') or {}).get('unlocked_shops',[]) or []):
                  products=_LH_SHOP_PRODUCTS.get(name,())
                  if product in products: total += 12 if len(products)==1 else 6
              return total
          def _lh_score(obs,animal,own,rival):
              product='MILK' if animal=='COW' else 'WOOL'
              price=float((obs.get('market') or {}).get('prices',{}).get(product,_LH_BASE_PRICE[product]) or _LH_BASE_PRICE[product])
              return (price/_LH_BASE_PRICE[product])*(1.0+0.012*_lh_demand(obs,product))/(1.0+0.18*rival+0.08*own)
          def _y_target(kind,shops,cfg):
              base=_LH_TARGET_BASE(kind,shops,cfg)
              if base is not None: return base
              obs=_LH_OBS
              if obs is None or kind not in ('COW','SHEEP'): return None
              day=int(obs.get('day',0) or 0)
              if not (cfg['days'][0] <= day <= cfg['days'][1]): return None
              seat=int(obs.get('player',0) or 0); own=_lh_counts(obs,seat); rival=_lh_counts(obs,1-seat)
              other='SHEEP' if kind=='COW' else 'COW'
              a=_lh_score(obs,kind,own[kind],rival[kind]); b=_lh_score(obs,other,own[other],rival[other])
              pizza_shops=sum(1 for name in shops if name=='PIZZA_SHOP')
              structural=(kind!='SHEEP' or other!='COW' or pizza_shops>=2)
              demand_backed=True
              prices=(obs.get('market') or {}).get('prices',{}) or {}
              milk_price=float(prices.get('MILK',160.0) or 160.0)
              wool_price=float(prices.get('WOOL',200.0) or 200.0)
              milk_demand=_lh_demand(obs,'MILK'); wool_demand=_lh_demand(obs,'WOOL')
              if _LH_HIGH_PRICE_GATE and kind=='SHEEP' and other=='COW':
                  demand_backed=(milk_price < 215.0 or milk_demand >= 20)
              would_swap=bool(structural and demand_backed and b>a*_LH_RATIO)
              if kind=='SHEEP' and other=='COW' and pizza_shops>=2:
                  _LH_TELEM.append({
                      'step':int(obs.get('step',-1) or -1),'day':day,'seat':seat,'pizza':pizza_shops,
                      'own':dict(own),'rival':dict(rival),'milk_price':milk_price,'wool_price':wool_price,
                      'milk_demand':milk_demand,'wool_demand':wool_demand,'sheep_score':a,'cow_score':b,
                      'ratio':(b/a if a else 999.0),'demand_backed':demand_backed,'would_swap':would_swap,
                      'shops':list(shops),
                  })
              if would_swap: return other
              return None
          def agent(observation,configuration=None):
              global _LH_OBS
              _LH_OBS=observation
              try: return _LH_PARENT(observation,configuration)
              finally: _LH_OBS=None
          kaggle_submission_agent___NAME__=agent
          '''
          for name,gate in [('v124','False'),('v129','True')]:
              Path(f'tmp/{name}.py').write_text(base+wrapper.replace('__HIGH_PRICE_GATE__',gate).replace('__NAME__',name),encoding='utf-8')
          PY
          python -m py_compile tmp/v77.py tmp/v124.py tmp/v129.py

      - name: Focused seed216 and reference-seed diagnosis
        run: |
          python - <<'PY' | tee results/diagnosis.log
          import json
          from scripts.eval import evaluate
          seeds=[1,105,130,133,144,151,216]
          out={}
          for name,path in [('v124','tmp/v124.py'),('v129','tmp/v129.py')]:
              out[name]={}
              for seed in seeds:
                  s=evaluate(path,'tmp/v77.py',pairs=1,jobs=1,seed_start=seed)
                  row={'pair_diff':s['pair_diff_mean'],'exceptions':s['exceptions']['a']}
                  out[name][str(seed)]=row
                  print(name,seed,row)
          with open('results/diagnosis.json','w') as f: json.dump(out,f,indent=2)
          PY

      - name: Capture live-herd trigger telemetry
        run: |
          python - <<'PY' | tee results/telemetry.log
          import importlib.util, json, sys
          from pathlib import Path
          from kaggle_environments import make

          def load(path, tag):
              p=Path(path).resolve()
              spec=importlib.util.spec_from_file_location(tag,p)
              m=importlib.util.module_from_spec(spec); sys.modules[tag]=m
              sys.path.insert(0,str(p.parent))
              try: spec.loader.exec_module(m)
              finally: sys.path.pop(0)
              return m

          seeds=[1,105,130,133,144,151,216]
          all_rows=[]
          for variant in ['v124','v129']:
              for seed in seeds:
                  for swap in [False,True]:
                      cand=load(f'tmp/{variant}.py',f'cand_{variant}_{seed}_{int(swap)}')
                      base=load('tmp/v77.py',f'base_{variant}_{seed}_{int(swap)}')
                      env=make('kaggriculture',configuration={'seed':seed})
                      agents=[base.agent,cand.agent] if swap else [cand.agent,base.agent]
                      env.run(agents)
                      seat=1 if swap else 0
                      reward=float(env.state[seat]['reward'])
                      rows=[r for r in cand._LH_TELEM if r.get('would_swap') or r.get('ratio',0)>=1.10]
                      rec={'variant':variant,'seed':seed,'swap':swap,'candidate_reward':reward,'telemetry':rows}
                      all_rows.append(rec)
                      print('CASE',variant,seed,'swap',swap,'reward',reward,'events',json.dumps(rows,sort_keys=True))
          with open('results/telemetry.json','w') as f: json.dump(all_rows,f,indent=2)
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liveherd-seed216-telemetry
          path: results/
          retention-days: 7
