name: v134 vs exact v115 development panel

on:
  push:
    branches:
      - eval-public-opponents-20260923
    paths:
      - ".github/workflows/v134-v115-dev-panel.yml"
      - "ci/build_v134_from_v115.py"
      - "ci/eval_candidate_vs_champion_panel.py"
      - "ci/reconstruct_exact_v115.py"
      - "ci/v77_to_v115.patch.gz.b64"

permissions:
  contents: read

jobs:
  panel:
    name: panel-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: starter
            opponent: starter
          - name: beat_v48
            opponent: opponents/beat_v48/main.py
          - name: bl_v20
            opponent: opponents/bl_v20/main.py
          - name: bl_v21
            opponent: opponents/bl_v21/main.py
          - name: farming_v2
            opponent: opponents/farming_v2/main.py
          - name: frontier_prvsiyan
            opponent: opponents/frontier_prvsiyan/main.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
          python - <<'PY'
          import kaggle_environments
          from kaggle_environments import make
          assert kaggle_environments.__version__ == '1.32.7'
          env=make('kaggriculture',configuration={'seed':341},debug=True)
          env.run(['starter','starter'])
          assert len(env.steps)==720
          print('kaggriculture',kaggle_environments.__version__)
          PY
      - name: Reconstruct exact v115 and build v134
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v134_from_v115.py tmp/v115.py tmp/v134.py
          python -m py_compile tmp/v115.py tmp/v134.py
          sha256sum tmp/v115.py tmp/v134.py
      - name: Matched development panel
        run: |
          python ci/eval_candidate_vs_champion_panel.py \
            --candidate tmp/v134.py \
            --champion tmp/v115.py \
            --opponent '${{ matrix.opponent }}' \
            --seed-start 341 \
            --seed-count 8 \
            --jobs 4 \
            --out results/panel.json
      - name: Upload panel result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v134-dev-${{ matrix.name }}
          path: results/
          if-no-files-found: error
          retention-days: 14

  direct:
    name: direct-v115
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Reconstruct agents
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v134_from_v115.py tmp/v115.py tmp/v134.py
          python -m py_compile tmp/v115.py tmp/v134.py
      - name: Direct matched H2H
        run: |
          python - <<'PY'
          import json
          from scripts.eval import evaluate
          s=evaluate('tmp/v134.py','tmp/v115.py',pairs=8,jobs=4,seed_start=341)
          out={
              'metric':'candidate_minus_champion = candidate - champion direct pair margin',
              'wins':s['wins'],'losses':s['losses'],'ties':s['draws'],
              'candidate_minus_champion_mean':s['pair_diff_mean'],
              'candidate_minus_champion_se':s['pair_diff_stderr'],
              'candidate_exceptions':s['exceptions']['a'],
              'champion_exceptions':s['exceptions']['b'],
              'matches_detail':s['matches_detail'],
          }
          with open('results/direct.json','w') as f: json.dump(out,f,indent=2)
          print(json.dumps({k:v for k,v in out.items() if k!='matches_detail'},indent=2))
          PY
      - name: Upload direct result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v134-dev-direct-v115
          path: results/
          if-no-files-found: error
          retention-days: 14
