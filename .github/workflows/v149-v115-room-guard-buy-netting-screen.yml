name: v149 room guard buy-netting burned screen

on:
  push:
    branches: [eval-v115-v149-room-guard-buy-netting-20260926]
    paths:
      - ".github/workflows/v149-v115-room-guard-buy-netting-screen.yml"
      - "ci/build_v149_room_guard_buy_netting.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact engine
        run: |
          $ErrorActionPreference = 'Stop'
          $gitUsr = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path = "$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
      - name: Reconstruct exact v115 and build v144/v149
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize = @'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append = @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v144_public_room_guard.py tmp\v115.py tmp\v144.py
          python ci\build_v149_room_guard_buy_netting.py tmp\v115.py tmp\v149.py
          python -m py_compile tmp\v115.py tmp\v144.py tmp\v149.py ci\build_v149_room_guard_buy_netting.py
          $check = @'
          import hashlib
          from pathlib import Path
          c=Path('tmp/v115.py'); a=Path('tmp/v144.py'); b=Path('tmp/v149.py')
          sha=hashlib.sha256(c.read_bytes()).hexdigest(); print('v115_sha256',sha)
          print('v144_sha256',hashlib.sha256(a.read_bytes()).hexdigest())
          print('v149_sha256',hashlib.sha256(b.read_bytes()).hexdigest())
          assert sha == 'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2'
          cs=c.read_text(encoding='utf-8'); aa=a.read_text(encoding='utf-8'); bb=b.read_text(encoding='utf-8')
          assert aa == cs.replace("'room_guard': False", "'room_guard': True", 1)
          assert bb.count('v149: if this emergency sale') == 1
          for s in ("'budget_guard': False","'clamp_sells': False","'dead_stock': False","'terminal_liquidation': False","'front_run': False"):
              assert bb.count(s) == 1, s
          print('localized_change_verified=true')
          '@
          $check | python -
      - name: Focused synthetic buy netting
        run: |
          $ErrorActionPreference = 'Stop'
          $code = @'
          import copy, importlib.util
          from types import SimpleNamespace
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); return m
          m144=load('v144','tmp/v144.py'); m149=load('v149','tmp/v149.py')
          def run(m, *, shed, carried=0, market=None, step=23, future=None):
              future=future or {}
              tape=[copy.deepcopy(m.PASS_ACTION) for _ in range(719)]
              for item,qty in future.items():
                  if qty: tape[24]={'farmer':['PASS'],'hands':[],'market':[['SELL',item,qty]]}
              ch=m.Chassis({'r':tape}, settings={'room_guard':True})
              invs=[] if not carried else [{'WHEAT':carried}]
              view=SimpleNamespace(invs=invs,positions=[],tiles=[],shed=dict(shed),prices={p:100 for p in m.PRODUCTS})
              a={'farmer':['PASS'],'hands':[],'market':copy.deepcopy(market or [])}
              ch._room_guard(a,view,'r',step); return a
          def qty(a,op,item): return sum(int(o[2]) for o in a['market'] if o and len(o)>=3 and o[0]==op and o[1]==item)
          # no overflow => exact no-op
          x=run(m149,shed={'WHEAT':98},market=[['BUY_PRODUCT','WHEAT',1]])
          assert x['market']==[['BUY_PRODUCT','WHEAT',1]], x
          # no same-item buy => preserve v144 emergency sale
          kw=dict(shed={'WHEAT':95},carried=10,market=[])
          a=run(m144,**kw); b=run(m149,**kw); assert a==b and qty(b,'SELL','WHEAT')==6,(a,b)
          # same-item buy alone can make room: shrink buy, do not inject supply
          kw=dict(shed={'WHEAT':95},market=[['BUY_PRODUCT','WHEAT',10]])
          a=run(m144,**kw); b=run(m149,**kw)
          assert qty(a,'SELL','WHEAT')==6,a
          assert qty(b,'BUY_PRODUCT','WHEAT')==4 and qty(b,'SELL','WHEAT')==0,b
          # overflow exceeds same-item buy: net all buy, then sell residual
          kw=dict(shed={'WHEAT':95},carried=10,market=[['BUY_PRODUCT','WHEAT',2]])
          b=run(m149,**kw)
          assert qty(b,'BUY_PRODUCT','WHEAT')==0 and qty(b,'SELL','WHEAT')==6,b
          # unrelated buy remains untouched
          kw=dict(shed={'WHEAT':95},market=[['BUY_PRODUCT','FERTILIZER',10]])
          b=run(m149,**kw)
          assert qty(b,'BUY_PRODUCT','FERTILIZER')==10 and qty(b,'SELL','WHEAT')==6,b
          # wrong hour => no netting/sale
          b=run(m149,shed={'WHEAT':95},market=[['BUY_PRODUCT','WHEAT',10]],step=22)
          assert b['market']==[['BUY_PRODUCT','WHEAT',10]],b
          print('synthetic_buy_netting=true')
          '@
          $code | python -
      - name: Runtime preflight burned 683 and 689
        run: |
          python scripts\eval.py tmp\v149.py tmp\v115.py -n 1 -j 1 --seed-start 683 --json results\runtime_683.json
          python scripts\eval.py tmp\v149.py tmp\v115.py -n 1 -j 1 --seed-start 689 --json results\runtime_689.json
          $code = @'
          import json
          for p in ('results/runtime_683.json','results/runtime_689.json'):
              d=json.load(open(p,encoding='utf-8'))
              assert d['exceptions']['a']==0 and d['exceptions']['b']==0,p
              assert d['timings']['a']['max'] < 0.2,(p,d['timings']['a'])
              print(p,d['timings']['a'])
          '@
          $code | python -
      - name: Burned v149 vs exact v115 seeds 681-692
        run: |
          python scripts\eval.py tmp\v149.py tmp\v115.py -n 12 -j 4 --seed-start 681 --json results\burned_v149_vs_v115.json
          if ($LASTEXITCODE -ne 0) { throw 'burned v149-v115 failed' }
      - name: Burned v149 vs v144 seeds 681-692
        run: |
          python scripts\eval.py tmp\v149.py tmp\v144.py -n 12 -j 4 --seed-start 681 --json results\burned_v149_vs_v144.json
          if ($LASTEXITCODE -ne 0) { throw 'burned v149-v144 failed' }
      - name: Aggregate
        if: always()
        run: |
          $code = @'
          import json,statistics
          from pathlib import Path
          def summarize(path):
              p=Path(path)
              if not p.exists(): return None
              d=json.loads(p.read_text(encoding='utf-8')); by={}
              for g in d['matches_detail']:
                  by.setdefault(int(g['seed']),[]).append(float(g['money'][0])-float(g['money'][1]))
              rows=[{'seed':s,'delta':statistics.mean(v),'seat_diffs':v} for s,v in sorted(by.items())]; vals=[r['delta'] for r in rows]
              return {'pairs':len(vals),'wins':sum(x>0 for x in vals),'losses':sum(x<0 for x in vals),'ties':sum(x==0 for x in vals),'mean':statistics.mean(vals) if vals else None,'worst':min(vals) if vals else None,'best':max(vals) if vals else None,'candidate_exceptions':d['exceptions']['a'],'reference_exceptions':d['exceptions']['b'],'rows':rows}
          out={'candidate':'v149_room_guard_buy_netting','champion':'v115_champion_same_turn_open_squeeze','engine':'kaggle_environments==1.32.7','metric':'candidate_minus_reference = candidate - reference','burned_vs_v115':summarize('results/burned_v149_vs_v115.json'),'burned_vs_v144':summarize('results/burned_v149_vs_v144.json'),'decision':'BURNED DIAGNOSTIC ONLY; no automatic promotion'}
          Path('results/v149_burned_summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps(out,indent=2))
          '@
          $code | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v149-room-guard-buy-netting-burned-screen
          path: results/
          if-no-files-found: error
          retention-days: 30
