name: V131 Persistent Lead Scout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v131-persistent-lead-scout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { id: beat_v48, opponent: opponents/beat_v48 }
          - { id: starter, opponent: starter }
          - { id: bl_v21, opponent: opponents/bl_v21 }
          - { id: bl_v16rc2, opponent: opponents/bl_v16rc2 }
          - { id: frontier_prvsiyan, opponent: opponents/frontier_prvsiyan }
          - { id: first_in_line, opponent: opponents/first_in_line }
          - { id: farming_v2, opponent: opponents/farming_v2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle-environments==1.32.7"
          python - <<'PY'
          import kaggle_environments
          assert kaggle_environments.__version__ == "1.32.7"
          PY
      - name: Rebuild v121/v130 and build exact v131
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python eval_assets/v130/rebuild_eval_agents.py --out-dir eval_agents/v130
          python eval_assets/v130/build_v131.py \
            --source eval_agents/v130/v130_candidate_late_town_draw_gate24.py \
            --out eval_agents/v130/v131_candidate_persistent_late_lead5000.py
      - name: Candidate against matched opponent
        run: |
          mkdir -p results/${{ matrix.id }}
          python scripts/ci/run_exact_pair.py \
            --candidate eval_agents/v130/v131_candidate_persistent_late_lead5000.py \
            --baseline "${{ matrix.opponent }}" \
            --seed-start 380001 --seed-count 12 \
            --out results/${{ matrix.id }}/candidate.json
      - name: Champion against matched opponent
        run: |
          python scripts/ci/run_exact_pair.py \
            --candidate eval_agents/v130/v121_champion_same_turn_unwind.py \
            --baseline "${{ matrix.opponent }}" \
            --seed-start 380001 --seed-count 12 \
            --out results/${{ matrix.id }}/champion.json
      - name: Normalize candidate_minus_champion
        run: |
          python eval_assets/v130/compare_candidate_champion.py \
            --candidate-json results/${{ matrix.id }}/candidate.json \
            --champion-json results/${{ matrix.id }}/champion.json \
            --opponent "${{ matrix.opponent }}" \
            --out results/${{ matrix.id }}/summary.json
      - name: Upload opponent result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v131-scout-${{ matrix.id }}
          path: results/${{ matrix.id }}/
          retention-days: 30

  aggregate:
    if: always()
    needs: panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v131-scout-*
          path: artifacts
      - name: Aggregate deterministic panel
        run: |
          python - <<'PY'
          import glob,json,math,statistics
          from pathlib import Path
          ss=[json.load(open(p,encoding='utf-8')) for p in sorted(glob.glob('artifacts/**/summary.json',recursive=True))]
          rows=[r for s in ss for r in s.get('rows',[])]
          ds=[float(r['candidate_minus_champion']) for r in rows]
          n=len(ds); mean=statistics.fmean(ds) if ds else 0.0
          sd=statistics.stdev(ds) if n>1 else 0.0; se=sd/math.sqrt(n) if n else 0.0
          out={'engine':'kaggle_environments==1.32.7','candidate':'v131_candidate_persistent_late_lead5000.py',
               'seed_start':380001,'seed_count_per_opponent':12,'opponents':len(ss),'paired_rows':n,
               'wins':sum(x>0 for x in ds),'losses':sum(x<0 for x in ds),'draws':sum(x==0 for x in ds),
               'mean_candidate_minus_champion':mean,'se':se,'mean_minus_2se':mean-2*se,
               'worst_regression':min(ds) if ds else 0.0,'best_improvement':max(ds) if ds else 0.0,
               'regression_worlds':[s['opponent'] for s in ss if s['losses']],
               'all_ok':len(ss)==7 and all(s.get('all_ok') for s in ss),'summaries':ss}
          Path('v131_scout_summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in out.items() if k!='summaries'},indent=2))
          if not out['all_ok']: raise SystemExit('technical gate failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v131-scout-summary
          path: v131_scout_summary.json
          retention-days: 30
