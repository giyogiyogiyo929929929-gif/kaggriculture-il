name: v112-v116-current-lineage-initial
on:
  push:
    branches: [eval/v112-v116-milk-micro-20260926]
    paths:
      - ".github/workflows/v112-v116-current.yml"
      - "experiments/v112_v116_milk_micro/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "kaggle-environments==1.32.7"
      - run: |
          cd experiments/v112_v116_milk_micro
          python build_sources.py
          python -m py_compile v110b_wheat_late_batch_lead2.py v112_wheat_lead3_lowdemand.py v116_milk_micro_lead1.py run_initial_eval.py
          python run_initial_eval.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v112-v116-current-initial
          path: experiments/v112_v116_milk_micro/current_lineage_initial.json
          if-no-files-found: error
