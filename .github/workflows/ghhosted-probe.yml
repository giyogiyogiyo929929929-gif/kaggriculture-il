name: ghhosted probe

on:
  push:
    branches: [eval-ghhosted-probe-20260927]
    paths: [".github/workflows/ghhosted-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe
        run: |
          python --version
          uname -a
          echo ghhosted_ok
