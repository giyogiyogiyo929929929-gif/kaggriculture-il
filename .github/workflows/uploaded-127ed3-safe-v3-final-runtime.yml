name: uploaded 127ed3 safety-v3 final runtime gate

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/workflows/uploaded-127ed3-safe-v3-final-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact engine and reconstruct exact agents
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          python -m pip install --no-deps 'kaggle-environments==1.32.7'; if ($LASTEXITCODE -ne 0) { throw 'kaggle-environments install failed' }
          python -m pip install jsonschema requests; if ($LASTEXITCODE -ne 0) { throw 'dependency install failed' }
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          @'
          import base64,gzip,hashlib,importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          assert importlib.metadata.version('kaggle-environments')=='1.32.7'
          assert hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          root=Path('ci/uploaded_127ed3')
          raw=gzip.decompress(base64.b64decode(''.join((root/f'part{i:02d}.b64').read_text(encoding='ascii') for i in range(12))))
          assert hashlib.sha256(raw).hexdigest()=='127ed3e62988c0474d386db6527ae8ca9de9bb1fe7004128557ddef67126c652'
          suffix=b'''\n\n# Safety-only wrapper v3: delete/reinsert agent so Kaggle namespace-order loader selects it.\n_SAFE_V3_PARENT = ig_agent\ntry:\n    del agent\nexcept Exception:\n    pass\ndef agent(observation, configuration=None):\n    try:\n        return _SAFE_V3_PARENT(observation, configuration)\n    except Exception:\n        return {"farmer": ["PASS"], "hands": [], "market": []}\nagent.telemetry = _SAFE_V3_PARENT.telemetry\n'''
          safe=raw+suffix
          Path('tmp/safe_v3.py').write_bytes(safe)
          assert hashlib.sha256(safe).hexdigest()=='87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'safety-v3 reconstruction/hash verification failed' }
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'newline normalization failed' }
          Push-Location tmp; patch --binary --batch -p3 -i ..\ci\v76.patch; if ($LASTEXITCODE -ne 0) { throw 'patch failed' }; Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v77 entrypoint patch failed' }
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py; if ($LASTEXITCODE -ne 0) { throw 'v115 reconstruction failed' }
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py; if ($LASTEXITCODE -ne 0) { throw 'v147 reconstruction failed' }
          @'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('tmp/v147.py').read_bytes()).hexdigest()=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v147 hash verification failed' }
          python -m py_compile tmp\safe_v3.py tmp\v147.py; if ($LASTEXITCODE -ne 0) { throw 'py_compile failed' }

      - name: Single-process final timing gate
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONIOENCODING='utf-8'
          @'
          import gc,json,statistics,sys,time
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts/analysis').resolve()))
          import _common as C

          LIMIT_P99_MS=50.0
          LIMIT_WORST_MS=200.0
          seeds=[71,75]
          mine=C.load('tmp/safe_v3.py')

          def measure(opponent,label):
              ts=[]
              inner=C.wrap(mine)
              def timed(o,c=None):
                  t=time.perf_counter()
                  a=inner(o,c)
                  ts.append(time.perf_counter()-t)
                  return a
              gc.collect()
              for seed in seeds:
                  C.play(timed,opponent,seed)
              ts.sort()
              p99=ts[min(len(ts)-1,int(len(ts)*0.99))]*1000.0
              worst=ts[-1]*1000.0
              median=statistics.median(ts)*1000.0
              return {'label':label,'opponent':opponent,'seeds':seeds,'n':len(ts),'median_ms':median,'p99_ms':p99,'worst_ms':worst,'pass':p99<LIMIT_P99_MS and worst<LIMIT_WORST_MS}

          rows=[measure('starter','starter'),measure('tmp/v147.py','v147')]
          out={'candidate_sha256':'87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df','engine':'1.32.7','limits':{'p99_ms_lt':LIMIT_P99_MS,'worst_ms_lt':LIMIT_WORST_MS},'rows':rows,'pass':all(r['pass'] for r in rows)}
          print('RUNTIME_GATE',json.dumps(out,indent=2))
          Path('results/runtime_gate.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          assert out['pass'], out
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'runtime gate failed' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-safe-v3-final-runtime
          path: results/
          if-no-files-found: error
          retention-days: 30
