name: v95 vs v94 fresh holdout

on:
  push:
    branches: [eval-v94-v95-20260925]
    paths:
      - ".github/workflows/v95-v94-holdout.yml"
      - "actions_eval/v94/**"
      - "actions_eval/v95/**"

permissions:
  contents: read

jobs:
  h2h:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle-environments==1.32.7"
          python - <<'PY'
          import kaggle_environments
          assert kaggle_environments.__version__ == "1.32.7"
          print("kaggle_environments", kaggle_environments.__version__)
          PY
      - name: Run paired shard
        run: |
          mkdir -p results
          python scripts/ci/run_exact_pair.py \
            --candidate actions_eval/v95/main.py \
            --baseline actions_eval/v94/main.py \
            --seed-start 236001 \
            --seed-count 40 \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --out "results/shard-${{ matrix.shard }}.json"
      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v95-v94-shard-${{ matrix.shard }}
          path: results/
          retention-days: 14

  aggregate:
    if: always()
    needs: h2h
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v95-v94-shard-*
          path: artifacts
      - name: Aggregate
        run: |
          python scripts/ci/aggregate_h2h.py \
            --input-dir artifacts \
            --candidate actions_eval/v95/main.py \
            --baseline actions_eval/v94/main.py \
            --seed-start 236001 \
            --seed-count 40 \
            --json-out h2h_summary.json \
            --md-out h2h_summary.md
          cat h2h_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Technical gate
        run: |
          python - <<'PY'
          import json
          s=json.load(open('h2h_summary.json',encoding='utf-8'))
          assert s['pairs_completed']==40, s
          assert s['failed_pairs']==0, s
          assert s['candidate_exceptions']==0, s
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v95-v94-summary
          path: |
            h2h_summary.json
            h2h_summary.md
          retention-days: 30
