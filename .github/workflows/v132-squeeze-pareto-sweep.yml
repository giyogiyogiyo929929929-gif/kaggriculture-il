name: exact v115 squeeze Pareto sweep

on:
  push:
    branches:
      - eval-public-opponents-20260923
    paths:
      - ".github/workflows/v132-squeeze-pareto-sweep.yml"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        attack: [15, 18, 20, 22, 24, 26, 28, 29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Reconstruct exact v115 and one-line attack variant
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          q=${{ matrix.attack }}
          p=Path('tmp/v115.py')
          s=p.read_text()
          assert s.count('_OPEN_ATTACK=30\n') == 1
          t=s.replace('_OPEN_ATTACK=30\n',f'_OPEN_ATTACK={q}\n')
          Path('tmp/candidate.py').write_text(t)
          print('attack',q,'sha256',hashlib.sha256(t.encode()).hexdigest())
          PY
          python -m py_compile tmp/candidate.py
      - name: Direct screen on reused development seeds 309-312
        run: |
          python - <<'PY'
          import json, statistics
          from scripts.eval import evaluate
          s=evaluate('tmp/candidate.py','tmp/v115.py',pairs=4,jobs=4,seed_start=309)
          by={}
          seat={False:[],True:[]}
          for g in s['matches_detail']:
              d=float(g['money'][0])-float(g['money'][1])
              by.setdefault(int(g['seed']),[]).append(d)
              seat[bool(g['swap'])].append(d)
          pair=[statistics.mean(by[k]) for k in sorted(by)]
          out={'pair':pair,'mean':statistics.mean(pair),'worst':min(pair),'best':max(pair),
               'seat0_mean':statistics.mean(seat[False]),'seat1_mean':statistics.mean(seat[True]),
               'candidate_exceptions':s['exceptions']['a'],'champion_exceptions':s['exceptions']['b']}
          open('results/direct.json','w').write(json.dumps(out,indent=2))
          print(out)
          PY
      - name: Frontier margin screen on reused development seeds 321-324
        run: |
          python ci/eval_candidate_vs_champion_margin_panel.py \
            --candidate tmp/candidate.py --champion tmp/v115.py \
            --opponent opponents/frontier_prvsiyan/main.py \
            --seed-start 321 --seed-count 4 --jobs 4 \
            --out results/frontier.json
      - name: Combine
        run: |
          python - <<'PY'
          import json
          q=${{ matrix.attack }}
          d=json.load(open('results/direct.json'))
          f=json.load(open('results/frontier.json'))
          out={'attack':q,'direct':d,'frontier':{k:v for k,v in f.items() if k!='rows'}}
          open('results/summary.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squeeze-pareto-${{ matrix.attack }}
          path: results/
          if-no-files-found: error
          retention-days: 14
