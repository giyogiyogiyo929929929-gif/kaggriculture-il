name: V134 Strict-Future Center Tick Scout

on:
  push:
    branches: [eval-v130-v121-exact-20260925]
    paths:
      - ".github/workflows/v134-scout.yml"
      - "scripts/ci/rebuild_v134_from_v133.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact engine
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install "kaggle-environments==1.32.7"
          if ($LASTEXITCODE -ne 0) { throw "engine install failed" }
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'; print(kaggle_environments.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "engine version check failed" }
      - name: Rebuild v121 through v134
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\Program Files\Git\usr\bin;$env:PATH"
          if (-not (Get-Command patch.exe -ErrorAction SilentlyContinue)) { throw "Git patch.exe not found" }
          python eval_assets/v130/rebuild_eval_agents.py --out-dir eval_agents/v130
          if ($LASTEXITCODE -ne 0) { throw "v121/v130 rebuild failed" }
          python eval_assets/v130/build_v131.py --source eval_agents/v130/v130_candidate_late_town_draw_gate24.py --out eval_agents/v130/v131_candidate_persistent_late_lead5000.py
          if ($LASTEXITCODE -ne 0) { throw "v131 rebuild failed" }
          python eval_assets/v130/build_v132_variants.py --source eval_agents/v130/v131_candidate_persistent_late_lead5000.py --out-dir eval_agents/v130
          if ($LASTEXITCODE -ne 0) { throw "v132 rebuild failed" }
          python eval_assets/v130/build_v133_variants.py --source eval_agents/v130/v132_lastday.py --out-dir eval_agents/v130
          if ($LASTEXITCODE -ne 0) { throw "v133 rebuild failed" }
          python scripts/ci/rebuild_v134_from_v133.py --source eval_agents/v130/v133_center_only.py --out eval_agents/v130/v134_strict_future_center_tick.py
          if ($LASTEXITCODE -ne 0) { throw "v134 rebuild failed" }
      - name: Matched-seed seat-swap scout
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path results | Out-Null
          function Run-Panel([string]$id, [string]$opp, [int]$seed, [int]$count) {
            $dir = Join-Path results $id
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            python scripts/ci/run_exact_pair.py --candidate eval_agents/v130/v134_strict_future_center_tick.py --baseline $opp --seed-start $seed --seed-count $count --out "$dir/candidate.json"
            if ($LASTEXITCODE -ne 0) { throw "candidate run failed: $id" }
            python scripts/ci/run_exact_pair.py --candidate eval_agents/v130/v121_champion_same_turn_unwind.py --baseline $opp --seed-start $seed --seed-count $count --out "$dir/champion.json"
            if ($LASTEXITCODE -ne 0) { throw "champion run failed: $id" }
            python eval_assets/v130/compare_candidate_champion.py --candidate-json "$dir/candidate.json" --champion-json "$dir/champion.json" --opponent $opp --out "$dir/summary.json"
            if ($LASTEXITCODE -ne 0) { throw "compare failed: $id" }
          }
          Run-Panel regression-bl21-382002 opponents/bl_v21 382002 1
          Run-Panel fresh-bl16 opponents/bl_v16rc2 382001 6
          Run-Panel fresh-starter starter 382001 6
          Run-Panel fresh-weak opponents/dz_more_wheat 382101 6
          Run-Panel fresh-frontier opponents/frontier_prvsiyan 382001 6
          Run-Panel strong-farming opponents/farming_v2 382001 6
          Run-Panel strong-first opponents/first_in_line 382001 6
      - name: Aggregate candidate_minus_champion
        if: always()
        run: |
          $code = @'
          import glob,json,math,statistics
          from pathlib import Path
          ss=[]
          for p in sorted(glob.glob('results/*/summary.json')):
              try: ss.append(json.load(open(p,encoding='utf-8')))
              except Exception as e: print('skip',p,e)
          rows=[(s,r) for s in ss for r in s.get('rows',[])]
          ds=[float(r['candidate_minus_champion']) for s,r in rows]
          n=len(ds); mean=statistics.fmean(ds) if n else 0.0
          sd=statistics.stdev(ds) if n>1 else 0.0; se=sd/math.sqrt(n) if n else 0.0
          out={
            'candidate':'v134_strict_future_center_tick',
            'champion':'v121_champion_same_turn_unwind',
            'engine':'kaggle_environments==1.32.7',
            'paired_rows':n,
            'wins':sum(x>0 for x in ds),'losses':sum(x<0 for x in ds),'draws':sum(x==0 for x in ds),
            'mean_candidate_minus_champion':mean,'se':se,'mean_minus_2se':mean-2*se,
            'worst_regression':min(ds) if ds else 0.0,'best_improvement':max(ds) if ds else 0.0,
            'technical_ok':bool(ss) and all(s.get('all_ok') for s in ss),
            'panels':ss,
          }
          Path('v134_scout_summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in out.items() if k!='panels'},indent=2))
          '@
          $code | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v134-strict-future-scout
          path: |
            results/
            v134_scout_summary.json
          retention-days: 30
