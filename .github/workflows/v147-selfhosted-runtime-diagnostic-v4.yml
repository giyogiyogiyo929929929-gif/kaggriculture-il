name: v147 self-hosted runtime diagnostic v4

on:
  push:
    branches: [eval-v115-v142-exposure-20260925]
    paths:
      - ".github/workflows/v147-selfhosted-runtime-diagnostic-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and verify official engine
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'
          $env:Path="$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          $code=@'
          import hashlib,importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          v=importlib.metadata.version('kaggle-environments')
          h=hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()
          print('version',v); print('engine_sha',h)
          assert v=='1.32.7'
          assert h=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          '@
          $code | python -

      - name: Reconstruct exact v115 and v147
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $code=@'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@
          $code | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $code=@'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $code | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python -m py_compile tmp\v115.py tmp\v147.py
          $code=@'
          import hashlib
          from pathlib import Path
          exp={'tmp/v115.py':'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2','tmp/v147.py':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'}
          for p,w in exp.items():
              g=hashlib.sha256(Path(p).read_bytes()).hexdigest(); print(p,g); assert g==w
          '@
          $code | python -

      - name: Paired serial runtime with durable diagnostics
        run: |
          $ErrorActionPreference='Stop'
          $code=@'
          import json,time,statistics
          from pathlib import Path
          from kaggle_environments import make
          from scripts.preflight import load_like_kaggle,call_like_kaggle

          def measure(name,seed,swap):
              agent=load_like_kaggle(Path('tmp')/f'{name}.py'); ts=[]; errors=[]
              def timed(obs,config=None):
                  t=time.perf_counter()
                  try: return call_like_kaggle(agent,obs,config)
                  except Exception as exc:
                      errors.append(f'{type(exc).__name__}: {exc}')
                      return {'farmer':['PASS'],'hands':[],'market':[]}
                  finally: ts.append(time.perf_counter()-t)
              env=make('kaggriculture',configuration={'seed':seed})
              env.run(['starter',timed] if swap else [timed,'starter'])
              xs=sorted(ts); n=len(xs); seat=1 if swap else 0
              return {'name':name,'seed':seed,'swap':swap,'seat':seat,'calls':n,
                      'median_ms':statistics.median(xs)*1000,
                      'p99_ms':xs[min(n-1,int(n*0.99))]*1000,
                      'worst_ms':max(xs)*1000,
                      'errors':errors,'status':env.state[seat].get('status')}

          rows=[]
          # Same seed/seat paired immediately; alternate which agent runs first.
          cases=[(641,False),(641,True),(642,False),(642,True)]
          for i,(seed,swap) in enumerate(cases):
              order=('v115','v147') if i%2==0 else ('v147','v115')
              for name in order:
                  r=measure(name,seed,swap); rows.append(r); print(json.dumps(r))
                  Path('results/runtime_partial.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          by={n:[r for r in rows if r['name']==n] for n in ('v115','v147')}
          summary={}
          for n,rs in by.items():
              summary[n]={'median_of_game_medians_ms':statistics.median(r['median_ms'] for r in rs),
                          'max_game_p99_ms':max(r['p99_ms'] for r in rs),
                          'worst_turn_ms':max(r['worst_ms'] for r in rs),
                          'exceptions':sum(len(r['errors']) for r in rs),
                          'threshold_failures':sum((r['p99_ms']>=50.0 or r['worst_ms']>=200.0 or r['status']!='DONE' or bool(r['errors'])) for r in rs)}
          summary['v147_minus_v115']={k:summary['v147'][k]-summary['v115'][k] for k in ('median_of_game_medians_ms','max_game_p99_ms','worst_turn_ms')}
          payload={'engine':'kaggle_environments==1.32.7','engine_source_sha256':'bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e','serial':True,'paired_order':True,'seeds':[641,642],'both_seats':True,'rows':rows,'summary':summary}
          Path('results/runtime.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          # Assertions happen only after durable result files and printed diagnostics exist.
          assert summary['v115']['exceptions']==0
          assert summary['v147']['exceptions']==0
          assert summary['v115']['threshold_failures']==0, summary['v115']
          assert summary['v147']['threshold_failures']==0, summary['v147']
          '@
          $code | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v147-selfhosted-runtime-diagnostic-v4
          path: results/
          if-no-files-found: error
          retention-days: 30
