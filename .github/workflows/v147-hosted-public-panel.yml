name: v147 hosted public panel

on:
  push:
    branches: [eval-v115-v142-exposure-20260925]
    paths:
      - ".github/workflows/v147-hosted-public-panel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact engine
        run: |
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'; print('engine='+kaggle_environments.__version__)"
      - name: Build exact v115 v140 v147
        run: |
          set -euo pipefail
          mkdir -p tmp results/calibration results/v147
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          python - <<'PY'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          PY
          (cd tmp && patch --binary --batch -p3 -i ../ci/v76.patch)
          python - <<'PY'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          PY
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v140_v92_k2_isolated.py tmp/v115.py tmp/v140.py
          python ci/build_v147_confirmed_v111_clone.py tmp/v115.py tmp/v147.py
          python -m py_compile tmp/v115.py tmp/v140.py tmp/v147.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          exp={'tmp/v115.py':'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2','tmp/v147.py':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'}
          for p,w in exp.items():
              g=hashlib.sha256(Path(p).read_bytes()).hexdigest(); print(p,g); assert g==w,(p,g,w)
          PY
      - name: Calibrate v140 and evaluate v147
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          panels={'starter':'starter','beat_v48':'opponents/beat_v48/main.py','bl_v20':'opponents/bl_v20/main.py','bl_v21':'opponents/bl_v21/main.py','farming_v2':'opponents/farming_v2/main.py','frontier_prvsiyan':'opponents/frontier_prvsiyan/main.py'}
          expected={'starter':[190.0,5.0,0.0,26.0],'beat_v48':[1.0,-16.0,-1.0,0.0],'bl_v20':[0.0,22.0,0.0,8.0],'bl_v21':[0.0,22.0,0.0,8.0],'farming_v2':[1.0,-16.0,-1.0,0.0],'frontier_prvsiyan':[93.0,2.0,-1.0,0.0]}
          for name,opp in panels.items():
              out=f'results/calibration/{name}.json'
              subprocess.run([sys.executable,'ci/eval_candidate_vs_champion_panel.py','--candidate','tmp/v140.py','--champion','tmp/v115.py','--opponent',opp,'--seed-start','641','--seed-count','4','--jobs','2','--out',out],check=True)
              d=json.loads(Path(out).read_text()); got=[float(r['candidate_minus_champion_money']) for r in d['rows']]
              print('CAL',name,got); assert got==expected[name],(name,got,expected[name]); assert d['candidate_exceptions']==0 and d['champion_exceptions']==0
          print('historical_v140_panel_reproduced=true')
          for name,opp in panels.items():
              out=f'results/v147/{name}.json'
              subprocess.run([sys.executable,'ci/eval_candidate_vs_champion_panel.py','--candidate','tmp/v147.py','--champion','tmp/v115.py','--opponent',opp,'--seed-start','641','--seed-count','4','--jobs','2','--out',out],check=True)
          PY
      - name: Aggregate v147
        if: always()
        run: |
          python - <<'PY'
          import glob,json,math,statistics
          from pathlib import Path
          panels=[]
          for p in sorted(glob.glob('results/v147/*.json')):
              d=json.load(open(p)); d['panel_name']=Path(p).stem; panels.append(d)
          vals=[float(r['candidate_minus_champion_money']) for p in panels for r in p.get('rows',[])]
          n=len(vals); mean=statistics.fmean(vals) if vals else 0.; se=statistics.stdev(vals)/(n**.5) if n>1 else 0.
          out={'candidate':'v147_confirmed_v111_clone','candidate_sha256':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923','champion':'v115_champion_same_turn_open_squeeze','engine':'kaggle_environments==1.32.7','paired_rows':n,'wins':sum(x>0 for x in vals),'losses':sum(x<0 for x in vals),'draws':sum(x==0 for x in vals),'mean':mean,'se':se,'mean_minus_2se':mean-2*se,'worst':min(vals) if vals else None,'best':max(vals) if vals else None,'candidate_exceptions':sum(int(p.get('candidate_exceptions',0)) for p in panels),'champion_exceptions':sum(int(p.get('champion_exceptions',0)) for p in panels),'panels':[{'name':p['panel_name'],'diffs':[r['candidate_minus_champion_money'] for r in p['rows']]} for p in panels]}
          Path('results/v147_summary.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if n==24:
              assert out['candidate_exceptions']==0 and out['champion_exceptions']==0
              assert out['worst']>=0,out
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v147-hosted-public-panel
          path: results/
          if-no-files-found: error
          retention-days: 30
