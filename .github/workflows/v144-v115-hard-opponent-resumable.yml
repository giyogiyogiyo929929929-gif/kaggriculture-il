name: v144 vs v115 hard-opponent resumable

on:
  push:
    branches: [eval-v115-v144-public-room-guard-20260925]
    paths:
      - ".github/workflows/v144-v115-hard-opponent-resumable.yml"
      - "ci/summarize_single_opponent_outcomes.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opponent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: k256_h2_q_v1
            path: opponents/k256_h2_q_v1/main.py
          - name: metav4_v13
            path: opponents/metav4_v13/main.py
          - name: v49
            path: opponents/v49/main.py
          - name: v50
            path: opponents/v50/main.py
          - name: tetsutani_dpts_b
            path: opponents/tetsutani_dpts_b/main.py
          - name: salem_2900
            path: opponents/salem_2900/main.py
          - name: peak_2950
            path: opponents/peak_2950/main.py
          - name: jaxa_2802
            path: opponents/jaxa_2802/main.py
          - name: kf_v58
            path: opponents/kf_v58/main.py
          - name: score_2820
            path: opponents/score_2820/main.py
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact engine
        run: |
          $ErrorActionPreference = 'Stop'
          $gitUsr = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path = "$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
      - name: Reconstruct exact v115 and build v144
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize = @'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name)
              p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append = @'
          from pathlib import Path
          p=Path('tmp/main.py')
          p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          if ($LASTEXITCODE -ne 0) { throw 'exact v115 reconstruction failed' }
          python ci\build_v144_public_room_guard.py tmp\v115.py tmp\v144.py
          if ($LASTEXITCODE -ne 0) { throw 'v144 build failed' }
          python -m py_compile tmp\v115.py tmp\v144.py ci\summarize_single_opponent_outcomes.py
          $check = @'
          import hashlib
          from pathlib import Path
          got=hashlib.sha256(Path('tmp/v115.py').read_bytes()).hexdigest()
          print('v115_sha256', got)
          assert got == 'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2'
          '@
          $check | python -
      - name: Evaluate opponent
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '${{ matrix.path }}'
          if (!(Test-Path $path)) { throw "missing opponent $path" }
          python ci\eval_candidate_vs_champion_panel.py --candidate tmp\v144.py --champion tmp\v115.py --opponent $path --seed-start 711001 --seed-count 3 --jobs 1 --out "results\${{ matrix.name }}.json"
          if ($LASTEXITCODE -ne 0) { throw 'evaluation failed' }
      - name: Summarize outcome conversion
        run: |
          python ci\summarize_single_opponent_outcomes.py "results\${{ matrix.name }}.json" "results\${{ matrix.name }}_outcomes.json"
          if ($LASTEXITCODE -ne 0) { throw 'outcome summary failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v144-hard-${{ matrix.name }}
          path: results/
          if-no-files-found: error
          retention-days: 30
