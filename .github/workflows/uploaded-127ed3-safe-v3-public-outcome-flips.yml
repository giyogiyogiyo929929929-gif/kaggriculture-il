name: uploaded 127ed3 safety-v3 public outcome flips

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/workflows/uploaded-127ed3-safe-v3-public-outcome-flips.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcomes:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact engine and reconstruct exact agents
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          python -m pip install --no-deps 'kaggle-environments==1.32.7'; if ($LASTEXITCODE -ne 0) { throw 'engine install failed' }
          python -m pip install jsonschema requests; if ($LASTEXITCODE -ne 0) { throw 'deps install failed' }
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          @'
          import base64,gzip,hashlib,importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          assert importlib.metadata.version('kaggle-environments')=='1.32.7'
          assert hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          root=Path('ci/uploaded_127ed3')
          raw=gzip.decompress(base64.b64decode(''.join((root/f'part{i:02d}.b64').read_text(encoding='ascii') for i in range(12))))
          assert hashlib.sha256(raw).hexdigest()=='127ed3e62988c0474d386db6527ae8ca9de9bb1fe7004128557ddef67126c652'
          suffix=b'''\n\n# Safety-only wrapper v3: delete/reinsert agent so Kaggle namespace-order loader selects it.\n_SAFE_V3_PARENT = ig_agent\ntry:\n    del agent\nexcept Exception:\n    pass\ndef agent(observation, configuration=None):\n    try:\n        return _SAFE_V3_PARENT(observation, configuration)\n    except Exception:\n        return {"farmer": ["PASS"], "hands": [], "market": []}\nagent.telemetry = _SAFE_V3_PARENT.telemetry\n'''
          safe=raw+suffix; Path('tmp/safe_v3.py').write_bytes(safe)
          assert hashlib.sha256(safe).hexdigest()=='87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'candidate reconstruct failed' }
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'newline normalization failed' }
          Push-Location tmp; patch --binary --batch -p3 -i ..\ci\v76.patch; if ($LASTEXITCODE -ne 0) { throw 'patch failed' }; Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v77 patch failed' }
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py; if ($LASTEXITCODE -ne 0) { throw 'v115 reconstruct failed' }
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py; if ($LASTEXITCODE -ne 0) { throw 'v147 reconstruct failed' }
          @'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('tmp/v147.py').read_bytes()).hexdigest()=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v147 hash failed' }
          python -m py_compile tmp\safe_v3.py tmp\v147.py; if ($LASTEXITCODE -ne 0) { throw 'py_compile failed' }
      - name: Compare actual win-loss outcomes on burned public panel
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib,json
          from pathlib import Path
          from scripts.eval import evaluate

          opponents=[
            ('starter','starter'),
            ('beat_v48','opponents/beat_v48/main.py'),
            ('bl_v20','opponents/bl_v20/main.py'),
            ('bl_v21','opponents/bl_v21/main.py'),
            ('farming_v2','opponents/farming_v2/main.py'),
            ('frontier_prvsiyan','opponents/frontier_prvsiyan/main.py'),
          ]
          seeds=[621,622,623,624]
          def outcome(g):
              a=float(g['money'][0]); b=float(g['money'][1])
              return 'W' if a>b else 'L' if a<b else 'D'
          all_out=[]
          for name,opp in opponents:
              rows=[]; cand_counts={k:0 for k in 'WLD'}; champ_counts={k:0 for k in 'WLD'}
              flips={
                'champ_L_to_cand_W':0,'champ_L_to_cand_D':0,'champ_D_to_cand_W':0,
                'champ_W_to_cand_L':0,'champ_W_to_cand_D':0,'champ_D_to_cand_L':0,
                'same':0,
              }
              ex_c=ex_h=0
              for seed in seeds:
                  cs=evaluate('tmp/safe_v3.py',opp,pairs=1,jobs=1,seed_start=seed)
                  hs=evaluate('tmp/v147.py',opp,pairs=1,jobs=1,seed_start=seed)
                  ex_c += int(cs['exceptions']['a']); ex_h += int(hs['exceptions']['a'])
                  cm={(int(g['seed']),bool(g['swap'])):g for g in cs['matches_detail']}
                  hm={(int(g['seed']),bool(g['swap'])):g for g in hs['matches_detail']}
                  for swap in (False,True):
                      c=cm[(seed,swap)]; h=hm[(seed,swap)]
                      co=outcome(c); ho=outcome(h)
                      cand_counts[co]+=1; champ_counts[ho]+=1
                      key='same' if co==ho else f'champ_{ho}_to_cand_{co}'
                      flips[key]+=1
                      rows.append({
                        'seed':seed,'swap':swap,
                        'candidate_outcome':co,'champion_outcome':ho,
                        'candidate_money':c['money'],'champion_money':h['money'],
                        'candidate_margin':float(c['money'][0])-float(c['money'][1]),
                        'champion_margin':float(h['money'][0])-float(h['money'][1]),
                        'outcome_flip':key,
                      })
              assert ex_c==0 and ex_h==0
              improvement_flips=flips['champ_L_to_cand_W']+flips['champ_L_to_cand_D']+flips['champ_D_to_cand_W']
              regression_flips=flips['champ_W_to_cand_L']+flips['champ_W_to_cand_D']+flips['champ_D_to_cand_L']
              out={
                'name':name,'opponent':opp,
                'opponent_sha256':'builtin:starter' if opp=='starter' else hashlib.sha256(Path(opp).read_bytes()).hexdigest(),
                'games':len(rows),'candidate_wld':cand_counts,'champion_wld':champ_counts,
                'candidate_minus_champion_wins':cand_counts['W']-champ_counts['W'],
                'improvement_flips':improvement_flips,'regression_flips':regression_flips,
                'net_favorable_flips':improvement_flips-regression_flips,
                'flip_detail':flips,'candidate_exceptions':ex_c,'champion_exceptions':ex_h,'rows':rows,
              }
              Path(f'results/{name}_outcomes.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
              print(name,json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2))
              all_out.append(out)
          agg={
            'candidate_sha256':'87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df',
            'champion_sha256':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923',
            'seed_block':seeds,'opponents':all_out,
            'opponents_with_net_win_regression':[x['name'] for x in all_out if x['candidate_minus_champion_wins']<0],
            'opponents_with_any_regression_flip':[x['name'] for x in all_out if x['regression_flips']>0],
            'total_candidate_wins':sum(x['candidate_wld']['W'] for x in all_out),
            'total_champion_wins':sum(x['champion_wld']['W'] for x in all_out),
            'total_improvement_flips':sum(x['improvement_flips'] for x in all_out),
            'total_regression_flips':sum(x['regression_flips'] for x in all_out),
          }
          Path('results/aggregate_outcomes.json').write_text(json.dumps(agg,indent=2),encoding='utf-8')
          print('AGGREGATE',json.dumps({k:v for k,v in agg.items() if k!='opponents'},indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'outcome flip evaluation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-safe-v3-public-outcome-flips
          path: results/
          if-no-files-found: error
          retention-days: 30
