name: v154 final submission preflight

on:
  push:
    branches: [eval-v150-v147-singleton-hardcell-20260926]
    paths: [".github/workflows/v154-final-submission-preflight.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-preflight:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact engine and expose GNU patch
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path="$gitUsr;$env:Path"; Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'; print('engine='+kaggle_environments.__version__)"
      - name: Verify official engine source identity
        run: |
          New-Item -ItemType Directory -Force -Path results | Out-Null
          $code=@'
          import hashlib,importlib.metadata,json
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          version=importlib.metadata.version('kaggle-environments'); path=Path(kg.__file__); sha=hashlib.sha256(path.read_bytes()).hexdigest()
          out={'version':version,'kaggriculture_path':str(path),'kaggriculture_sha256':sha}
          print(json.dumps(out,indent=2)); assert version=='1.32.7'; assert sha=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e',sha
          Path('results/engine_identity.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          '@
          $code | python -
      - name: Build exact v147 and v154
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize=@'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append=@'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v154_v147_dense_self_exposure_not_ahead.py tmp\v147.py tmp\v154.py
          python -m py_compile tmp\v147.py tmp\v154.py
          $check=@'
          import hashlib,json
          from pathlib import Path
          expected={'tmp/v147.py':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923','tmp/v154.py':'7366261d9eb774777b222e69d3ddfabd170f6622dfb68eafa02697e2c4baa23e'}
          out={}
          for p,w in expected.items():
              g=hashlib.sha256(Path(p).read_bytes()).hexdigest(); out[p]=g; print(p,g); assert g==w,(p,g,w)
          Path('results/agent_identity.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          '@
          $check | python -
      - name: Static submission regression audit
        run: |
          $code=@'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts.preflight import check_imports
          from scripts.analysis.audit_agent import audit_file
          checks={}
          for name in ('v147','v154'):
              chk=check_imports([Path('tmp')/f'{name}.py']); checks[name]={'ok':bool(chk.ok),'detail':chk.detail,'line':chk.line()}; print(name,chk.line()); assert chk.ok,chk.detail
          base=Counter((depth,what) for _,depth,_,what in audit_file('tmp/v147.py'))
          cand=Counter((depth,what) for _,depth,_,what in audit_file('tmp/v154.py'))
          new=cand-base
          print('v147 risky signatures',dict(base)); print('v154 risky signatures',dict(cand)); print('new candidate risky signatures',dict(new)); assert not new,new
          payload={'import_checks':checks,'v147_risky':{str(k):v for k,v in base.items()},'v154_risky':{str(k):v for k,v in cand.items()},'new_candidate_risky':{str(k):v for k,v in new.items()}}
          Path('results/static_audit.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          '@
          $code | python -
      - name: Kaggle loader and malformed observation parity smoke
        run: |
          $code=@'
          import json
          from pathlib import Path
          from scripts.preflight import load_like_kaggle,call_like_kaggle,BROKEN_OBSERVATIONS
          out={}
          for name in ('v147','v154'):
              agent=load_like_kaggle(Path('tmp')/f'{name}.py'); assert getattr(agent,'__name__',None)=='agent'
              rows=[]
              for obs in BROKEN_OBSERVATIONS:
                  try:
                      a=call_like_kaggle(agent,obs,None); ok=isinstance(a,dict) and set(a)=={'farmer','hands','market'} and all(isinstance(a[k],list) for k in a); rows.append({'ok':ok,'error':None})
                  except Exception as exc: rows.append({'ok':False,'error':f'{type(exc).__name__}: {exc}'})
              out[name]={'callable':getattr(agent,'__name__',str(agent)),'broken_observations':rows}; assert all(r['ok'] for r in rows[:-1]),out[name]
          assert out['v147']['broken_observations'][-1]==out['v154']['broken_observations'][-1],out
          Path('results/loader_smoke.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps(out,indent=2))
          '@
          $code | python -
      - name: Engine smoke exact v154 both seats
        run: |
          $code=@'
          import json
          from pathlib import Path
          from kaggle_environments import make
          from scripts.preflight import load_like_kaggle,call_like_kaggle
          rows=[]
          for swap in (False,True):
              agent=load_like_kaggle(Path('tmp/v154.py')); errors=[]
              def wrapped(obs,config=None):
                  try:return call_like_kaggle(agent,obs,config)
                  except Exception as exc:
                      errors.append(f'{type(exc).__name__}: {exc}'); return {'farmer':['PASS'],'hands':[],'market':[]}
              env=make('kaggriculture',configuration={'seed':641})
              env.run(['starter',wrapped] if swap else [wrapped,'starter'])
              seat=1 if swap else 0; status=env.state[seat].get('status'); reward=env.state[seat].get('reward')
              rows.append({'seed':641,'swap':swap,'seat':seat,'status':status,'reward':reward,'errors':errors}); assert not errors,(swap,errors); assert status=='DONE',(swap,status)
          Path('results/engine_smoke.json').write_text(json.dumps(rows,indent=2),encoding='utf-8'); print(json.dumps(rows,indent=2))
          '@
          $code | python -
      - name: Build and verify exact submission package
        run: |
          New-Item -ItemType Directory -Force -Path results\package,results\package_extract | Out-Null
          Copy-Item tmp\v154.py results\package\main.py
          $code=@'
          import hashlib,json,tarfile
          from pathlib import Path
          from scripts.preflight import check_imports,load_like_kaggle
          src=Path('results/package/main.py'); expected='7366261d9eb774777b222e69d3ddfabd170f6622dfb68eafa02697e2c4baa23e'; main_sha=hashlib.sha256(src.read_bytes()).hexdigest(); assert main_sha==expected,(main_sha,expected)
          archive=Path('results/v154_submission.tar.gz')
          with tarfile.open(archive,'w:gz') as t:t.add(src,arcname='main.py')
          assert archive.stat().st_size < 100*1024*1024
          extract=Path('results/package_extract')
          with tarfile.open(archive,'r:gz') as t:
              names=t.getnames(); assert names==['main.py'],names; t.extractall(extract)
          extracted=extract/'main.py'; extracted_sha=hashlib.sha256(extracted.read_bytes()).hexdigest(); assert extracted_sha==expected
          chk=check_imports([extracted]); assert chk.ok,chk.detail; agent=load_like_kaggle(extracted); assert getattr(agent,'__name__',None)=='agent'
          meta={'candidate':'v154_dense_self_exposure_not_ahead','main_sha256':main_sha,'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'archive_bytes':archive.stat().st_size,'members':names,'extracted_main_sha256':extracted_sha,'import_check':chk.line(),'loaded_callable':getattr(agent,'__name__',str(agent))}
          Path('results/package_meta.json').write_text(json.dumps(meta,indent=2),encoding='utf-8'); print(json.dumps(meta,indent=2))
          '@
          $code | python -
          python -m py_compile results\package_extract\main.py
          if ($LASTEXITCODE -ne 0) { throw 'packaged main.py py_compile failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v154-final-submission-preflight
          path: results/
          if-no-files-found: error
          retention-days: 30
