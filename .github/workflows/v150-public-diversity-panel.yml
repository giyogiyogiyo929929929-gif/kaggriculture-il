name: v150 public diversity regression

on:
  push:
    branches: [eval-v147-resume-selfhosted-20260926]
    paths: [".github/workflows/v150-public-diversity-panel.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct exact v115 v147 v150
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"; Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          Push-Location tmp; patch --binary --batch -p3 -i ..\ci\v76.patch; if ($LASTEXITCODE -ne 0) { throw 'patch failed' }; Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v150_skip_noop_second_pass.py tmp\v147.py tmp\v150.py
          python -m py_compile tmp\v115.py tmp\v147.py tmp\v150.py
          @'
          import hashlib
          from pathlib import Path
          exp={'tmp/v115.py':'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2','tmp/v147.py':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923','tmp/v150.py':'0a5bfa1b9fa91dd7ebdee1f45640719b23a7b895cbd85cc1f4f17bddebb6387d'}
          for p,w in exp.items():
              g=hashlib.sha256(Path(p).read_bytes()).hexdigest(); print(p,g); assert g==w,(p,g,w)
          '@ | python -
      - name: Fetch and audit pinned public opponent
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/Seyamalam/Kaggriculture/8b8c421eb10634c756583ce10c75189f50c83a72/main.py' -OutFile 'tmp\seya_v21.py'
          @'
          import ast,hashlib
          from pathlib import Path
          p=Path('tmp/seya_v21.py'); data=p.read_bytes(); blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob=='fb34082a6b38e30f8088bfe8d7bf732e533f6318',blob
          tree=ast.parse(data.decode('utf-8')); imports=set(); dangerous=[]
          for n in ast.walk(tree):
              if isinstance(n,ast.Import): imports.update(a.name.split('.')[0] for a in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module: imports.add(n.module.split('.')[0])
              elif isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id in {'eval','exec','compile','__import__','open'}: dangerous.append(n.func.id)
          assert imports<={'__future__','base64','json','math','zlib'},imports; assert not dangerous,dangerous
          '@ | python -
          python -m py_compile tmp\seya_v21.py
      - name: Public diversity panel 621-624
        run: |
          $ErrorActionPreference='Stop'
          $specs=@(
            @('starter','starter'),
            @('beat_v48','opponents\beat_v48\main.py'),
            @('bl_v20','opponents\bl_v20\main.py'),
            @('bl_v21','opponents\bl_v21\main.py'),
            @('farming_v2','opponents\farming_v2\main.py'),
            @('frontier_prvsiyan','opponents\frontier_prvsiyan\main.py'),
            @('seya_v21','tmp\seya_v21.py')
          )
          foreach($s in $specs){
            python ci\eval_candidate_vs_champion_panel.py --candidate tmp\v150.py --champion tmp\v115.py --opponent $s[1] --seed-start 621 --seed-count 4 --jobs 2 --out ("results\"+$s[0]+".json")
            if($LASTEXITCODE -ne 0){throw "panel failed: $($s[0])"}
          }
      - name: Aggregate and require no regression
        if: always()
        run: |
          @'
          import glob,json,statistics,math
          from pathlib import Path
          panels=[]; vals=[]; cand_exc=0; champ_exc=0; cm=[]; hm=[]
          for p in sorted(glob.glob('results/*.json')):
              if p.endswith('summary.json'): continue
              d=json.loads(Path(p).read_text(encoding='utf-8')); x=[float(r['candidate_minus_champion_money']) for r in d.get('rows',[])]
              vals.extend(x); ce=int(d.get('candidate_exceptions',0)); he=int(d.get('champion_exceptions',0)); cand_exc+=ce; champ_exc+=he
              c=[]; h=[]
              for r in d.get('rows',[]):
                  for s in r.get('seats',[]): c.append(float(s['candidate_margin'])); h.append(float(s['champion_margin']))
              cm+=c; hm+=h
              panels.append({'opponent':Path(p).stem,'pairs':len(x),'wins':sum(v>0 for v in x),'losses':sum(v<0 for v in x),'ties':sum(v==0 for v in x),'mean':statistics.fmean(x) if x else 0.0,'worst':min(x) if x else None,'best':max(x) if x else None,'candidate_exceptions':ce,'champion_exceptions':he})
          out={'candidate':'v150_skip_noop_second_pass','champion':'v115_champion_same_turn_open_squeeze','engine':'kaggle_environments==1.32.7','seeds':[621,622,623,624],'pairs':len(vals),'wins':sum(v>0 for v in vals),'losses':sum(v<0 for v in vals),'ties':sum(v==0 for v in vals),'mean':statistics.fmean(vals) if vals else None,'worst':min(vals) if vals else None,'best':max(vals) if vals else None,'candidate_exceptions':cand_exc,'champion_exceptions':champ_exc,'candidate_absolute_games':len(cm),'candidate_absolute_wins':sum(v>0 for v in cm),'candidate_absolute_losses':sum(v<0 for v in cm),'panels':panels}
          out['regression_free']=(out['losses']==0 and cand_exc==0 and champ_exc==0)
          Path('results/v150_public_diversity_summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps(out,indent=2))
          assert out['regression_free'],out
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v150-public-diversity-panel
          path: results/
          if-no-files-found: error
          retention-days: 30
