name: v94 lineage - v95 40-pair exact

on:
  push:
    branches: ["exp/v94-lineage-actions"]
    paths:
      - ".github/workflows/v94-lineage-v95-40pair.yml"
      - "ci_assets/v94_submission.part*.b64"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2h:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle-environments==1.32.7"
          python - <<'PY'
          import kaggle_environments
          assert kaggle_environments.__version__ == "1.32.7", kaggle_environments.__version__
          print("kaggle_environments", kaggle_environments.__version__)
          PY

      - name: Reconstruct v94 and derive v95
        run: |
          mkdir -p .ci_agents/v94 .ci_agents/v95 results
          cat ci_assets/v94_submission.part*.b64 | tr -d '\n' | base64 -d > /tmp/v94_submission.tar.gz
          tar -xzf /tmp/v94_submission.tar.gz -C .ci_agents/v94
          cp .ci_agents/v94/main.py .ci_agents/v95/main.py
          python - <<'PY'
          from pathlib import Path
          p = Path('.ci_agents/v95/main.py')
          s = p.read_text(encoding='utf-8')
          reps = [
              ('min(14 if _adaptive_h14_allowed(obs) else 13, previous + 1)', 'min(15 if _adaptive_h14_allowed(obs) else 13, previous + 1)'),
              ('min(14 if _adaptive_h14_allowed(obs) else 13, max(6, int(lead.get("ceiling", 7) or 7)))', 'min(15 if _adaptive_h14_allowed(obs) else 13, max(6, int(lead.get("ceiling", 7) or 7)))'),
              ('if horizon == 14 and item == "MILK":', 'if horizon >= 14 and item == "MILK":'),
              ('agent.__version__ = "v94-adaptive-h14-yarn2-nomilk"', 'agent.__version__ = "v95-adaptive-h15-yarn2-nomilk"'),
          ]
          for old, new in reps:
              assert old in s, old
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          echo "v94 $(sha256sum .ci_agents/v94/main.py)"
          echo "v95 $(sha256sum .ci_agents/v95/main.py)"
          test "$(sha256sum .ci_agents/v94/main.py | cut -d' ' -f1)" = "869b7e9fe727694ca52710716921856fea6511ccae71b0613be26f4e9236baa3"
          test "$(sha256sum .ci_agents/v95/main.py | cut -d' ' -f1)" = "ba21fe1dcf78113bb5c2531d015f318dbc0af290c608ea5925578b2485ee62cd"

      - name: Run exact paired shard
        id: run
        continue-on-error: true
        run: |
          python scripts/ci/run_exact_pair.py \
            --candidate .ci_agents/v95/main.py \
            --baseline .ci_agents/v94/main.py \
            --seed-start 240001 \
            --seed-count 40 \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --out "results/shard-${{ matrix.shard }}.json"

      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v95-v94-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: error
          retention-days: 14

      - name: Propagate shard failure
        if: steps.run.outcome == 'failure'
        run: exit 1

  aggregate:
    name: aggregate
    if: always()
    needs: h2h
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: v95-v94-shard-*
          path: artifacts

      - name: Aggregate candidate_minus_champion
        run: |
          python scripts/ci/aggregate_h2h.py \
            --input-dir artifacts \
            --candidate .ci_agents/v95/main.py \
            --baseline .ci_agents/v94/main.py \
            --seed-start 240001 \
            --seed-count 40 \
            --json-out v95_vs_v94_240001_40.json \
            --md-out v95_vs_v94_240001_40.md
          cat v95_vs_v94_240001_40.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          s=json.load(open('v95_vs_v94_240001_40.json', encoding='utf-8'))
          print(json.dumps(s, indent=2))
          assert s['pairs_completed'] == 40, s
          assert s['failed_pairs'] == 0, s
          assert s['candidate_exceptions'] == 0, s
          PY

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v95-v94-240001-40-summary
          path: |
            v95_vs_v94_240001_40.json
            v95_vs_v94_240001_40.md
          retention-days: 30
