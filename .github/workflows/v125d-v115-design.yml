name: v125d one-unit-only ADV vs exact v115 design

on:
  push:
    branches:
      - eval-v125c-adv-split1-20260925
    paths:
      - ".github/workflows/v125d-v115-design.yml"
      - "ci/build_v125d_from_v115.py"

permissions:
  contents: read

jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Reconstruct exact agents
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v125d_from_v115.py tmp/v115.py tmp/v125d.py
          python -m py_compile tmp/v115.py tmp/v125d.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tmp/v115.py').read_text(); c=Path('tmp/v125d.py').read_text()
          assert "[['BUY_PRODUCT','WHEAT',_OPEN_ATTACK],['SELL','WHEAT',_OPEN_ATTACK]]" in p
          assert '_ADV_BOOK=False' in c
          assert 'take=min(q,avail,max(0,1-added-n))' in c
          print('source_invariants=PASS')
          PY
      - name: Same design H2H seeds 41001-41012 both seats
        run: |
          python - <<'PY'
          import json
          from scripts.eval import evaluate
          s=evaluate('tmp/v125d.py','tmp/v115.py',pairs=12,jobs=4,seed_start=41001)
          by={}
          for g in s['matches_detail']:
            by.setdefault(g['seed'],[]).append(g['money'][0]-g['money'][1])
          pd={str(k):sum(v)/len(v) for k,v in sorted(by.items())}
          vals=list(pd.values())
          out={
            'metric':'candidate_minus_champion = candidate - champion direct pair margin',
            'phase':'design-isolation','seeds':[41001,41012],'pairs':12,
            'wins':sum(x>0 for x in vals),'losses':sum(x<0 for x in vals),'ties':sum(x==0 for x in vals),
            'candidate_minus_champion_mean':sum(vals)/len(vals),
            'candidate_minus_champion_se':s['pair_diff_stderr'],
            'mean_ge_2se':bool(s['pair_diff_mean']>0 and s['pair_diff_mean']>=2*s['pair_diff_stderr']),
            'worst':min(vals),'best':max(vals),'pair_diffs':pd,
            'candidate_exceptions':s['exceptions']['a'],'champion_exceptions':s['exceptions']['b'],
            'matches_detail':s['matches_detail']}
          open('results/v125d_design.json','w').write(json.dumps(out,indent=2))
          print('V125D='+json.dumps({k:v for k,v in out.items() if k!='matches_detail'},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v125d-v115-design
          path: results/
          if-no-files-found: warn
          retention-days: 30
