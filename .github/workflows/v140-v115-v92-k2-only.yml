name: Exact v115 isolated V92 K2

on:
  push:
    branches: [gpt-v115-sell1-official]
    paths: ['.github/workflows/v140-v115-v92-k2-only.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {id: 0, seed_start: 430001}
          - {id: 1, seed_start: 430007}
          - {id: 2, seed_start: 430013}
          - {id: 3, seed_start: 430019}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
          python - <<'PY'
          import kaggle_environments
          assert kaggle_environments.__version__ == '1.32.7'
          PY
      - name: Reconstruct exact v115 and isolated v140
        run: |
          set -euo pipefail
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v140_v92_k2_only.py tmp/v115.py tmp/v140.py | tee results/build-${{ matrix.id }}.txt
          python -m py_compile tmp/v115.py tmp/v140.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('tmp/v115.py').read_bytes()).hexdigest()=='c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2'
          s=Path('tmp/v140.py').read_text()
          assert '_V92_P_K = 2' in s
          assert 'for off in (3, 4, 5, 6, 7)) >= 1' in s
          PY
      - name: Fresh matched both-seat H2H
        run: |
          python ci/eval_v115_sell1.py --candidate tmp/v140.py --champion tmp/v115.py --seed-start ${{ matrix.seed_start }} --seed-count 6 --out results/shard-${{ matrix.id }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-v115-v140-v92k2-shard-${{ matrix.id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

  burned-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Build and trace burned worlds
        run: |
          set -euo pipefail
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v140_v92_k2_only.py tmp/v115.py tmp/v140.py
          python ci/trace_v139_first_divergence.py --v115 tmp/v115.py --v139 tmp/v140.py --seeds 621 628 631 --out results/v140_burned_sanity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v140-burned-sanity
          path: results/
          retention-days: 30
