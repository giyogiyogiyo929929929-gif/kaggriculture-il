name: uploaded 127ed3 feed0 d25 carrot hold v1 burned dev

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/workflows/uploaded-127ed3-ca-feed0-d25-carrot-hold-v1-dev.yml'
      - 'ci/build_uploaded_127ed3_ca_feed0_d25_carrot_hold_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact champion and candidate
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          python ci\build_uploaded_127ed3_safety_v3.py tmp\safe_v3.py
          python ci\build_uploaded_127ed3_ca_feed0.py tmp\safe_v3.py tmp\feed0.py
          python ci\build_uploaded_127ed3_ca_feed0_d25_carrot_hold_v1.py tmp\feed0.py tmp\candidate.py
          @'
          import hashlib,importlib.metadata,json
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in ['tmp/safe_v3.py','tmp/feed0.py','tmp/candidate.py']}
          assert hashes['tmp/safe_v3.py']=='87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df'
          assert hashes['tmp/feed0.py']=='cc300eda64d0fe1f884bd164f973de2177eb68c1808cafed06bfeadc5b446e44'
          assert hashes['tmp/candidate.py']=='2aab62a693bd3a357ad87649b8ba90a79b512d383a7694b07bbcdbe0deef48c8'
          assert importlib.metadata.version('kaggle-environments')=='1.32.7'
          source_sha=hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()
          assert source_sha=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          Path('results/build.json').write_text(json.dumps({'hashes':hashes,'engine':'1.32.7','source_sha256':source_sha},indent=2),encoding='utf-8')
          '@ | python -
          python -m py_compile tmp\feed0.py tmp\candidate.py
      - name: Burned ten-seed direct champion matched evaluation
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,math,statistics
          from pathlib import Path
          from kaggle_environments import make
          from scripts.preflight import load_like_kaggle,call_like_kaggle

          candidate=Path('tmp/candidate.py')
          champion=Path('tmp/feed0.py')
          seeds=[641,350003,101,211,347,509,733,911,1201,1601]
          focal={641,350003,733,911}

          def play(seed,seat):
              ca=load_like_kaggle(candidate); ch=load_like_kaggle(champion)
              exc=[0,0]
              def wrap(agent,idx):
                  def f(obs,cfg=None):
                      try:return call_like_kaggle(agent,obs,cfg)
                      except Exception:
                          exc[idx]+=1
                          return {'farmer':['PASS'],'hands':[],'market':[]}
                  return f
              cwrap=wrap(ca,0); hwrap=wrap(ch,1)
              agents=[cwrap,hwrap] if seat==0 else [hwrap,cwrap]
              env=make('kaggriculture',configuration={'seed':seed}); env.run(agents)
              statuses=[s.get('status') for s in env.state]
              assert statuses==['DONE','DONE'], statuses
              assert len(env.steps)==720, len(env.steps)
              rewards=[float(s.get('reward',0)) for s in env.state]
              return {'seat':seat,'candidate':rewards[seat],'champion':rewards[1-seat],
                      'delta':rewards[seat]-rewards[1-seat],'exceptions':exc,'statuses':statuses,'steps':len(env.steps)}

          rows=[]
          for seed in seeds:
              games=[play(seed,seat) for seat in (0,1)]
              assert sum(sum(g['exceptions']) for g in games)==0
              d=statistics.mean(g['delta'] for g in games)
              rows.append({'seed':seed,'seat_deltas':[g['delta'] for g in games],
                           'candidate_money':[g['candidate'] for g in games],
                           'champion_money':[g['champion'] for g in games],
                           'candidate_minus_champion':d,
                           'outcome':'W' if d>0 else 'L' if d<0 else 'D'})
          vals=[r['candidate_minus_champion'] for r in rows]
          se=statistics.stdev(vals)/math.sqrt(len(vals)) if len(vals)>1 else 0.0
          summary={'wins':sum(v>0 for v in vals),'losses':sum(v<0 for v in vals),'draws':sum(v==0 for v in vals),
                   'mean':statistics.mean(vals),'median':statistics.median(vals),'se':se,
                   'mean_minus_2se':statistics.mean(vals)-2*se,'worst':min(vals),'best':max(vals),
                   'seat0_mean':statistics.mean(r['seat_deltas'][0] for r in rows),
                   'seat1_mean':statistics.mean(r['seat_deltas'][1] for r in rows)}
          focal_rows=[r for r in rows if r['seed'] in focal]
          fvals=[r['candidate_minus_champion'] for r in focal_rows]
          fse=statistics.stdev(fvals)/math.sqrt(len(fvals)) if len(fvals)>1 else 0.0
          focal_summary={'wins':sum(v>0 for v in fvals),'losses':sum(v<0 for v in fvals),'draws':sum(v==0 for v in fvals),
                         'mean':statistics.mean(fvals),'median':statistics.median(fvals),'se':fse,
                         'mean_minus_2se':statistics.mean(fvals)-2*fse,'worst':min(fvals),'best':max(fvals)}
          out={'candidate':'uploaded_127ed3_ca_feed0_d25_carrot_hold_v1',
               'candidate_sha256':'2aab62a693bd3a357ad87649b8ba90a79b512d383a7694b07bbcdbe0deef48c8',
               'champion':'uploaded_127ed3_ca_feed0',
               'champion_sha256':'cc300eda64d0fe1f884bd164f973de2177eb68c1808cafed06bfeadc5b446e44',
               'seeds':seeds,'summary':summary,'focal_summary':focal_summary,'rows':rows}
          Path('results/d25_carrot_hold_v1_dev.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-ca-feed0-d25-carrot-hold-v1-dev
          path: results/
          if-no-files-found: error
          retention-days: 30
