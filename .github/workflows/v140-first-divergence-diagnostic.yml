name: V140 isolated first-divergence diagnostic
on:
  push:
    branches: [gpt-v115-sell1-official]
    paths: ['.github/workflows/v140-first-divergence-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Build exact v115 and clean v140
        run: |
          set -euo pipefail
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v140_v92_k2_isolated.py tmp/v115.py tmp/v140.py
          python -m py_compile tmp/v115.py tmp/v140.py
      - name: Trace first divergence on loss and win worlds
        run: |
          python ci/trace_v139_first_divergence.py --v115 tmp/v115.py --v139 tmp/v140.py --seeds 641 642 651 652 --out results/v140_first_divergence.json
      - name: Print compact state comparison
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results/v140_first_divergence.json'))
          for r in d:
              x=r.get('first_divergence') or {}
              o=x.get('obs') or {}
              print('SEED',r['seed'])
              print(' STEP',o.get('step'),'MONEY',o.get('money'),'RIVAL',o.get('rival_money'))
              print(' BASE',x.get('v115_action',{}).get('market'))
              print(' CAND',x.get('v139_action',{}).get('market'))
              print(' SHED',o.get('shed'))
              print(' PRICES',o.get('market_prices'))
              print(' INVENTORY',o.get('market_inventory'))
              print(' SHOPS',o.get('shops'))
              print(' TEL_BASE',x.get('v115_tel'))
              print(' TEL_CAND',x.get('v139_tel'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v140-first-divergence-diagnostic
          path: results/v140_first_divergence.json
          if-no-files-found: warn
          retention-days: 30
