name: v143 fresh seat telemetry

on:
  push:
    branches: [eval-v115-v142-exposure-20260925]
    paths:
      - ".github/workflows/v143-fresh-seat-telemetry.yml"
      - "ci/diagnose_v143_fresh_seat_dependence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact engine
        run: |
          $ErrorActionPreference = 'Stop'
          $gitUsr = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path = "$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
      - name: Reconstruct exact v115 and v143
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize = @'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name)
              p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append = @'
          from pathlib import Path
          p=Path('tmp/main.py')
          p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          if ($LASTEXITCODE -ne 0) { throw 'exact v115 reconstruction failed' }
          python ci\build_v143_v92_single_weak_vote.py tmp\v115.py tmp\v143.py
          if ($LASTEXITCODE -ne 0) { throw 'v143 build failed' }
          python -m py_compile tmp\v115.py tmp\v143.py ci\diagnose_v143_fresh_seat_dependence.py
          $check = @'
          import hashlib
          from pathlib import Path
          p=Path('tmp/v115.py')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          print('v115_sha256',got)
          assert got == 'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2'
          '@
          $check | python -
      - name: Burned fresh-seat telemetry 663 669 and control 651
        run: |
          python ci\diagnose_v143_fresh_seat_dependence.py --v115 tmp\v115.py --v143 tmp\v143.py --out results\v143_fresh_seat_telemetry.json
          if ($LASTEXITCODE -ne 0) { throw 'telemetry failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v143-fresh-seat-telemetry
          path: results/
          if-no-files-found: error
          retention-days: 30
