name: v154 v151 sealed 894322-894333

on:
  pull_request:
    branches: [eval-v154-v151-dense-self-exposure-port-20260927]
    paths: [".ci/triggers/v154-sealed-894322", ".github/workflows/v154-v151-sealed-894322-894333.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sealed:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct exact v151 and v154
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path="$gitUsr;$env:Path"; Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v150_skip_noop_second_pass.py tmp\v147.py tmp\v150.py
          python ci\build_v151_none_observation_guard.py tmp\v150.py tmp\v151.py
          python ci\build_v154_v151_dense_self_exposure.py tmp\v151.py tmp\v154.py
          python -m py_compile tmp\v151.py tmp\v154.py
          @'
          import hashlib
          from pathlib import Path
          exp={
            'tmp/v151.py':'54edf1f1663b161457c6d31daccb68b496e5a61dffb6f140f69af2e0b380bf31',
            'tmp/v154.py':'9643521253a9c3bb41e27d103353f76ac7e805d91cb838559b8227bc93bff593',
          }
          for p,w in exp.items():
              g=hashlib.sha256(Path(p).read_bytes()).hexdigest(); print(p,g); assert g==w,(p,g,w)
          '@ | python -

      - name: First sealed matched evaluation 894322 to 894333
        run: |
          $ErrorActionPreference='Stop'
          python scripts\eval.py tmp\v154.py tmp\v151.py -n 12 -j 4 --seed-start 894322 --json results\sealed_894322_894333.json
          if ($LASTEXITCODE -ne 0) { throw 'sealed evaluation failed' }

      - name: Aggregate preregistered sealed result
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,statistics
          from pathlib import Path
          d=json.loads(Path('results/sealed_894322_894333.json').read_text(encoding='utf-8'))
          by={}
          for g in d.get('matches_detail',[]):
              by.setdefault(int(g['seed']),[]).append(float(g['money'][0])-float(g['money'][1]))
          rows=[]
          for seed,legs in sorted(by.items()):
              rows.append({'seed':seed,'candidate_minus_champion':statistics.fmean(legs),'seat_diffs':legs})
          vals=[x['candidate_minus_champion'] for x in rows]
          se=statistics.stdev(vals)/(len(vals)**0.5) if len(vals)>1 else 0.0
          mean=statistics.fmean(vals)
          exc=d.get('exceptions',{})
          out={
            'candidate':'v154','candidate_sha256':'9643521253a9c3bb41e27d103353f76ac7e805d91cb838559b8227bc93bff593',
            'champion':'v151','champion_sha256':'54edf1f1663b161457c6d31daccb68b496e5a61dffb6f140f69af2e0b380bf31',
            'engine':'kaggle_environments==1.32.7',
            'metric':'candidate_minus_champion = candidate - champion',
            'seed_selection':'start = 700000 + int(candidate_sha256[:8],16) % 200000',
            'seeds':list(range(894322,894334)),
            'pairs':len(vals),
            'wins':sum(v>0 for v in vals),'losses':sum(v<0 for v in vals),'ties':sum(v==0 for v in vals),
            'mean':mean,'se':se,'mean_minus_2se':mean-2*se,
            'worst':min(vals),'best':max(vals),
            'candidate_exceptions':int(exc.get('a',0)),'champion_exceptions':int(exc.get('b',0)),
            'rows':rows,
          }
          out['qualification_pass']=(len(vals)==12 and out['candidate_exceptions']==0 and out['champion_exceptions']==0 and out['losses']==0 and out['wins']>0 and out['worst']>=0 and out['mean_minus_2se']>0)
          Path('results/v154_sealed_summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          assert len(vals)==12,out
          assert out['candidate_exceptions']==0 and out['champion_exceptions']==0,out
          assert out['losses']==0 and out['worst']>=0,out
          assert out['wins']>0,out
          assert out['mean_minus_2se']>0,out
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v154-v151-sealed-894322-894333
          path: results/
          if-no-files-found: error
          retention-days: 30
