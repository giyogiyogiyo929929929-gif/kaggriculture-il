name: v154 v151 runtime stress

on:
  pull_request:
    branches: [eval-v154-v151-dense-self-exposure-port-20260927]
    paths: [".ci/triggers/v154-runtime", ".github/workflows/v154-v151-runtime-stress.yml", "ci/build_v154_v151_dense_self_exposure.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct exact v151 and build v154
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path="$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v150_skip_noop_second_pass.py tmp\v147.py tmp\v150.py
          python ci\build_v151_none_observation_guard.py tmp\v150.py tmp\v151.py
          python ci\build_v154_v151_dense_self_exposure.py tmp\v151.py tmp\v154.py
          python -m py_compile tmp\v151.py tmp\v154.py
          @'
          import hashlib
          from pathlib import Path
          expected='54edf1f1663b161457c6d31daccb68b496e5a61dffb6f140f69af2e0b380bf31'
          got=hashlib.sha256(Path('tmp/v151.py').read_bytes()).hexdigest()
          assert got==expected,(got,expected)
          print('v151_sha256='+got)
          print('v154_sha256='+hashlib.sha256(Path('tmp/v154.py').read_bytes()).hexdigest())
          '@ | python -

      - name: Sequential GC-enabled runtime on consumed hard seeds
        run: |
          $ErrorActionPreference='Stop'
          @'
          import gc,json,statistics,sys,time
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts/analysis').resolve()))
          import _common as C

          seeds=[520101,520102,520103,520104]
          opponent='opponents/score_2820/main.py'

          def bench(path):
              gc.enable()
              mine=C.load(path)
              inner=C.wrap(mine)
              wall=[]; cpu=[]; errors=[]
              def timed(o,c=None):
                  w0=time.perf_counter(); c0=time.process_time()
                  try:
                      return inner(o,c)
                  except Exception as e:
                      errors.append(repr(e)); raise
                  finally:
                      cpu.append(time.process_time()-c0)
                      wall.append(time.perf_counter()-w0)
              for seed in seeds:
                  C.play(timed,opponent,seed,swap=False)
                  C.play(timed,opponent,seed,swap=True)
              def stats(xs):
                  ys=sorted(xs); n=len(ys)
                  def pct(p): return ys[min(n-1,int(n*p))]*1000.0
                  return {'calls':n,'median_ms':statistics.median(ys)*1000.0,'p95_ms':pct(.95),'p99_ms':pct(.99),'max_ms':ys[-1]*1000.0,'gt_200ms':sum(x>.2 for x in ys)}
              return {'wall':stats(wall),'cpu':stats(cpu),'errors':len(errors),'error_samples':errors[:3]}

          champ=bench('tmp/v151.py')
          cand=bench('tmp/v154.py')
          out={'engine':'kaggle_environments==1.32.7','gc_enabled':gc.isenabled(),'mode':'sequential_single_process','opponent':'score_2820','seeds':seeds,'seat_swap':True,'champion':'v151','candidate':'v154','champion_timing':champ,'candidate_timing':cand,'formal_thresholds':{'p99_ms_lt':50.0,'max_ms_lt':200.0}}
          Path('results/v154_runtime_stress.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          assert champ['errors']==0 and cand['errors']==0,out
          assert cand['wall']['p99_ms'] < 50.0,out
          assert cand['wall']['max_ms'] < 200.0,out
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v154-v151-runtime-stress
          path: results/
          if-no-files-found: error
          retention-days: 30
