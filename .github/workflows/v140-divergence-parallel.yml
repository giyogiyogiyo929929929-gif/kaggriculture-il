name: V140 isolated divergence parallel
on:
  push:
    branches: [gpt-v115-sell1-official]
    paths: ['.github/workflows/v140-divergence-parallel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [641, 642, 651, 652]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Build exact v115 and clean v140
        run: |
          set -euo pipefail
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v140_v92_k2_isolated.py tmp/v115.py tmp/v140.py
      - name: Trace seed
        run: |
          python ci/trace_v139_first_divergence.py --v115 tmp/v115.py --v139 tmp/v140.py --seeds ${{ matrix.seed }} --out results/seed-${{ matrix.seed }}.json
          python - <<'PY'
          import json,glob
          r=json.load(open(glob.glob('results/*.json')[0]))[0]
          x=r.get('first_divergence') or {}; o=x.get('obs') or {}
          print(json.dumps({'seed':r['seed'],'step':o.get('step'),'money':o.get('money'),'rival_money':o.get('rival_money'),'base_market':(x.get('v115_action') or {}).get('market'),'candidate_market':(x.get('v139_action') or {}).get('market'),'shed':o.get('shed'),'prices':o.get('market_prices'),'market_inventory':o.get('market_inventory'),'shops':o.get('shops'),'base_tel':x.get('v115_tel'),'candidate_tel':x.get('v139_tel')},indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v140-divergence-${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
