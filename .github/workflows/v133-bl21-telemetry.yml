name: v133 bl21 exact telemetry
on:
  push:
    branches: [eval-v130-v121-exact-20260925]
    paths: ['.github/workflows/v133-bl21-telemetry.yml']
  workflow_dispatch:
jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'kaggle-environments==1.32.7'
      - name: Rebuild verified agents
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          python scripts/ci/rebuild_v130_v121_agents.py --out-dir eval_agents/v130
          python scripts/ci/rebuild_v133_from_v130.py
      - name: Instrument v133 and v121
        run: |
          python - <<'PY'
          from pathlib import Path
          wrapper=r'''
          import os as _TELEM_OS, json as _TELEM_JSON
          _TELEM_PARENT=agent
          _TELEM_LABEL='__LABEL__'
          def agent(observation,configuration=None):
              action=_TELEM_PARENT(observation,configuration)
              try:
                  step=int(observation.get('step',0)); player=int(observation.get('player',0))
                  if step>=570:
                      farms=observation.get('farms',[]); me=farms[player]; rival=farms[1-player]
                      row={'label':_TELEM_LABEL,'step':step,'player':player,'own_money':me.get('money'),'rival_money':rival.get('money'),'prices':(observation.get('market',{}) or {}).get('prices',{}),'town':observation.get('town',{}),'action_market':action.get('market',[]) if isinstance(action,dict) else None,'telemetry':dict(getattr(_TELEM_PARENT,'telemetry',{}) or {})}
                      with open('/tmp/'+_TELEM_LABEL+'.jsonl','a',encoding='utf-8') as f:f.write(_TELEM_JSON.dumps(row,default=str)+'\\n')
              except Exception: pass
              return action
          agent.telemetry=getattr(_TELEM_PARENT,'telemetry',{})
          '''
          for path,label in [('eval_agents/v130/v133_candidate_center_only.py','v133'),('eval_agents/v130/v121_champion_same_turn_unwind.py','v121')]:
              p=Path(path); p.write_text(p.read_text(encoding='utf-8')+wrapper.replace('__LABEL__',label),encoding='utf-8')
          PY
      - name: Run exact seed 382002
        run: |
          python scripts/ci/run_exact_pair.py --candidate eval_agents/v130/v133_candidate_center_only.py --baseline opponents/bl_v21 --seeds 382002 --output /tmp/v133_pair.json
          python scripts/ci/run_exact_pair.py --candidate eval_agents/v130/v121_champion_same_turn_unwind.py --baseline opponents/bl_v21 --seeds 382002 --output /tmp/v121_pair.json
          mkdir -p out
          cp /tmp/v133_pair.json /tmp/v121_pair.json /tmp/v133.jsonl /tmp/v121.jsonl out/
      - name: Compare first divergence
        run: |
          python - <<'PY'
          import json
          def load(p):
              rows=[json.loads(x) for x in open(p) if x.strip()]; return {(r['player'],r['step']):r for r in rows}
          a=load('out/v133.jsonl'); b=load('out/v121.jsonl'); out={}
          for player in (0,1):
              ds=[]
              for step in range(570,720):
                  x=a.get((player,step)); y=b.get((player,step))
                  if x and y and x.get('action_market')!=y.get('action_market'):
                      ds.append({'step':step,'v133':x,'v121':y})
              out[str(player)]={'count':len(ds),'first':ds[0] if ds else None,'divergences':ds[:20]}
          json.dump(out,open('out/telemetry_summary.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v133-bl21-382002-telemetry
          path: out/
          if-no-files-found: warn
