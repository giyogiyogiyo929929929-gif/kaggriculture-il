name: v153 v147 burned direct 681 692

on:
  push:
    branches: [eval-v150-v147-singleton-hardcell-20260926]
    paths: [".github/workflows/v153-v147-burned-direct-681-692.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct exact v147 and build v153
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize=@'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append=@'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v153_v147_dense_self_exposure_guard.py tmp\v147.py tmp\v153.py
          python -m py_compile tmp\v147.py tmp\v153.py
          $check=@'
          import hashlib
          from pathlib import Path
          got=hashlib.sha256(Path('tmp/v147.py').read_bytes()).hexdigest()
          assert got=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923',got
          print('v147_sha256='+got)
          print('v153_sha256='+hashlib.sha256(Path('tmp/v153.py').read_bytes()).hexdigest())
          '@
          $check | python -
      - name: Direct matched seeds 681 through 692 both seats
        run: |
          python scripts\eval.py tmp\v153.py tmp\v147.py -n 12 -j 1 --seed-start 681 --json results\v153_vs_v147_direct_681_692.json
          if ($LASTEXITCODE -ne 0) { throw 'direct eval failed' }
      - name: Summarize candidate-minus-champion and guardrails
        run: |
          $code=@'
          import json, statistics
          from pathlib import Path
          p=Path('results/v153_vs_v147_direct_681_692.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          by={}
          for g in d['matches_detail']:
              by.setdefault(int(g['seed']),[]).append(g)
          rows=[]
          for seed in sorted(by):
              gs=sorted(by[seed],key=lambda x:x['swap'])
              diffs=[float(g['money'][0])-float(g['money'][1]) for g in gs]
              rows.append({'seed':seed,'seat0':diffs[0],'seat1':diffs[1],'pair':statistics.mean(diffs)})
          vals=[r['pair'] for r in rows]
          out={
            'rows':rows,
            'wins':sum(v>0 for v in vals),'losses':sum(v<0 for v in vals),'ties':sum(v==0 for v in vals),
            'mean':statistics.mean(vals),'worst':min(vals),'best':max(vals),
            'seat0_mean':statistics.mean(r['seat0'] for r in rows),
            'seat1_mean':statistics.mean(r['seat1'] for r in rows),
            'candidate_exceptions':d['exceptions']['a'],'champion_exceptions':d['exceptions']['b'],
            'candidate_timing':d['timings']['a'],'champion_timing':d['timings']['b']
          }
          if len(vals)>1:
              out['se']=statistics.stdev(vals)/(len(vals)**0.5)
              out['mean_minus_2se']=out['mean']-2*out['se']
          Path('results/v153_direct_summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          assert int(out['candidate_exceptions'])==0,out
          '@
          $code | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v153-v147-burned-direct-681-692
          path: results/
          if-no-files-found: error
          retention-days: 30
