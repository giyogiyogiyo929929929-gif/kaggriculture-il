name: uploaded 127ed3 feed0 d25 carrot hold v1 stress

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/d25-carrot-hold-v1-stress.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact champion and candidate
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          python ci\build_uploaded_127ed3_safety_v3.py tmp\safe_v3.py
          python ci\build_uploaded_127ed3_ca_feed0.py tmp\safe_v3.py tmp\feed0.py
          python ci\build_uploaded_127ed3_ca_feed0_d25_carrot_hold_v1.py tmp\feed0.py tmp\candidate.py
          @'
          import hashlib,importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          assert hashlib.sha256(Path('tmp/feed0.py').read_bytes()).hexdigest()=='cc300eda64d0fe1f884bd164f973de2177eb68c1808cafed06bfeadc5b446e44'
          assert hashlib.sha256(Path('tmp/candidate.py').read_bytes()).hexdigest()=='2aab62a693bd3a357ad87649b8ba90a79b512d383a7694b07bbcdbe0deef48c8'
          assert importlib.metadata.version('kaggle-environments')=='1.32.7'
          assert hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          '@ | python -
          python -m py_compile tmp\feed0.py tmp\candidate.py
      - name: Burned stress 621 through 632 both seats
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,math,statistics
          from pathlib import Path
          from kaggle_environments import make
          from scripts.preflight import load_like_kaggle,call_like_kaggle
          candidate=Path('tmp/candidate.py'); champion=Path('tmp/feed0.py'); seeds=list(range(621,633))
          def play(seed,seat):
              ca=load_like_kaggle(candidate); ch=load_like_kaggle(champion); exc=[0,0]
              def wrap(agent,idx):
                  def f(obs,cfg=None):
                      try:return call_like_kaggle(agent,obs,cfg)
                      except Exception:
                          exc[idx]+=1
                          return {'farmer':['PASS'],'hands':[],'market':[]}
                  return f
              cw=wrap(ca,0); hw=wrap(ch,1); agents=[cw,hw] if seat==0 else [hw,cw]
              env=make('kaggriculture',configuration={'seed':seed}); env.run(agents)
              statuses=[s.get('status') for s in env.state]
              assert statuses==['DONE','DONE'] and len(env.steps)==720
              rewards=[float(s.get('reward',0)) for s in env.state]
              assert sum(exc)==0
              return rewards[seat]-rewards[1-seat]
          rows=[]
          for seed in seeds:
              ds=[play(seed,s) for s in (0,1)]; d=statistics.mean(ds)
              rows.append({'seed':seed,'seat_deltas':ds,'candidate_minus_champion':d,'outcome':'W' if d>0 else 'L' if d<0 else 'D'})
          vals=[r['candidate_minus_champion'] for r in rows]; se=statistics.stdev(vals)/math.sqrt(len(vals)) if len(vals)>1 else 0.0
          out={'candidate_sha256':'2aab62a693bd3a357ad87649b8ba90a79b512d383a7694b07bbcdbe0deef48c8','champion_sha256':'cc300eda64d0fe1f884bd164f973de2177eb68c1808cafed06bfeadc5b446e44','seeds':seeds,
               'summary':{'wins':sum(v>0 for v in vals),'losses':sum(v<0 for v in vals),'draws':sum(v==0 for v in vals),'mean':statistics.mean(vals),'median':statistics.median(vals),'se':se,'mean_minus_2se':statistics.mean(vals)-2*se,'worst':min(vals),'best':max(vals),'seat0_mean':statistics.mean(r['seat_deltas'][0] for r in rows),'seat1_mean':statistics.mean(r['seat_deltas'][1] for r in rows)},'rows':rows}
          Path('results/d25_carrot_hold_v1_stress.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps(out,indent=2))
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-ca-feed0-d25-carrot-hold-v1-stress
          path: results/
          if-no-files-found: error
          retention-days: 30
