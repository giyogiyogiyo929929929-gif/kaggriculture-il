name: v94-lineage v95 fresh 40 pairs

on:
  push:
    branches: ["exp/v94-lineage-actions"]
    paths:
      - ".github/workflows/v94-lineage-v95-40pairs.yml"
      - "experiments/v94_lineage/**"

permissions:
  contents: read

jobs:
  h2h:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Materialize exact v94/v95 agents
        run: |
          python experiments/v94_lineage/materialize_agents.py
          sha256sum experiments/v94_lineage/generated/v94_champion.py
          sha256sum experiments/v94_lineage/generated/v95_candidate.py

      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle-environments==1.32.7"
          python - <<'PY'
          import kaggle_environments
          assert kaggle_environments.__version__ == "1.32.7", kaggle_environments.__version__
          print("kaggle_environments", kaggle_environments.__version__)
          PY

      - name: Run v95 candidate vs v94 champion
        id: run
        continue-on-error: true
        run: |
          mkdir -p results
          python scripts/ci/run_exact_pair.py \
            --candidate experiments/v94_lineage/generated/v95_candidate.py \
            --baseline experiments/v94_lineage/generated/v94_champion.py \
            --seed-start 240001 \
            --seed-count 40 \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --out "results/shard-${{ matrix.shard }}.json"

      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v95-v94-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: error
          retention-days: 14

      - name: Propagate shard failure
        if: steps.run.outcome == 'failure'
        run: exit 1

  aggregate:
    name: aggregate
    if: always()
    needs: h2h
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: v95-v94-shard-*
          path: artifacts

      - name: Aggregate candidate_minus_champion
        run: |
          python scripts/ci/aggregate_h2h.py \
            --input-dir artifacts \
            --candidate experiments/v94_lineage/generated/v95_candidate.py \
            --baseline experiments/v94_lineage/generated/v94_champion.py \
            --seed-start 240001 \
            --seed-count 40 \
            --json-out v95_vs_v94_summary.json \
            --md-out v95_vs_v94_summary.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("v95_vs_v94_summary.json")
          s = json.loads(p.read_text())
          s["champion"] = "v94_adaptive_h14_yarn2_nomilk"
          s["candidate_name"] = "v95_adaptive_h15_yarn2_nomilk"
          s["metric"] = "candidate_minus_champion"
          s["candidate_minus_champion"] = {
              "mean": s["mean"], "median": s["median"], "stderr": s["stderr"],
              "mean_minus_2se": s["mean_minus_2se"], "min": s["min"], "max": s["max"]
          }
          p.write_text(json.dumps(s, indent=2))
          with open("v95_vs_v94_summary.md", "a") as f:
              f.write("\nCanonical interpretation: `candidate_minus_champion = v95 - v94`.\n")
          assert s["pairs_completed"] == 40, s
          assert s["failed_pairs"] == 0, s
          assert s["candidate_exceptions"] == 0, s
          PY
          cat v95_vs_v94_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v95-v94-summary-240001-40
          path: |
            v95_vs_v94_summary.json
            v95_vs_v94_summary.md
          retention-days: 30
