name: V141 residual seed642 divergence
on:
  push:
    branches: [gpt-v115-sell1-official]
    paths: ['.github/workflows/v141-seed642-divergence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Build exact v115 and v141
        run: |
          set -euo pipefail
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v141_v92_k2_milk_strawberry.py tmp/v115.py tmp/v141.py
      - name: Trace residual divergence
        run: |
          python ci/trace_v139_first_divergence.py --v115 tmp/v115.py --v139 tmp/v141.py --seeds 642 --out results/v141_seed642.json
          cat results/v141_seed642.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v141-seed642-divergence
          path: results/v141_seed642.json
          if-no-files-found: warn
          retention-days: 30
