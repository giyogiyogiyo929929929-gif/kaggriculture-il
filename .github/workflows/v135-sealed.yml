name: V135 Sealed Fresh Seeds

on:
  push:
    branches: [eval-v135-milk-quote-boundary-20260925]
    paths:
      - ".github/workflows/v135-sealed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sealed:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    env:
      KAGGRICULTURE_SINGLE_GAME_TIMEOUT_SECONDS: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact engine
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'; print('engine='+kaggle_environments.__version__)"

      - name: Rebuild exact v121 and v135
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\Program Files\Git\usr\bin;$env:PATH"
          if (-not (Get-Command patch.exe -ErrorAction SilentlyContinue)) { throw "Git patch.exe not found" }
          python eval_assets/v130/rebuild_eval_agents.py --out-dir eval_agents/v130
          if ($LASTEXITCODE -ne 0) { throw "v121/v130 rebuild failed" }
          python eval_assets/v130/build_v135.py --v130 eval_agents/v130/v130_candidate_late_town_draw_gate24.py --out eval_agents/v130/v135_candidate_milk_quote_boundary.py
          if ($LASTEXITCODE -ne 0) { throw "v135 build failed" }
          python -c "import hashlib,pathlib; p=pathlib.Path('eval_agents/v130/v135_candidate_milk_quote_boundary.py'); h=hashlib.sha256(p.read_bytes()).hexdigest(); pathlib.Path('v135_sha256.txt').write_text(h,encoding='utf-8'); print('v135 sha256',h); compile(p.read_text(encoding='utf-8'),str(p),'exec')"

      - name: Sealed same-seed seat-swap panel
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path sealed | Out-Null
          function Run-Panel([string]$id, [string]$opp) {
            $dir = Join-Path sealed $id
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            python scripts/ci/run_exact_pair_guarded.py --candidate eval_agents/v130/v135_candidate_milk_quote_boundary.py --baseline $opp --seed-start 390101 --seed-count 8 --out "$dir/candidate.json"
            if ($LASTEXITCODE -ne 0) { throw "candidate run failed: $id" }
            python scripts/ci/run_exact_pair_guarded.py --candidate eval_agents/v130/v121_champion_same_turn_unwind.py --baseline $opp --seed-start 390101 --seed-count 8 --out "$dir/champion.json"
            if ($LASTEXITCODE -ne 0) { throw "champion run failed: $id" }
            python eval_assets/v130/compare_candidate_champion.py --candidate-json "$dir/candidate.json" --champion-json "$dir/champion.json" --opponent $opp --out "$dir/summary.json"
            if ($LASTEXITCODE -ne 0) { throw "compare failed: $id" }
          }
          Run-Panel bl21 opponents/bl_v21
          Run-Panel bl16 opponents/bl_v16rc2
          Run-Panel starter starter
          Run-Panel beat-v48 opponents/beat_v48
          Run-Panel strong-farming-b opponents/farming_v2_b

      - name: Aggregate sealed candidate_minus_champion
        if: always()
        run: |
          $code = @'
          import glob,json,math,statistics
          from pathlib import Path
          ss=[]
          for p in sorted(glob.glob('sealed/*/summary.json')):
              try: ss.append(json.load(open(p,encoding='utf-8')))
              except Exception as e: print('skip',p,e)
          rows=[r for s in ss for r in s.get('rows',[])]
          ds=[float(r['candidate_minus_champion']) for r in rows]
          n=len(ds); mean=statistics.fmean(ds) if n else 0.0
          sd=statistics.stdev(ds) if n>1 else 0.0
          se=sd/math.sqrt(n) if n else 0.0
          sha=Path('v135_sha256.txt').read_text(encoding='utf-8').strip() if Path('v135_sha256.txt').exists() else None
          out={'candidate':'v135_candidate_milk_quote_boundary','candidate_sha256':sha,'champion':'v121_champion_same_turn_unwind','engine':'kaggle_environments==1.32.7','sealed_seed_start':390101,'sealed_seed_count':8,'paired_rows':n,'wins':sum(x>0 for x in ds),'losses':sum(x<0 for x in ds),'draws':sum(x==0 for x in ds),'mean_candidate_minus_champion':mean,'se':se,'mean_minus_2se':mean-2*se,'worst_regression':min(ds) if ds else 0.0,'best_improvement':max(ds) if ds else 0.0,'technical_ok':bool(ss) and all(s.get('all_ok') for s in ss),'panels':ss}
          Path('v135_sealed_summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in out.items() if k!='panels'},indent=2))
          if n != 40: raise SystemExit(f'expected 40 paired rows, got {n}')
          if not out['technical_ok']: raise SystemExit('technical failure in sealed panel')
          '@
          $code | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v135-sealed-fresh-seeds
          path: |
            sealed/
            v135_sha256.txt
            v135_sealed_summary.json
          retention-days: 30
