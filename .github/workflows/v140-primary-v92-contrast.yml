name: v140 primary V92 contrast telemetry

on:
  push:
    branches: [eval-public-opponents-20260923]
    paths: [".github/workflows/v140-primary-v92-contrast.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact Kaggriculture 1.32.7
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
          python - <<'PY'
          import kaggle_environments
          assert kaggle_environments.__version__ == '1.32.7'
          PY
      - name: Build exact v115 and isolated v140
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v140_v92_k2_isolated.py tmp/v115.py tmp/v140.py
          python -m py_compile tmp/v115.py tmp/v140.py ci/diagnose_v140_primary_v92.py
          sha256sum tmp/v115.py tmp/v140.py
      - name: Diagnose burned non-zero v140 direct seeds
        env:
          PYTHONPATH: .
        run: |
          python ci/diagnose_v140_primary_v92.py --v115 tmp/v115.py --v140 tmp/v140.py --out results/v140_primary_v92_contrast.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v140-primary-v92-contrast
          path: results/
          if-no-files-found: error
          retention-days: 14
