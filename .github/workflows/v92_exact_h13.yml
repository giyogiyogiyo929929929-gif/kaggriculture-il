name: v92 exact h13 vs v91 h9

on:
  push:
    branches:
      - chatgpt-v92-exact-h13
    paths:
      - '.github/workflows/v92_exact_h13.yml'
      - 'experiments/chatgpt_v92/**'
  workflow_dispatch:

jobs:
  exact-h2h:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kaggle-environments==1.32.7'
          python - <<'PY'
          import kaggle_environments
          print('kaggle_environments', kaggle_environments.__version__)
          assert kaggle_environments.__version__ == '1.32.7'
          PY

      - name: Reconstruct v91 and build v92 h13
        run: python experiments/chatgpt_v92/prepare_agents.py

      - name: Exact same-seed seat-swap panel
        run: |
          python experiments/chatgpt_v92/run_exact_panel.py \
            --candidate experiments/chatgpt_v92/v92_chase_h13.py \
            --champion experiments/chatgpt_v92/v91_chase_h9.py \
            --seed-start 221001 \
            --pairs 12 \
            --output experiments/chatgpt_v92/v92_h13_vs_v91_exact_221001_12.json

      - name: Show exact result
        if: always()
        run: cat experiments/chatgpt_v92/v92_h13_vs_v91_exact_221001_12.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v92-h13-exact-results
          path: |
            experiments/chatgpt_v92/v92_h13_vs_v91_exact_221001_12.json
            experiments/chatgpt_v92/v91_chase_h9.py
            experiments/chatgpt_v92/v92_chase_h13.py
          if-no-files-found: warn
