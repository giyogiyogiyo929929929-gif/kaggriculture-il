name: v92 official external safety

on:
  push:
    branches:
      - chatgpt-v92-exact-h13
    paths:
      - '.github/workflows/v92_exact_h13.yml'
      - 'experiments/chatgpt_v92/**'
  workflow_dispatch:

jobs:
  exact-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kaggle-environments==1.32.7'
          python - <<'PY'
          import kaggle_environments
          print('kaggle_environments', kaggle_environments.__version__)
          assert kaggle_environments.__version__ == '1.32.7'
          PY

      - name: Reconstruct v91/v92 and safety opponents
        run: |
          python experiments/chatgpt_v92/prepare_agents.py
          python experiments/chatgpt_v92/prepare_safety_opponents.py

      - name: Exact uploaded_main safety
        run: |
          python experiments/chatgpt_v92/run_exact_panel.py \
            --candidate experiments/chatgpt_v92/v92_chase_h13.py \
            --champion experiments/chatgpt_v92/uploaded_main.py \
            --seed-start 217001 \
            --pairs 4 \
            --output experiments/chatgpt_v92/v92_h13_vs_uploaded_main_exact_217001_4.json

      - name: Exact h4 safety
        run: |
          python experiments/chatgpt_v92/run_exact_panel.py \
            --candidate experiments/chatgpt_v92/v92_chase_h13.py \
            --champion experiments/chatgpt_v92/h4.py \
            --seed-start 217001 \
            --pairs 4 \
            --output experiments/chatgpt_v92/v92_h13_vs_h4_exact_217001_4.json

      - name: Show safety results
        if: always()
        run: |
          cat experiments/chatgpt_v92/v92_h13_vs_uploaded_main_exact_217001_4.json || true
          cat experiments/chatgpt_v92/v92_h13_vs_h4_exact_217001_4.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v92-h13-safety-results
          path: |
            experiments/chatgpt_v92/v92_h13_vs_uploaded_main_exact_217001_4.json
            experiments/chatgpt_v92/v92_h13_vs_h4_exact_217001_4.json
            experiments/chatgpt_v92/v92_chase_h13.py
          if-no-files-found: warn
