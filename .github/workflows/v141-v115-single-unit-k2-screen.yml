name: v141 V92 single-unit K2 screen

on:
  push:
    branches: [eval-public-opponents-20260923]
    paths: [".github/workflows/v141-v115-single-unit-k2-screen.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Build exact v115 and v141
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v141_v92_single_unit_k2.py tmp/v115.py tmp/v141.py
          python -m py_compile tmp/v115.py tmp/v141.py
          python - <<'PY'
          a=open('tmp/v115.py',encoding='utf-8').read(); b=open('tmp/v141.py',encoding='utf-8').read()
          assert a.count('_V92_P_K = 1') == 1 and b.count('_V92_P_K = 1') == 1
          assert a.count('>= _V92_P_K') == 2 and b.count('>= _V92_P_K') == 2
          assert 'if qty == 1 and not any(' in b
          PY
          sha256sum tmp/v115.py tmp/v141.py
      - name: Burned calibration direct 641-652
        id: gate
        run: |
          python - <<'PY'
          import json,math,statistics,os
          from scripts.eval import evaluate
          s=evaluate('tmp/v141.py','tmp/v115.py',pairs=12,jobs=4,seed_start=641)
          by={}
          for g in s['matches_detail']: by.setdefault(int(g['seed']),[]).append(g)
          rows=[]
          for seed in sorted(by):
              ds=[float(g['money'][0])-float(g['money'][1]) for g in by[seed]]
              rows.append({'seed':seed,'candidate_minus_champion':statistics.mean(ds)})
          vals=[r['candidate_minus_champion'] for r in rows]
          out={'purpose':'burned calibration only','pairs':len(vals),'wins':sum(v>0 for v in vals),'losses':sum(v<0 for v in vals),'ties':sum(v==0 for v in vals),'mean':statistics.mean(vals),'worst':min(vals),'best':max(vals),'candidate_exceptions':s['exceptions']['a'],'champion_exceptions':s['exceptions']['b'],'rows':rows}
          open('results/calibration.json','w').write(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          proceed=(out['mean']>0 and out['worst']>=0 and out['candidate_exceptions']==0 and out['champion_exceptions']==0)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"proceed={'true' if proceed else 'false'}\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v141-burned-calibration, path: results/, if-no-files-found: error, retention-days: 14}

  fresh-direct:
    needs: calibration
    if: needs.calibration.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Build
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v141_v92_single_unit_k2.py tmp/v115.py tmp/v141.py
      - name: Fresh direct 661-672
        run: |
          python - <<'PY'
          import json,math,statistics
          from scripts.eval import evaluate
          s=evaluate('tmp/v141.py','tmp/v115.py',pairs=12,jobs=4,seed_start=661)
          by={}
          for g in s['matches_detail']: by.setdefault(int(g['seed']),[]).append(g)
          rows=[]; seat0=[]; seat1=[]
          for seed in sorted(by):
              vals=[]
              for g in sorted(by[seed],key=lambda x:bool(x['swap'])):
                  d=float(g['money'][0])-float(g['money'][1]); vals.append(d); (seat1 if g['swap'] else seat0).append(d)
              rows.append({'seed':seed,'candidate_minus_champion':statistics.mean(vals)})
          vals=[r['candidate_minus_champion'] for r in rows]; m=statistics.mean(vals); se=statistics.stdev(vals)/math.sqrt(len(vals)) if len(vals)>1 else 0
          out={'metric':'candidate_minus_champion = candidate - champion','pairs':len(vals),'wins':sum(v>0 for v in vals),'losses':sum(v<0 for v in vals),'ties':sum(v==0 for v in vals),'mean':m,'se':se,'mean_ge_2se':bool(m>0 and m>=2*se),'worst':min(vals),'worst_seed':rows[vals.index(min(vals))]['seed'],'best':max(vals),'best_seed':rows[vals.index(max(vals))]['seed'],'seat0_mean':statistics.mean(seat0),'seat1_mean':statistics.mean(seat1),'candidate_exceptions':s['exceptions']['a'],'champion_exceptions':s['exceptions']['b'],'rows':rows}
          open('results/fresh_direct.json','w').write(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v141-fresh-direct, path: results/, if-no-files-found: error, retention-days: 14}

  panel:
    needs: calibration
    if: needs.calibration.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {name: starter, opponent: starter}
          - {name: beat_v48, opponent: opponents/beat_v48/main.py}
          - {name: bl_v20, opponent: opponents/bl_v20/main.py}
          - {name: bl_v21, opponent: opponents/bl_v21/main.py}
          - {name: farming_v2, opponent: opponents/farming_v2/main.py}
          - {name: frontier_prvsiyan, opponent: opponents/frontier_prvsiyan/main.py}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Build
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v141_v92_single_unit_k2.py tmp/v115.py tmp/v141.py
      - name: Fresh matched panel 661-664
        run: |
          python ci/eval_candidate_vs_champion_panel.py --candidate tmp/v141.py --champion tmp/v115.py --opponent '${{ matrix.opponent }}' --seed-start 661 --seed-count 4 --jobs 4 --out results/panel.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'v141-panel-${{ matrix.name }}', path: results/, if-no-files-found: error, retention-days: 14}
