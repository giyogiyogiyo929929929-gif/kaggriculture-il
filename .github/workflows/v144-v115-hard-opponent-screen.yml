name: v144 vs v115 hard-opponent outcome screen

on:
  push:
    branches: [eval-v115-v144-public-room-guard-20260925]
    paths:
      - ".github/workflows/v144-v115-hard-opponent-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hard-panel:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact engine
        run: |
          $ErrorActionPreference = 'Stop'
          $gitUsr = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path = "$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
      - name: Reconstruct exact v115 and build v144
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize = @'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name)
              p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append = @'
          from pathlib import Path
          p=Path('tmp/main.py')
          p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          if ($LASTEXITCODE -ne 0) { throw 'exact v115 reconstruction failed' }
          python ci\build_v144_public_room_guard.py tmp\v115.py tmp\v144.py
          if ($LASTEXITCODE -ne 0) { throw 'v144 build failed' }
          python -m py_compile tmp\v115.py tmp\v144.py
          $check = @'
          import hashlib
          from pathlib import Path
          got=hashlib.sha256(Path('tmp/v115.py').read_bytes()).hexdigest()
          print('v115_sha256', got)
          assert got == 'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2'
          '@
          $check | python -
      - name: Evaluate fresh hard-opponent development panel
        run: |
          $ErrorActionPreference = 'Stop'
          $opponents = @(
            'k256_h2_q_v1',
            'metav4_v13',
            'v49',
            'v50',
            'tetsutani_dpts_b',
            'salem_2900',
            'peak_2950',
            'jaxa_2802',
            'kf_v58',
            'score_2820'
          )
          foreach ($name in $opponents) {
            $path = "opponents\$name\main.py"
            if (!(Test-Path $path)) { throw "missing opponent $path" }
            python ci\eval_candidate_vs_champion_panel.py --candidate tmp\v144.py --champion tmp\v115.py --opponent $path --seed-start 711001 --seed-count 3 --jobs 1 --out "results\$name.json"
            if ($LASTEXITCODE -ne 0) { throw "evaluation failed for $name" }
          }
      - name: Aggregate outcome conversion
        run: |
          $aggregate = @'
          import json
          from pathlib import Path

          def outcome(margin):
              return 1 if margin > 0 else (-1 if margin < 0 else 0)

          rows=[]
          totals={
              'games':0,'champion_wins':0,'champion_ties':0,'champion_losses':0,
              'candidate_wins':0,'candidate_ties':0,'candidate_losses':0,
              'improved_outcome':0,'worsened_outcome':0,'same_outcome':0,
              'champion_nonwins':0,'nonwin_to_win':0,'loss_to_tie':0,
              'win_to_nonwin':0,'tie_to_loss':0,
          }
          money_deltas=[]
          margin_deltas=[]
          hard=[]
          for path in sorted(Path('results').glob('*.json')):
              data=json.loads(path.read_text(encoding='utf-8'))
              name=path.stem
              opp={
                  'opponent':name,
                  'games':0,'champion_wins':0,'champion_ties':0,'champion_losses':0,
                  'candidate_wins':0,'candidate_ties':0,'candidate_losses':0,
                  'improved_outcome':0,'worsened_outcome':0,'same_outcome':0,
                  'champion_nonwins':0,'nonwin_to_win':0,'loss_to_tie':0,
                  'win_to_nonwin':0,'tie_to_loss':0,
                  'money_deltas':[],'margin_deltas':[],
              }
              for seedrow in data['rows']:
                  for seat in seedrow['seats']:
                      co=outcome(seat['candidate_margin'])
                      ho=outcome(seat['champion_margin'])
                      opp['games']+=1
                      opp['candidate_' + ('wins' if co>0 else 'losses' if co<0 else 'ties')]+=1
                      opp['champion_' + ('wins' if ho>0 else 'losses' if ho<0 else 'ties')]+=1
                      if co>ho: opp['improved_outcome']+=1
                      elif co<ho: opp['worsened_outcome']+=1
                      else: opp['same_outcome']+=1
                      if ho<=0:
                          opp['champion_nonwins']+=1
                          if co>0: opp['nonwin_to_win']+=1
                          if ho<0 and co==0: opp['loss_to_tie']+=1
                      if ho>0 and co<=0: opp['win_to_nonwin']+=1
                      if ho==0 and co<0: opp['tie_to_loss']+=1
                      opp['money_deltas'].append(seat['candidate_minus_champion_money'])
                      opp['margin_deltas'].append(seat['candidate_minus_champion_margin'])
              opp['candidate_minus_champion_money_mean']=sum(opp['money_deltas'])/len(opp['money_deltas'])
              opp['candidate_minus_champion_margin_mean']=sum(opp['margin_deltas'])/len(opp['margin_deltas'])
              opp.pop('money_deltas'); opp.pop('margin_deltas')
              rows.append(opp)
              if opp['champion_nonwins']:
                  hard.append(name)
              for k in totals:
                  if k in opp: totals[k]+=opp[k]
              money_deltas.append(opp['candidate_minus_champion_money_mean'])
              margin_deltas.append(opp['candidate_minus_champion_margin_mean'])
          summary={
              'metric_primary':'game outcome conversion versus same opponent/seed/seat; cash delta is secondary',
              'seeds':[711001,711002,711003],
              'hard_opponents_with_champion_nonwin':hard,
              'totals':totals,
              'opponent_mean_candidate_minus_champion_money':sum(money_deltas)/len(money_deltas),
              'opponent_mean_candidate_minus_champion_margin':sum(margin_deltas)/len(margin_deltas),
              'opponents':rows,
          }
          Path('results/hard_panel_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          assert totals['games'] == 60
          '@
          $aggregate | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v144-v115-hard-opponent-screen
          path: results/
          if-no-files-found: error
          retention-days: 30
