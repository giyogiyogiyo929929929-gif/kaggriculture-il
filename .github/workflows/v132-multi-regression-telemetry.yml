name: V132 Multi Regression Telemetry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v132-multi-regression-telemetry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { id: beatv48-381003, opponent: opponents/beat_v48, seed: 381003 }
          - { id: firstline-381005, opponent: opponents/first_in_line, seed: 381005 }
          - { id: frontier-381001, opponent: opponents/frontier_prvsiyan, seed: 381001 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle-environments==1.32.7"
          python - <<'PY'
          import kaggle_environments
          assert kaggle_environments.__version__ == "1.32.7"
          PY
      - name: Rebuild agents
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python eval_assets/v130/rebuild_eval_agents.py --out-dir eval_agents/v130
          python eval_assets/v130/build_v131.py --source eval_agents/v130/v130_candidate_late_town_draw_gate24.py --out eval_agents/v130/v131_candidate_persistent_late_lead5000.py
          python eval_assets/v130/build_v132_variants.py --source eval_agents/v130/v131_candidate_persistent_late_lead5000.py --out-dir eval_agents/v130
      - name: Trace both seats
        run: |
          mkdir -p results
          for seat in 0 1; do
            python eval_assets/v130/trace_single_game.py --target eval_agents/v130/v132_lastday.py --opponent "${{ matrix.opponent }}" --target-seat "$seat" --seed "${{ matrix.seed }}" --out "results/candidate_seat${seat}.json"
            python eval_assets/v130/trace_single_game.py --target eval_agents/v130/v121_champion_same_turn_unwind.py --opponent "${{ matrix.opponent }}" --target-seat "$seat" --seed "${{ matrix.seed }}" --out "results/champion_seat${seat}.json"
          done
      - name: Summarize first divergences
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def canon(x): return json.dumps(x,sort_keys=True,separators=(',',':'))
          out={'id':'${{ matrix.id }}','seed':int('${{ matrix.seed }}'),'opponent':'${{ matrix.opponent }}','seats':{}}
          for seat in (0,1):
              c=json.load(open(f'results/candidate_seat{seat}.json')); h=json.load(open(f'results/champion_seat{seat}.json'))
              cm={int(r['step']):r for r in c['trace']}; hm={int(r['step']):r for r in h['trace']}
              ds=[]
              for step in sorted(set(cm)&set(hm)):
                  a,b=cm[step],hm[step]; ad=canon(a['action'])!=canon(b['action']); ss=a['obs_sha256']==b['obs_sha256']
                  if ad or not ss:
                      ds.append({'step':step,'state_same':ss,'action_diff':ad,'candidate_action':a['action'],'champion_action':b['action'],'gate':a.get('late_draw_gate'),'own_money':a.get('own_money'),'rival_money':a.get('rival_money'),'champ_own_money':b.get('own_money'),'champ_rival_money':b.get('rival_money'),'lead':(a.get('own_money')-a.get('rival_money')) if a.get('own_money') is not None and a.get('rival_money') is not None else None,'own_products':a.get('own_products'),'market_inventory':a.get('market_inventory'),'market_prices':a.get('market_prices'),'shops':a.get('shops')})
              out['seats'][str(seat)]={'candidate_rewards':c['rewards'],'champion_rewards':h['rewards'],'first_action_divergence':next((x for x in ds if x['action_diff']),None),'divergences':ds[:80]}
          Path('results/summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({k:{'candidate_rewards':v['candidate_rewards'],'champion_rewards':v['champion_rewards'],'first_action_divergence':v['first_action_divergence']} for k,v in out['seats'].items()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v132-telemetry-${{ matrix.id }}
          path: results/
          retention-days: 30
