name: uploaded 127ed3 CARROT2 feed0 sealed completion verify hosted

on:
  push:
    branches: [eval-uploaded-127ed3-20260926]
    paths:
      - '.github/workflows/uploaded-127ed3-ca-feed0-sealed-verify-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact parent and feed0 child
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          python ci\build_uploaded_127ed3_safety_v3.py tmp\safe_v3.py
          python ci\build_uploaded_127ed3_ca_feed0.py tmp\safe_v3.py tmp\ca_feed0.py
          @'
          import hashlib,importlib.metadata
          from pathlib import Path
          import kaggle_environments.envs.kaggriculture.kaggriculture as kg
          p=Path('tmp/safe_v3.py').read_bytes(); c=Path('tmp/ca_feed0.py').read_bytes()
          assert hashlib.sha256(p).hexdigest()=='87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df'
          assert hashlib.sha256(c).hexdigest()=='cc300eda64d0fe1f884bd164f973de2177eb68c1808cafed06bfeadc5b446e44'
          assert importlib.metadata.version('kaggle-environments')=='1.32.7'
          assert hashlib.sha256(Path(kg.__file__).read_bytes()).hexdigest()=='bc8a54879ef02c7ea64b8b333d6a976f0ea65c4949149d01f463f23bccee653e'
          '@ | python -
          python -m py_compile tmp\safe_v3.py tmp\ca_feed0.py
      - name: Re-run precommitted seeds and verify final states directly
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json
          from pathlib import Path
          from kaggle_environments import make
          from scripts.preflight import load_like_kaggle,call_like_kaggle
          seeds=[446910,885820,619329,999159,438040,240018,833802,418449,899805,893017,955463,986686]
          A=Path('tmp/ca_feed0.py'); B=Path('tmp/safe_v3.py')
          rows=[]; exc=[0,0]; non_done=0
          expected={446910:0,885820:0,619329:0,999159:0,438040:0,240018:0,833802:118,418449:0,899805:0,893017:258,955463:-38,986686:0}
          def money(env,s):
              obs=env.steps[-1][s].get('observation') or {}
              return float((obs.get('farms') or [])[s].get('money',env.state[s].get('reward',0)))
          for seed in seeds:
              seat_deltas=[]; status_rows=[]; step_rows=[]
              for cs in (0,1):
                  paths=[A,B] if cs==0 else [B,A]
                  loaded=[load_like_kaggle(p) for p in paths]
                  agents=[]; local=[0,0]
                  for seat,a in enumerate(loaded):
                      def w(obs,cfg=None,_a=a,_seat=seat):
                          try:return call_like_kaggle(_a,obs,cfg)
                          except Exception:
                              local[_seat]+=1
                              return {'farmer':['PASS'],'hands':[],'market':[]}
                      agents.append(w)
                  env=make('kaggriculture',configuration={'seed':seed}); env.run(agents)
                  exc[0]+=local[cs]; exc[1]+=local[1-cs]
                  statuses=[st.get('status') for st in env.state]
                  if any(x!='DONE' for x in statuses): non_done+=1
                  steps=len(env.steps)
                  d=money(env,cs)-money(env,1-cs)
                  seat_deltas.append(d); status_rows.append(statuses); step_rows.append(steps)
              assert seat_deltas==[expected[seed],expected[seed]], (seed,seat_deltas,expected[seed])
              rows.append({'seed':seed,'seat_deltas':seat_deltas,'statuses':status_rows,'steps':step_rows})
          out={'candidate_sha256':'cc300eda64d0fe1f884bd164f973de2177eb68c1808cafed06bfeadc5b446e44','parent_sha256':'87a990786d123112cdd1e34cdaff9e1a390c94ebb078117ee77bea3d8dce27df','seed_precommit_sha256':'7fcdac52798e5bcb00fe13d108c9324de5ab89f7ce909a0d9f17417e005bc456','exceptions':exc,'non_done':non_done,'rows':rows}
          Path('results/verify.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({'exceptions':exc,'non_done':non_done,'steps_ok':all(all(x==720 for x in r['steps']) for r in rows)},indent=2))
          assert exc==[0,0] and non_done==0
          assert all(all(x==720 for x in r['steps']) for r in rows)
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-127ed3-ca-feed0-sealed-verify-hosted
          path: results/
          if-no-files-found: error
          retention-days: 30
