name: v147 duplicate factor probe

on:
  push:
    branches: [eval-v147-resume-selfhosted-20260926]
    paths: [".github/workflows/v147-duplicate-factor-probe-selfhosted.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct exact agents
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          Push-Location tmp; patch --binary --batch -p3 -i ..\ci\v76.patch; if ($LASTEXITCODE -ne 0) { throw 'patch failed' }; Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
      - name: Count duplicate evaluated candidates and dump hot source
        run: |
          $ErrorActionPreference='Stop'
          @'
          import importlib.util, inspect, json, sys
          from pathlib import Path
          from kaggle_environments import make

          SEEDS=[681,682,689,691,692]
          uid=0; rows=[]
          def load(path):
              global uid; uid+=1
              p=Path(path).resolve(); name=f'_dup_{uid}'
              spec=importlib.util.spec_from_file_location(name,p); m=importlib.util.module_from_spec(spec); sys.modules[name]=m
              sys.path.insert(0,str(p.parent))
              try: spec.loader.exec_module(m)
              finally: sys.path.remove(str(p.parent))
              return m
          def last_callable(m):
              fn=None
              for v in vars(m).values():
                  if callable(v): fn=v
              return fn
          def key(candidate):
              return tuple(tuple(o) if isinstance(o,(list,tuple)) else ('__scalar__',repr(o)) for o in candidate)

          src=load('tmp/v147.py')
          Path('results/v27_candidates_source.txt').write_text(inspect.getsource(src._v27_candidates),encoding='utf-8')
          Path('results/v44y_factor_margin_source.txt').write_text(inspect.getsource(src._v44y_factor_margin),encoding='utf-8')
          Path('results/v111_reorder_source.txt').write_text(inspect.getsource(src._v111_reorder),encoding='utf-8')

          for seed in SEEDS:
            for seat in (0,1):
              m=load('tmp/v147.py'); champ=last_callable(load('tmp/v115.py'))
              orig_candidates=m._v27_candidates
              turn={'step':None,'generated':0,'duplicates':0,'unique':0,'seen':set()}
              def wrapped_candidates(orders,slots,sells,fixed,_orig=orig_candidates,_m=m,_seed=seed,_seat=seat):
                  # Called from both parent and v147 second pass; record each call separately.
                  local_seen=set(); gen=dup=0
                  for cand in _orig(orders,slots,sells,fixed):
                      gen+=1; k=key(cand)
                      if k in local_seen: dup+=1
                      else: local_seen.add(k)
                      yield cand
                  rows.append({'seed':_seed,'seat':_seat,'step':turn['step'],'generated':gen,'unique':len(local_seen),'duplicates':dup})
              m._v27_candidates=wrapped_candidates
              orig_agent=m.agent
              def step_agent(obs,cfg=None,_orig=orig_agent):
                  turn['step']=int(obs.get('step',0)); return _orig(obs,cfg)
              agents=[step_agent,champ] if seat==0 else [champ,step_agent]
              env=make('kaggriculture',configuration={'seed':seed},debug=True); env.run(agents)
              assert [x.get('status') for x in env.state]==['DONE','DONE']
          hot=sorted(rows,key=lambda r:(r['duplicates'],r['generated']),reverse=True)[:50]
          out={'calls':len(rows),'generated':sum(r['generated'] for r in rows),'unique':sum(r['unique'] for r in rows),'duplicates':sum(r['duplicates'] for r in rows),'duplicate_ratio':sum(r['duplicates'] for r in rows)/max(1,sum(r['generated'] for r in rows)),'hot':hot}
          Path('results/duplicate_probe.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v147-duplicate-factor-probe-selfhosted
          path: results/
          if-no-files-found: error
          retention-days: 30
