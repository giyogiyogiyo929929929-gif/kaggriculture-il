name: v144 room guard telemetry hosted fallback

on:
  push:
    branches: [eval-v115-v144-public-room-guard-20260925]
    paths:
      - ".github/workflows/v144-telemetry-hosted-ubuntu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact engine
        run: |
          set -euo pipefail
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python - <<'PY'
          import kaggle_environments
          assert kaggle_environments.__version__ == '1.32.7'
          print(kaggle_environments.__version__)
          PY
      - name: Reconstruct exact v115 and room guard candidate
        run: |
          set -euo pipefail
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          python - <<'PY'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name)
              p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          PY
          (cd tmp && patch --binary --batch -p3 -i ../ci/v76.patch)
          python - <<'PY'
          from pathlib import Path
          p=Path('tmp/main.py')
          p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          PY
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v144_public_room_guard.py tmp/v115.py tmp/room_guard.py
          python -m py_compile tmp/v115.py tmp/room_guard.py ci/diagnose_public_room_guard.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          got=hashlib.sha256(Path('tmp/v115.py').read_bytes()).hexdigest()
          print('v115_sha256',got)
          assert got == 'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2'
          PY
      - name: Burned causal telemetry 683 689 693 both seats
        run: |
          set -euo pipefail
          python ci/diagnose_public_room_guard.py --v115 tmp/v115.py --candidate tmp/room_guard.py --out results/public_room_guard_telemetry.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v144-public-room-guard-telemetry-hosted
          path: results/
          if-no-files-found: error
          retention-days: 30
