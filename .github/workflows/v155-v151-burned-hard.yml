name: v155 v151 strict burned hard gate

on:
  pull_request:
    branches: [eval-v155-v151-narrow-dense-exposure-guard-20260927]
    paths: ["ci/trigger-v155-burned-hard.txt"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Reconstruct exact v151 and v155
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"; Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps 'kaggle-environments==1.32.7'; python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results,results\hard | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          Push-Location tmp; patch --binary --batch -p3 -i ..\ci\v76.patch; if($LASTEXITCODE -ne 0){throw 'patch failed'}; Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v150_skip_noop_second_pass.py tmp\v147.py tmp\v150.py
          python ci\build_v151_none_observation_guard.py tmp\v150.py tmp\v151.py
          python ci\build_v155_v151_not_ahead_dense_self_exposure.py tmp\v151.py tmp\v155.py
          python -m py_compile tmp\v151.py tmp\v155.py
          @'
          import hashlib,json
          from pathlib import Path
          a=hashlib.sha256(Path('tmp/v151.py').read_bytes()).hexdigest(); b=hashlib.sha256(Path('tmp/v155.py').read_bytes()).hexdigest()
          assert a=='54edf1f1663b161457c6d31daccb68b496e5a61dffb6f140f69af2e0b380bf31',a
          Path('results/build.json').write_text(json.dumps({'v151_sha256':a,'v155_sha256':b},indent=2)); print(b)
          '@ | python -
      - name: Burned direct 681-692
        run: |
          python scripts\eval.py tmp\v155.py tmp\v151.py -n 12 -j 2 --seed-start 681 --json results\burned_raw.json
          if($LASTEXITCODE -ne 0){throw 'burned eval failed'}
          @'
          import json,statistics
          from pathlib import Path
          d=json.loads(Path('results/burned_raw.json').read_text()); by={}
          for g in d['matches_detail']: by.setdefault(int(g['seed']),[]).append(float(g['money'][0])-float(g['money'][1]))
          rows=[{'seed':s,'seat_diffs':v,'pair':statistics.fmean(v)} for s,v in sorted(by.items())]; vals=[r['pair'] for r in rows]
          out={'wins':sum(x>0 for x in vals),'losses':sum(x<0 for x in vals),'ties':sum(x==0 for x in vals),'mean':statistics.fmean(vals),'worst':min(vals),'best':max(vals),'rows':rows,'exceptions':d['exceptions']}
          Path('results/burned_summary.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          assert d['exceptions']['a']==0 and d['exceptions']['b']==0 and min(vals)>=0,out
          '@ | python -
      - name: Hard 8x4 panel
        run: |
          $ErrorActionPreference='Stop'
          $specs=@(
            @('peak_2950','opponents\peak_2950\main.py'),@('salem_2900','opponents\salem_2900\main.py'),@('score_2820','opponents\score_2820\main.py'),@('jaxa_2802','opponents\jaxa_2802\main.py'),@('thomas_router_95','opponents\thomas_router_95\main.py'),@('tetsutani_ms','opponents\tetsutani_ms\main.py'),@('melon_squeeze','opponents\melon_squeeze\main.py'),@('shop_router_v7','opponents\shop_router_v7\main.py'))
          foreach($s in $specs){ python ci\eval_candidate_vs_champion_panel.py --candidate tmp\v155.py --champion tmp\v151.py --opponent $s[1] --seed-start 520101 --seed-count 4 --jobs 2 --out ("results\hard\"+$s[0]+".json"); if($LASTEXITCODE -ne 0){throw "panel failed $($s[0])"} }
      - name: Aggregate strict hard gate
        run: |
          @'
          import glob,json,statistics
          from pathlib import Path
          def st(x): return 'W' if x>0 else ('L' if x<0 else 'D')
          tr={}; vals=[]; exc=0; changed=[]; byopp={}
          for p in sorted(glob.glob('results/hard/*.json')):
            d=json.loads(Path(p).read_text()); opp=Path(p).stem; ov=[]; exc+=d.get('candidate_exceptions',0)+d.get('champion_exceptions',0)
            for r in d['rows']:
              delta=float(r['candidate_minus_champion_money']); vals.append(delta); ov.append(delta)
              for s in r['seats']:
                h=st(float(s['champion_margin'])); c=st(float(s['candidate_margin'])); k=f'{h}->{c}'; tr[k]=tr.get(k,0)+1
                if h!=c: changed.append({'opponent':opp,'seed':r['seed'],'swap':s['swap'],'transition':k,'candidate_margin':s['candidate_margin'],'champion_margin':s['champion_margin'],'delta':s['candidate_minus_champion_money']})
            byopp[opp]={'mean':statistics.fmean(ov),'worst':min(ov),'best':max(ov)}
          regress=sum(tr.get(k,0) for k in ('W->D','W->L','D->L')); improve=sum(tr.get(k,0) for k in ('L->D','L->W','D->W'))
          out={'transitions':tr,'regressions':regress,'improvements':improve,'mean':statistics.fmean(vals),'worst':min(vals),'best':max(vals),'exceptions':exc,'changed_outcomes':changed,'by_opponent':byopp}
          Path('results/hard_summary.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          assert exc==0 and regress==0 and improve>0 and min(vals)>=0,out
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v155-v151-strict-burned-hard
          path: results/
          if-no-files-found: error
          retention-days: 30
