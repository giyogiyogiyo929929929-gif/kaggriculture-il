name: v138 V92 quote order screen

on:
  push:
    branches: [eval-public-opponents-20260923]
    paths: [".github/workflows/v138-v115-v92-order-screen.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct:
    name: direct-v115
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact Kaggriculture 1.32.7
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
          python - <<'PY'
          import kaggle_environments
          from kaggle_environments import make
          assert kaggle_environments.__version__ == '1.32.7'
          env=make('kaggriculture',configuration={'seed':601},debug=True)
          env.run(['starter','starter'])
          assert len(env.steps)==720
          PY
      - name: Build exact v115 and v138
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v138_v92_quote_order.py tmp/v115.py tmp/v138.py
          python -m py_compile tmp/v115.py tmp/v138.py
          sha256sum tmp/v115.py tmp/v138.py
      - name: Direct matched both-seat H2H seeds 601-612
        run: |
          python - <<'PY'
          import json, math, statistics
          from scripts.eval import evaluate
          s=evaluate('tmp/v138.py','tmp/v115.py',pairs=12,jobs=4,seed_start=601)
          by={}
          for g in s['matches_detail']: by.setdefault(int(g['seed']),[]).append(g)
          rows=[]; seat0=[]; seat1=[]
          for seed in sorted(by):
              vals=[]; seats=[]
              for g in sorted(by[seed],key=lambda x:bool(x['swap'])):
                  d=float(g['money'][0])-float(g['money'][1]); vals.append(d)
                  (seat1 if g['swap'] else seat0).append(d)
                  seats.append({'swap':bool(g['swap']),'candidate_minus_champion':d,'candidate_money':g['money'][0],'champion_money':g['money'][1],'candidate_exceptions':g['exceptions']['a'],'champion_exceptions':g['exceptions']['b']})
              rows.append({'seed':seed,'candidate_minus_champion':statistics.mean(vals),'seats':seats})
          vals=[r['candidate_minus_champion'] for r in rows]
          mean=statistics.mean(vals); se=statistics.stdev(vals)/math.sqrt(len(vals)) if len(vals)>1 else 0.0
          out={'metric':'candidate_minus_champion = candidate - champion direct pair margin','candidate':'v138_candidate_v92_quote_order','champion':'v115_champion_same_turn_open_squeeze','seeds':[601,612],'pairs':len(vals),'wins':sum(v>0 for v in vals),'losses':sum(v<0 for v in vals),'ties':sum(v==0 for v in vals),'candidate_minus_champion_mean':mean,'median':statistics.median(vals),'se':se,'mean_minus_2se':mean-2*se,'mean_ge_2se':bool(mean>0 and mean>=2*se),'worst':min(vals),'worst_seed':rows[vals.index(min(vals))]['seed'],'best':max(vals),'best_seed':rows[vals.index(max(vals))]['seed'],'seat0_mean':statistics.mean(seat0),'seat1_mean':statistics.mean(seat1),'candidate_exceptions':s['exceptions']['a'],'champion_exceptions':s['exceptions']['b'],'rows':rows}
          open('results/direct.json','w').write(json.dumps(out,indent=2))
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2))
          print('DIFFERING',[(r['seed'],r['candidate_minus_champion']) for r in rows if r['candidate_minus_champion']!=0])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v138-direct-screen
          path: results/
          if-no-files-found: error
          retention-days: 14

  panel:
    name: panel-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {name: starter, opponent: starter}
          - {name: beat_v48, opponent: opponents/beat_v48/main.py}
          - {name: bl_v20, opponent: opponents/bl_v20/main.py}
          - {name: bl_v21, opponent: opponents/bl_v21/main.py}
          - {name: farming_v2, opponent: opponents/farming_v2/main.py}
          - {name: frontier_prvsiyan, opponent: opponents/frontier_prvsiyan/main.py}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps kaggle-environments==1.32.7
          python -m pip install jsonschema requests
      - name: Build exact v115/v138 and telemetry twin
        run: |
          mkdir -p tmp results
          cp submissions/v27_orderbook_layer_d/main.py tmp/main.py
          (cd tmp && patch --batch -p3 < ../ci/v76.patch)
          printf '\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n' >> tmp/main.py
          mv tmp/main.py tmp/v77.py
          python ci/reconstruct_exact_v115.py tmp/v77.py tmp/v115.py
          python ci/build_v138_v92_quote_order.py tmp/v115.py tmp/v138.py
          python - <<'PY'
          from pathlib import Path
          s=Path('tmp/v138.py').read_text()
          a='_V92_P_REPORT = dict(pred_units=0, pred_fires=0, pred_errors=0)'
          b='_V92_P_REPORT = dict(pred_units=0, pred_fires=0, pred_errors=0, v138_multi_turns=0, v138_order_changes=0, v138_max_items=0)'
          assert s.count(a)==1; s=s.replace(a,b)
          a='_V92_P_REPORT.update(pred_units=0,pred_fires=0,pred_errors=0);_E350_REPORT.update(e350_snapshots=0,e350_errors=0)'
          b='_V92_P_REPORT.update(pred_units=0,pred_fires=0,pred_errors=0,v138_multi_turns=0,v138_order_changes=0,v138_max_items=0);_E350_REPORT.update(e350_snapshots=0,e350_errors=0)'
          assert s.count(a)==1; s=s.replace(a,b)
          a='''    if len(pending) > 1:\n        pending.sort(key=lambda o: _r37_quote_priority(obs, o, stock), reverse=True)\n'''
          b='''    if len(pending) > 1:\n        _V92_P_REPORT["v138_multi_turns"] += 1\n        _V92_P_REPORT["v138_max_items"] = max(_V92_P_REPORT["v138_max_items"], len(pending))\n        _old = list(reversed(pending))\n        _new = sorted(pending, key=lambda o: _r37_quote_priority(obs, o, stock), reverse=True)\n        if _new != _old:\n            _V92_P_REPORT["v138_order_changes"] += 1\n        pending[:] = _new\n'''
          assert s.count(a)==1; s=s.replace(a,b)
          s += '\n# telemetry exposure only\nimport collections as _v138_collections\ntry:\n    agent.telemetry=_v138_collections.ChainMap(_V92_P_REPORT,getattr(agent,"telemetry",{}))\nexcept Exception:\n    pass\n'
          Path('tmp/v138_probe.py').write_text(s)
          PY
          python -m py_compile tmp/v115.py tmp/v138.py tmp/v138_probe.py
      - name: Matched candidate-minus-champion panel seeds 601-604
        run: |
          python ci/eval_candidate_vs_champion_panel.py --candidate tmp/v138.py --champion tmp/v115.py --opponent '${{ matrix.opponent }}' --seed-start 601 --seed-count 4 --jobs 4 --out results/panel.json
      - name: Activation telemetry seeds 601-604 both seats
        env: {OPPONENT: '${{ matrix.opponent }}'}
        run: |
          python - <<'PY'
          import json, os
          from kaggle_environments import make
          from scripts.eval import resolve_agent
          rows=[]
          for seed in range(601,605):
              for swap in (False,True):
                  cand=resolve_agent('tmp/v138_probe.py'); opp=resolve_agent(os.environ['OPPONENT'])
                  env=make('kaggriculture',configuration={'seed':seed},debug=True); env.run([opp,cand] if swap else [cand,opp])
                  t=dict(getattr(cand,'telemetry',{}) or {})
                  rows.append({'seed':seed,'swap':swap,'pred_fires':int(t.get('pred_fires',0) or 0),'pred_units':int(t.get('pred_units',0) or 0),'multi_turns':int(t.get('v138_multi_turns',0) or 0),'order_changes':int(t.get('v138_order_changes',0) or 0),'max_items':int(t.get('v138_max_items',0) or 0),'pred_errors':int(t.get('pred_errors',0) or 0)})
          out={'opponent':os.environ['OPPONENT'],'games':len(rows),'games_active':sum(r['pred_fires']>0 for r in rows),'pred_fires_total':sum(r['pred_fires'] for r in rows),'pred_units_total':sum(r['pred_units'] for r in rows),'games_multi':sum(r['multi_turns']>0 for r in rows),'multi_turns_total':sum(r['multi_turns'] for r in rows),'games_order_changed':sum(r['order_changes']>0 for r in rows),'order_changes_total':sum(r['order_changes'] for r in rows),'max_items':max(r['max_items'] for r in rows),'errors_total':sum(r['pred_errors'] for r in rows),'rows':rows}
          open('results/telemetry.json','w').write(json.dumps(out,indent=2)); print(json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v138-panel-${{ matrix.name }}
          path: results/
          if-no-files-found: error
          retention-days: 14
