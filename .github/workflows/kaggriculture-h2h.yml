name: Kaggriculture H2H

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaggriculture-h2h.yml"
      - "scripts/ci/**"
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate agent path (file, directory with main.py, or starter/random/pass)
        required: true
        default: main.py
        type: string
      baseline:
        description: Baseline/champion agent path
        required: true
        default: opponents/bl_v21/main.py
        type: string
      seed_start:
        description: First deterministic seed
        required: true
        default: "370001"
        type: string
      seed_count:
        description: Number of paired seeds (2 games per seed)
        required: true
        default: "20"
        type: string

env:
  H2H_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate || 'main.py' }}
  H2H_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline || 'opponents/bl_v21/main.py' }}
  H2H_SEED_START: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_start || '369901' }}
  H2H_SEED_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_count || '4' }}

permissions:
  contents: read

jobs:
  h2h:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle-environments==1.32.7"
          python - <<'PY'
          import kaggle_environments
          assert kaggle_environments.__version__ == "1.32.7", kaggle_environments.__version__
          print("kaggle_environments", kaggle_environments.__version__)
          PY

      - name: Run paired shard
        id: run
        continue-on-error: true
        run: |
          mkdir -p results
          python scripts/ci/run_exact_pair.py \
            --candidate "$H2H_CANDIDATE" \
            --baseline "$H2H_BASELINE" \
            --seed-start "$H2H_SEED_START" \
            --seed-count "$H2H_SEED_COUNT" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --out "results/shard-${{ matrix.shard }}.json"

      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2h-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: error
          retention-days: 14

      - name: Propagate shard failure
        if: steps.run.outcome == 'failure'
        run: exit 1

  aggregate:
    name: aggregate
    if: always()
    needs: h2h
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: h2h-shard-*
          path: artifacts

      - name: Aggregate
        run: |
          python scripts/ci/aggregate_h2h.py \
            --input-dir artifacts \
            --candidate "$H2H_CANDIDATE" \
            --baseline "$H2H_BASELINE" \
            --seed-start "$H2H_SEED_START" \
            --seed-count "$H2H_SEED_COUNT" \
            --json-out h2h_summary.json \
            --md-out h2h_summary.md
          cat h2h_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2h-summary
          path: |
            h2h_summary.json
            h2h_summary.md
          retention-days: 30

      - name: Technical gate
        run: |
          python - <<'PY'
          import json
          s = json.load(open("h2h_summary.json", encoding="utf-8"))
          assert s["pairs_completed"] == s["seed_count_requested"], s
          assert s["failed_pairs"] == 0, s
          assert s["candidate_exceptions"] == 0, s
          PY
