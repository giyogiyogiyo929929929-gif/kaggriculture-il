name: v147 vs v121 formal evaluation

on:
  push:
    branches: [eval-v147-v121-formal-20260926]
    paths: [".github/workflows/v147-v121-formal.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned engine and reconstruct exact agents
        env:
          GH_TOKEN_FOR_REBUILD: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gitUsr = 'C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path = "$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null

          # Reconstruct the exact v147 artifact from its original lineage.
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          $normalize = @'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          '@
          $normalize | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          $append = @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@
          $append | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py

          # Pull only the already-audited exact-v121 rebuilder from its evaluation branch.
          git fetch origin eval-v130-v121-exact-20260925 --depth=1
          python -c "import subprocess,pathlib; pathlib.Path('tmp/rebuild_v121.py').write_bytes(subprocess.check_output(['git','show','FETCH_HEAD:eval_assets/v130/rebuild_eval_agents.py']))"
          $env:GITHUB_TOKEN = $env:GH_TOKEN_FOR_REBUILD
          python tmp\rebuild_v121.py --out-dir tmp\v121_rebuild
          Copy-Item tmp\v121_rebuild\v121_champion_same_turn_unwind.py tmp\v121.py

          python -m py_compile tmp\v147.py tmp\v121.py
          $check = @'
          import hashlib
          from pathlib import Path
          exp={
            'tmp/v147.py':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923',
            'tmp/v121.py':'1a44487de886d59f612cfbd083cacadf872ad56d0db13604cbf8af0056c600c2',
          }
          for p,w in exp.items():
              g=hashlib.sha256(Path(p).read_bytes()).hexdigest(); print(p,g); assert g==w,(p,g,w)
          '@
          $check | python -

      - name: Runtime preflight
        run: |
          python scripts\eval.py tmp\v147.py tmp\v121.py -n 1 -j 1 --seed-start 681 --json results\runtime_681.json

      - name: Burned matched v147 vs v121
        run: |
          python scripts\eval.py tmp\v147.py tmp\v121.py -n 12 -j 4 --seed-start 681 --json results\burned_v147_vs_v121.json

      - name: Public opponent panel
        run: |
          $specs = @(
            @('starter','starter'),
            @('beat_v48','opponents\beat_v48\main.py'),
            @('bl_v20','opponents\bl_v20\main.py'),
            @('bl_v21','opponents\bl_v21\main.py'),
            @('farming_v2','opponents\farming_v2\main.py'),
            @('frontier_prvsiyan','opponents\frontier_prvsiyan\main.py')
          )
          foreach ($s in $specs) {
            python ci\eval_candidate_vs_champion_panel.py --candidate tmp\v147.py --champion tmp\v121.py --opponent $s[1] --seed-start 661 --seed-count 4 --jobs 2 --out ("results\public_"+$s[0]+".json")
            if ($LASTEXITCODE -ne 0) { throw "public panel failed: $($s[0])" }
          }

      - name: Aggregate formal screen
        if: always()
        run: |
          $code = @'
          import json,glob,statistics,math
          from pathlib import Path
          def direct(path):
              p=Path(path)
              if not p.exists(): return None
              d=json.loads(p.read_text(encoding='utf-8')); by={}
              for g in d.get('matches_detail',[]):
                  by.setdefault(int(g['seed']),[]).append(float(g['money'][0])-float(g['money'][1]))
              rows=[]
              for s,v in sorted(by.items()):
                  rows.append({'seed':s,'delta':statistics.fmean(v),'seat_diffs':v,'seat_spread':max(v)-min(v) if v else None})
              vals=[r['delta'] for r in rows]
              se=statistics.stdev(vals)/math.sqrt(len(vals)) if len(vals)>1 else 0.0
              return {'pairs':len(vals),'wins':sum(x>0 for x in vals),'losses':sum(x<0 for x in vals),'ties':sum(x==0 for x in vals),'mean':statistics.fmean(vals) if vals else None,'se':se,'mean_minus_2se':(statistics.fmean(vals)-2*se) if vals else None,'worst':min(vals) if vals else None,'best':max(vals) if vals else None,'rows':rows,'exceptions':d.get('exceptions')}
          pubs=[]; vals=[]
          for p in sorted(glob.glob('results/public_*.json')):
              d=json.load(open(p,encoding='utf-8')); x=[float(r['candidate_minus_champion_money']) for r in d.get('rows',[])]; vals.extend(x)
              pubs.append({'name':Path(p).stem,'pairs':len(x),'wins':sum(v>0 for v in x),'losses':sum(v<0 for v in x),'ties':sum(v==0 for v in x),'mean':statistics.fmean(x) if x else None,'worst':min(x) if x else None,'best':max(x) if x else None})
          se=statistics.stdev(vals)/math.sqrt(len(vals)) if len(vals)>1 else 0.0
          out={'candidate':'v147_confirmed_v111_clone','champion':'v121_champion_same_turn_unwind','candidate_sha256':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923','champion_sha256':'1a44487de886d59f612cfbd083cacadf872ad56d0db13604cbf8af0056c600c2','engine':'kaggle_environments==1.32.7','metric':'candidate_minus_champion = candidate - champion','burned_direct':direct('results/burned_v147_vs_v121.json'),'public':{'pairs':len(vals),'wins':sum(x>0 for x in vals),'losses':sum(x<0 for x in vals),'ties':sum(x==0 for x in vals),'mean':statistics.fmean(vals) if vals else None,'se':se,'mean_minus_2se':(statistics.fmean(vals)-2*se) if vals else None,'worst':min(vals) if vals else None,'best':max(vals) if vals else None,'panels':pubs}}
          Path('results/v147_v121_formal_summary.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps(out,indent=2))
          '@
          $code | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v147-v121-formal-results
          path: results/
          if-no-files-found: error
          retention-days: 30
