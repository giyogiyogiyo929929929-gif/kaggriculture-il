name: v150 promotion packaging preflight

on:
  push:
    branches: [eval-v147-resume-selfhosted-20260926]
    paths: [".github/workflows/v150-promotion-preflight-selfhosted.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct exact v150
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"
          python -m pip install --no-deps 'kaggle-environments==1.32.7'
          python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results\v150_promote | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v150_skip_noop_second_pass.py tmp\v147.py tmp\v150.py
          python -m py_compile tmp\v115.py tmp\v147.py tmp\v150.py
          @'
          import hashlib
          from pathlib import Path
          expected={
            'tmp/v115.py':'c6b9986f6cbdf8663ed33096f55e93ef665bd560d55bf9baffbe4a5f8c74fff2',
            'tmp/v147.py':'8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923',
            'tmp/v150.py':'0a5bfa1b9fa91dd7ebdee1f45640719b23a7b895cbd85cc1f4f17bddebb6387d',
          }
          for p,w in expected.items():
              g=hashlib.sha256(Path(p).read_bytes()).hexdigest(); print(p,g); assert g==w,(p,g,w)
          Path('results/v150_promote/main.py').write_bytes(Path('tmp/v150.py').read_bytes())
          '@ | python -
      - name: Kaggle-compatible preflight and build archive
        run: |
          $ErrorActionPreference='Stop'
          python scripts\preflight.py --main results\v150_promote\main.py --entry agent --build --output results\v150_promote\submission.tar.gz --json results\v150_promote\preflight.json
          if ($LASTEXITCODE -ne 0) { throw 'preflight failed' }
      - name: Verify packaged bytes and manifest
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib,json,tarfile
          from pathlib import Path
          root=Path('results/v150_promote')
          main=root/'main.py'; tar=root/'submission.tar.gz'
          main_sha=hashlib.sha256(main.read_bytes()).hexdigest()
          tar_sha=hashlib.sha256(tar.read_bytes()).hexdigest()
          with tarfile.open(tar,'r:gz') as tf:
              names=tf.getnames()
              assert names==['main.py'], names
              packed=tf.extractfile('main.py').read()
          packed_sha=hashlib.sha256(packed).hexdigest()
          assert main_sha=='0a5bfa1b9fa91dd7ebdee1f45640719b23a7b895cbd85cc1f4f17bddebb6387d',main_sha
          assert packed_sha==main_sha,(packed_sha,main_sha)
          out={'candidate':'v150_skip_noop_second_pass','main_sha256':main_sha,'archive_sha256':tar_sha,'archive_bytes':tar.stat().st_size,'archive_members':names,'packed_main_sha256':packed_sha,'packed_main_matches_source':packed_sha==main_sha}
          (root/'manifest.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v150-promotion-preflight-selfhosted
          path: results/v150_promote/
          if-no-files-found: error
          retention-days: 30
