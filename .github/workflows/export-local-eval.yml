name: export-local-eval
on:
  push:
    branches: [eval-upload-main-20260926]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && python -m pip install kaggle-environments==1.32.7
      - name: Rebuild formal champion v121
        run: python scripts/ci/rebuild_eval_agents.py --out-dir eval_agents/v130
      - name: Assemble local evaluation bundle
        run: |
          mkdir -p local_eval_bundle/vendor
          cp eval_agents/v130/v121_champion_same_turn_unwind.py local_eval_bundle/v121_champion.py
          cp -R scripts local_eval_bundle/scripts
          python - <<'PY'
          import pathlib, shutil, kaggle_environments, sys, subprocess
          pkg = pathlib.Path(kaggle_environments.__file__).resolve().parent
          shutil.copytree(pkg, pathlib.Path('local_eval_bundle/vendor/kaggle_environments'))
          pathlib.Path('local_eval_bundle/python.txt').write_text(sys.version)
          pathlib.Path('local_eval_bundle/pip_freeze.txt').write_text(subprocess.check_output([sys.executable,'-m','pip','freeze'], text=True))
          print('package', pkg)
          PY
          sha256sum local_eval_bundle/v121_champion.py > local_eval_bundle/v121_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: local-eval-bundle
          path: local_eval_bundle
          if-no-files-found: error
          retention-days: 7
