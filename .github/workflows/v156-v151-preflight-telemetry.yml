name: v156 v151 preflight telemetry

on:
  pull_request:
    branches: [eval-v156-v151-not-ahead-three-exposure-20260927]
    paths: ["ci/trigger-v156-preflight-telemetry.txt"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Reconstruct exact v151 and build v156
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'; $env:Path="$gitUsr;$env:Path"; Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps 'kaggle-environments==1.32.7'; python -m pip install jsonschema requests
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for n in ('tmp/main.py','ci/v76.patch'):
              p=Path(n); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          Push-Location tmp; patch --binary --batch -p3 -i ..\ci\v76.patch; if($LASTEXITCODE -ne 0){throw 'patch failed'}; Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v150_skip_noop_second_pass.py tmp\v147.py tmp\v150.py
          python ci\build_v151_none_observation_guard.py tmp\v150.py tmp\v151.py
          python ci\build_v156_v151_not_ahead_three_exposure.py tmp\v151.py tmp\v156.py
          python -m py_compile tmp\v151.py tmp\v156.py
          @'
          import hashlib,json
          from pathlib import Path
          c=hashlib.sha256(Path('tmp/v151.py').read_bytes()).hexdigest(); v=hashlib.sha256(Path('tmp/v156.py').read_bytes()).hexdigest()
          assert c=='54edf1f1663b161457c6d31daccb68b496e5a61dffb6f140f69af2e0b380bf31',c
          Path('results/build.json').write_text(json.dumps({'v151_sha256':c,'v156_sha256':v},indent=2),encoding='utf-8'); print(v)
          '@ | python -
      - name: Kaggle loader and malformed observation preflight
        run: |
          @'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('.').resolve()))
          from scripts import preflight
          p=Path('tmp/v156.py')
          checks=[preflight.check_last_callable(p),preflight.check_imports([p]),preflight.check_kaggle_loader(p)]
          agent=preflight.load_like_kaggle(p); checks += [preflight.check_action_shape(agent),preflight.check_fallback(agent)]
          out=[{'name':c.name,'ok':c.ok,'detail':c.detail} for c in checks]
          Path('results/preflight.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps(out,indent=2)); assert all(c.ok for c in checks),out
          '@ | python -
      - name: Internal telemetry error gate on consumed panels
        run: |
          @'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts/analysis').resolve()))
          import _common as C
          hard={'peak_2950':'opponents/peak_2950/main.py','salem_2900':'opponents/salem_2900/main.py','score_2820':'opponents/score_2820/main.py','jaxa_2802':'opponents/jaxa_2802/main.py','thomas_router_95':'opponents/thomas_router_95/main.py','tetsutani_ms':'opponents/tetsutani_ms/main.py','melon_squeeze':'opponents/melon_squeeze/main.py','shop_router_v7':'opponents/shop_router_v7/main.py'}
          rows=[]; totals={'games':0,'eligible':0,'changed':0,'ahead_skips':0,'exposure_skips':0,'errors':0}
          def one(opponent,seed,swap,label):
              mine=C.load('tmp/v156.py'); C.play(C.wrap(mine),opponent,seed,swap=swap); t=dict(getattr(mine,'telemetry',{}) or {})
              row={'panel':label,'opponent':opponent,'seed':seed,'swap':swap,'telemetry':t}; rows.append(row); totals['games']+=1
              for k in ('eligible','changed','ahead_skips','exposure_skips','errors'): totals[k]+=int(t.get(k,0) or 0)
              if int(t.get('errors',0) or 0): raise RuntimeError(row)
          for seed in range(681,693):
              for swap in (False,True): one('tmp/v151.py',seed,swap,'burned_direct')
          for name,opp in hard.items():
              for seed in range(520101,520105):
                  for swap in (False,True): one(opp,seed,swap,'hard_'+name)
          out={'candidate':'v156','champion':'v151','totals':totals,'rows':rows}; Path('results/internal_telemetry.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps({'totals':totals},indent=2))
          assert totals['errors']==0 and totals['changed']>0,out
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v156-v151-preflight-telemetry
          path: results/
          if-no-files-found: error
          retention-days: 30
