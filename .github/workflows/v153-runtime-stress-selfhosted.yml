name: v153 runtime stress selfhosted

on:
  push:
    branches: [eval-v153-v147-dense-self-exposure-guard-20260927]
    paths: [".github/workflows/v153-runtime-stress-selfhosted.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct exact v147 and build v153
        run: |
          $ErrorActionPreference='Stop'
          $gitUsr='C:\Program Files\Git\usr\bin'
          if (!(Test-Path (Join-Path $gitUsr 'patch.exe'))) { throw 'Git for Windows patch.exe not found' }
          $env:Path="$gitUsr;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsr
          python -m pip install --no-deps "kaggle-environments==1.32.7"
          python -m pip install jsonschema requests
          python -c "import kaggle_environments; assert kaggle_environments.__version__ == '1.32.7'"
          New-Item -ItemType Directory -Force -Path tmp,results | Out-Null
          Copy-Item submissions\v27_orderbook_layer_d\main.py tmp\main.py
          @'
          from pathlib import Path
          for name in ('tmp/main.py','ci/v76.patch'):
              p=Path(name); p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -
          Push-Location tmp
          patch --binary --batch -p3 -i ..\ci\v76.patch
          if ($LASTEXITCODE -ne 0) { throw 'v76 patch failed' }
          Pop-Location
          @'
          from pathlib import Path
          p=Path('tmp/main.py'); p.write_bytes(p.read_bytes()+b'\n# Force Kaggle-compatible last-callable selection.\nkaggle_submission_agent_v77 = agent\n')
          '@ | python -
          Move-Item tmp\main.py tmp\v77.py
          python ci\reconstruct_exact_v115.py tmp\v77.py tmp\v115.py
          python ci\build_v147_confirmed_v111_clone.py tmp\v115.py tmp\v147.py
          python ci\build_v153_v147_dense_self_exposure_guard.py tmp\v147.py tmp\v153.py
          python -m py_compile tmp\v147.py tmp\v153.py
          @'
          import hashlib
          from pathlib import Path
          got=hashlib.sha256(Path('tmp/v147.py').read_bytes()).hexdigest()
          assert got=='8b755e96f7d294f23297e3d452ee8b16966afbdfc440972a826d92621cbcf923',got
          print('v147_sha256='+got)
          print('v153_sha256='+hashlib.sha256(Path('tmp/v153.py').read_bytes()).hexdigest())
          '@ | python -

      - name: Runtime timing on consumed hard seeds
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json, statistics, sys, time
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts/analysis').resolve()))
          import _common as C

          seeds=[520101,520102,520103,520104]
          opponent='opponents/score_2820/main.py'

          def bench(path):
              mine=C.load(path)
              inner=C.wrap(mine)
              ts=[]
              errors=[]
              def timed(o,c=None):
                  t=time.perf_counter()
                  try:
                      return inner(o,c)
                  except Exception as e:
                      errors.append(repr(e)); raise
                  finally:
                      ts.append(time.perf_counter()-t)
              for seed in seeds:
                  C.play(timed,opponent,seed,swap=False)
                  C.play(timed,opponent,seed,swap=True)
              ts.sort()
              n=len(ts)
              def pct(p):
                  return ts[min(n-1,int(n*p))]*1000.0
              return {
                  'calls':n,
                  'median_ms':ts[n//2]*1000.0,
                  'p95_ms':pct(0.95),
                  'p99_ms':pct(0.99),
                  'worst_ms':ts[-1]*1000.0,
                  'errors':len(errors),
                  'error_samples':errors[:3],
              }

          champ=bench('tmp/v147.py')
          cand=bench('tmp/v153.py')
          ratio=(cand['median_ms']/champ['median_ms']) if champ['median_ms']>0 else None
          out={
              'engine':'kaggle_environments==1.32.7',
              'opponent':'score_2820',
              'seeds':seeds,
              'seat_swap':True,
              'champion':'v147',
              'candidate':'v153',
              'champion_timing':champ,
              'candidate_timing':cand,
              'candidate_over_champion_median_ratio':ratio,
              'nfr':{'p99_ms_lt':50.0,'worst_ms_lt':200.0},
          }
          Path('results/v153_runtime_stress.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          assert champ['errors']==0 and cand['errors']==0,out
          assert cand['p99_ms'] < 50.0,out
          assert cand['worst_ms'] < 200.0,out
          '@ | python -

      - name: Runtime interpretation
        run: |
          @'
          import json
          from pathlib import Path
          d=json.loads(Path('results/v153_runtime_stress.json').read_text(encoding='utf-8'))
          r=d['candidate_over_champion_median_ratio']
          d['relative_interpretation']='ok' if r is not None and r < 1.5 else 'review_relative_median'
          Path('results/v153_runtime_stress.json').write_text(json.dumps(d,indent=2),encoding='utf-8')
          print(json.dumps(d,indent=2))
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v153-runtime-stress-selfhosted
          path: results/
          if-no-files-found: error
          retention-days: 30
